cat": "3966258", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"img/35/1777051089.jpg\"/>\n<p>牛頓說，他如果看得比別人遠，是因為他站在巨人的肩膀上。除了向古人致敬之外，這句話的另一個意思是，科學基本上是累積的學問──雖然，科學有著嚴謹的自我修正或新陳代謝的機制。<br/>\n<font size=\"3\"><br/>\n那麼，藝術呢？為什麼我一直反覆聽到別人說，畢卡索和馬諦斯之所以開創立體派與野獸派，是因為自知比不上文藝復興的巨匠，所以要另謀出路。有沒有任何一位藝術界的牛頓用相同的口吻說：如果我有一些成就，是因為我站在巨人（例如達文西、米開朗基羅、拉斐爾）的肩膀上？<br/>\n<\/font><font size=\"3\"><br/>\n這是不是意謂著，藝術是有盡頭的，例如，文藝復興為寫實派畫下了句點？<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\">數學知識可以粗略分為概念（思維）與技術（方法）。舉個例子，垂直或直角是概念，畢氏定理是技術。最大公因數是概念，輾轉相除法是技術。當人們看見一條河，渡河是概念，船隻或橋梁是深一層的概念，造船工程與橋梁工程是技術。<\/font><\/p>\n<p><font size=\"3\">或許，我們可以這麼說，寫實是一種概念，文藝復興時期的油畫家將寫實技術（幾乎）發展到了極致。之後的藝術家確實難有突破，於是新的概念產生了（「於是」這兩個字可能過份簡化了人性中面對困境的態度）。<\/font><\/p>\n<p><font size=\"3\">立體派將事物的各個面向（「形」與「色」也可以看成不同的面向，因而產生所謂的形色分離）並列，這是概念。野獸派企圖在繪畫的物件上作評論（用扭曲的臉表達扭曲的心靈，用五顏六色的臉表示混亂的心情），這也是概念。<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"img/35/1777051090.jpg\"/><\/p>\n<\/font><\/p>\n<p>&nbsp;<\/p>\n<p><font size=\"3\">其實，有哪一幅畫不是畫家主觀情感的流露呢？野獸派只是更赤裸、更大膽，顛覆了人們對繪畫或色彩的刻板印象，本質上，野獸派的狂野和不講求格律的詩人沒什麼大不同。<\/font><\/p>\n<p><font size=\"3\">除了就寫生的對象作評論之外，馬諦斯可能還啟發一些新的概念。例如，漫畫與多元媒材。然而，當代有數不清的漫畫家可以用更簡單的線條表達更生動的人物表情與肢體動作，多元媒材也不限於剪紙。但即使這些概念的追隨者有著比馬諦斯更純熟的技術，只有馬諦斯能取得歷史上最重要的地位，因為他是先驅者，是風潮的帶動者，沒有人會挑剔他的技術乏善可陳，眾人在意的是他的思想與概念。<\/font><\/p>\n<p><font size=\"3\">我想到馬克思說過的，哲學家詮釋世界，但重要的是如何改變世界。詮釋是概念，改變是技術。你說，哪個比較重要？<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"img/35/1777051088.jpg\"/><\/p>\n<\/font><\/p>\n<p>&nbsp;<\/p>\n<p><font size=\"3\">Ps.<br/>\n後來我在散步時忽然想到一個支持畢卡索和馬諦斯的終極觀點。<\/font><\/p>\n<p><font size=\"3\">以我自己念數學的經驗，我曾經非常著迷於幫別人的證明找漏洞，邏輯上的漏洞。在經歷了一段非常非常漫長的漸悟過程後，我突然頓悟，數學最大的樂趣不在於 proof&nbsp; reading，而是proof making。用另外一種講法，我一直是數學的奴隸，直到我終於做了數學的主人。<\/font><\/p>\n<p><font size=\"3\">繪畫不也是類似嗎？一開始，我們盡可能寫實，希望畫得栩栩如生，成就感的來源是畫的對象，評斷好壞的指標是像不像，這個時候，我們是畫筆的奴隸，被寫生的對象牽著鼻子走。後來，繪畫成為表達情感的媒介，重點不在寫實（客體的實），而是寫意（主體的意）。重點在於畫家是不是有話想說，要怎麼說，這個時候，畫家才成為畫筆的主人。<\/font><\/p>\n<p><font size=\"3\">如果要用最簡單的線條素描畢卡索和馬諦斯，我會這麼速寫：他們讓繪畫成為快樂（或舒解壓力）的工具，而沒有淪為畫筆的奴隸。至於藝評家怎麼說，人們怎麼看，這些都無關緊要了。<\/font><\/p>", "comments": [{"name": "Peggy", "date": "2007-08-03 01:27:32", "url": "", "text": "結論下的好. 我想你已讀出他們心理所想的了", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "muse", "date": "2007-09-02 06:49:35", "url": "http://tw.myblog.yahoo.com/ciciclio-musewen/rss", "text": "你的這種剖析法很有道理~~~<br />\n<br />\n我也想過這件事<br />\n我想的是induce and deduce<br />\n寫實和抽象前者是deduce後者是induce<br />\n也是surface and underneath<br />\n寫實是看表面抽象是看潛藏<br />\n<br />\n趁太陽下山前帶狗出去散步<br />\n再聊!", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-09-03 10:36:35", "url": "", "text": "我可以理解這個部分：<br />\n<br />\n寫實與抽象是surface and underneath<br />\n寫實是看表面抽象是看潛藏<br />\n<br />\n但我不懂這個部分：<br />\n寫實與抽象是 deduce and induce<br />\n<br />\n但願等你溜狗完後可以抽空講解一番...<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "", "date": "2010-03-02 10:00:41", "url": "", "text": "木尸尸尸尸尸巨", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "10595509", "title": "小光頭又在客廳大便了", "date": "2007-07-30 22:34:00", "cat": "2354773", "private": false, "html": "<p align=\"center\"><font size=\"3\">&nbsp;<img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"94/1065715293.jpg\"/>\n<p>小光頭又在客廳大便了，熱騰騰的。就聽見媽咪喊：「爸比～爸比～」（聲音越來越小，因為小光頭被抱到浴室洗屁屁了&hellip;），姐姐的聲音則是越喊越大，就怕我沒聽到：「臭死了啦～爸拔～」，姐姐的早餐才吃到一半，捏著鼻子跑掉了。<br/>\n<font size=\"3\"><br/>\n我是個健忘的爸比，不曉得是因為弟弟比較好命（大熱天不用包尿片）呢？還是姐姐比較乖（很小就曉得事先通知我們要尿尿或嗯嗯）？反正，印象中姐姐沒有隨地大小便的習慣，這個屬狗的小光頭還真是沒有辜負了他這個生肖。<br/>\n<\/font><font size=\"3\"><br/>\n我左右手各拿一張衛生紙，小心翼翼地捧起那沱黃金，那種戒慎恐懼，就像是用夾子夾著燙手的碗盤，裡面是蒸好的油飯或香菇雞湯，生怕一不小心掉在地上，砸破了碗盤，糟蹋了糧食。<br/>\n<\/font><font size=\"3\"><br/>\n那坨黃金一定是假的，看看他們像爛泥巴一樣黏在地上就曉得了，黃金的熔點才不可能那麼低。我又用衛生紙擦了幾回，最後再用濕紙巾抹一抹，這才放心沒有暴殄天物。<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\">爸比聯想到好多事情：<\/font><\/p>\n<p><font size=\"3\">1.&nbsp;小光頭的命真好，有那麼多人疼他，願意當他的尿片。上面這件事發生的當天下午，我們去陽明山，爸比抱著小光頭吃晚餐，吃到一半小光頭就尿尿了，位置剛好也在爸比尿尿的地方，幸好那個時候天色漸漸暗下來了，誤會的人不多。再隔一天，小光頭改在車上尿尿，這次尿在 bu bu 媽媽的褲子上。小光頭還有更多更多隨地尿尿和嗯嗯的經驗，因為發生在阿嬤家，爸比就不清楚當時的狀況，但是，小光頭有這麼多前科，阿公阿嬤阿姨舅舅還是心甘情願地冒險，只為了讓小光頭過個乾爽的夏天。<\/font><\/p>\n<p><font size=\"3\">2.&nbsp;商周有一期介紹一個姓林或姓葉的阿嬤，是個麻瘋病患，十個手指頭伸不直，卻在樂生療養院養大了十幾個孤兒。人家訪問她，手指頭這個樣子，做事方便嗎？阿嬤回答，心甘情願就方便。如果心不甘情不願，就算十根手指頭健健康康的，恐怕也不太方便。<\/font><\/p>\n<p><font size=\"3\">3.&nbsp;小光頭和姐姐還沒出生，爸比和媽咪還沒結婚時，爸比幫一隻法國鵪鶉把屎把尿了好久，她不太會飛，但走路的姿勢非常優雅，每次嗯嗯前會先後退一步，然後屁股往後往下，噗～爸比就這樣跟在她屁股後面撿「白金」，特別在她生蛋期間，鈣質吃得比較多，白色的便便更是常見，不過她的名字小白跟嗯嗯的顏色沒有關係，小白是因為她灰白色的羽毛而得名。以前爸比喜歡想像姐姐是小白投胎的，因為爸比很懷念小白撒嬌的模樣。現在覺得小光頭也可能是小白投胎，否則怎麼那麼喜歡讓爸比跟在後面把屎把尿。<\/font><\/p>\n<p><font size=\"3\">4.&nbsp;姐姐小時候的麻煩是吐。每次半夜睡到一半咳嗽，不咳到吐絕不罷休，吐得棉被也是，床墊也是，有時候衣服也是，頭髮也是&hellip;全身都是。爸比的臉比小光頭的嗯嗯還臭──睡得正香被吵起來洗棉被換床單豈有臉不臭的道理？有，媽咪的臉就不臭，她還會很心疼姐姐的身體，「咳到沒辦法好好睡，營養又都吐出來了...唉」聽得貪睡的爸比睡意全消，又慚愧，又佩服母愛的偉大。<br/>\n<br/>\n所以，反應遲鈍，嗅覺遲鈍，什麼都遲鈍的爸比專門負責處理便便與吐吐，因為嗅覺靈敏又害怕病菌的媽咪很怕便便與吐吐。除此之外，其他洗澡、餵奶、所有照顧小 baby 的事情，她全部一手包辦了。所以呢，爸比只記得上面這些有關尿啊、便啊、吐啊的事情，其他沒有經歷過，自然就不曉得要怎麼寫了。<\/font><\/p>", "comments": []}, {"id": "10532527", "title": "改編", "date": "2007-07-27 15:47:00", "cat": "3966263", "private": false, "html": "<p><font size=\"3\">改編通常是將訊息裝到不同的載體，這些載體通常是不同的藝術型式：語言、音樂、劇本、舞蹈、電影…，其實，翻譯也該算是一種改編，不同語言雖然都是語言，但有各自的文法與慣用語。<\/font><\/p>\n<p><font size=\"3\">改編其實是一種再詮釋的過程，甚至於同一首音樂的再演奏也可視為改編。改編的過程裡，改編者可以強調自己最受感動的部分。雲門舞集的白蛇傳、韋伯的歌劇魅影、李安的色戒都顯示出改編的創意。<\/font><\/p>\n<p><font size=\"3\">本來我想解讀 Linda Pastan 的 <a href=\"#/post/10358214\" target=\"_blank\">Only Child<\/a>，解讀的重點雖然是最晦澀難解的部分，卻不得不把整個 settings 交待一下，漸漸地，就形成了一種很像翻譯又不像翻譯的東西，我自己覺得蠻好玩的，這就開頭提到的，翻譯也算是一種改編。<\/font><\/p>", "comments": [{"name": "sharon", "date": "2007-07-28 23:05:26", "url": "", "text": "我剛由義大利旅遊回來, 看到&quot;達文西&quot;就想進去看看是什麼, <br />\n結果竟然看完了你blog中所有的文章, 多才多藝, 寫得真好,<br />\n感動之餘, 敢問你有&quot;粉絲&quot;俱樂部嗎?", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-07-30 01:33:54", "url": "", "text": "謝謝你的讚美，我實在愧不敢當，粉絲云云更是讓人面紅耳赤，我們只是剛好對同樣的事物有同樣的感觸吧 ^_^<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "10532295", "title": "色，戒", "date": "2007-07-27 15:30:00", "cat": "3966263", "private": false, "html": "<p><font size=\"3\">先說張愛玲小說的幾個特色：<\/font><\/p>\n<p><font size=\"3\">張愛玲的主角都是女人，可憐的女人，被父系社會（包含封建制度）所迫害的女人。<\/font><\/p>\n<p><font size=\"3\">張愛玲的觀察力到了匪夷所思的地步，可以當一流偵探，她對人物穿著、環境細節的描述，也許不像照相機那麼完整，但比照相機多了深度導覽，指出我們疏忽的細節。<\/font><\/p>\n<p><font size=\"3\">張愛玲把小說寫成詩。我的意思不是詩情畫意，而是詩的含蓄與暗示性。他的小說不是線性的，是時空交錯的，是今昔夾雜的，並不容易一次就讀懂，讀者得耐著性子讀第二次、第三次，才能逐漸嚼出味道。因為張愛玲把小說提煉成詩，篇幅自然就縮短了，還好是短篇，否則願意讀張愛玲的人可能更少。<\/font><\/p>\n<p><font size=\"3\">再來說《色，戒》。<\/font><\/p>\n<p><font size=\"3\">《色，戒》為紅顏薄命下了很好的註解。（不薄命就好嗎？想想《金鎖記》就有答案了。）<\/font><\/p>\n<p><font size=\"3\">愛情是女人的十字架。王佳芝先是為愛成為情報人員，接著又為愛拋棄身為情報人員的職責。道德枷鎖是男性所打造的，女性基本上並沒有道德感，不論是職業道德或倫理道德，愛情勝過一切。男人當臥底，和敵人的友情頂多只值幾滴淚水，該大義滅親還是要大義滅親。女人當臥底呢，和敵人的愛情值得自己犧牲一切。<\/font><\/p>\n<p><font size=\"3\">除了愛情是毒藥之外，美色也是不幸的。張愛玲這麼描述王佳芝：<\/font><\/p>\n<p><font face=\"標楷體\" size=\"3\">因為沒戀愛過，不知道怎麼樣就算是愛上了。從十五六歲起她就只顧忙著抵擋各方面來的攻勢，這樣的女孩子不大容易墜入愛河，抵抗力太強了。<\/font><\/p>\n<p><font size=\"3\">也許「色，戒」講的就是美貌與愛情這兩樣害死女人的東西吧。<\/font><\/p>\n<p><font size=\"3\">想想傾城之戀的白流蘇可能真的是張愛玲筆下最幸運的美女了&hellip;<\/font><\/p>\n<p><font face=\"標楷體\" size=\"3\">傳奇里的傾城傾國的人大抵如此。處處都是傳奇，可不見得有這麼圓滿的收場。胡琴咿咿呀呀拉著，在萬盞燈火的夜晚，拉過來又拉過去，說不盡的蒼涼的故事&mdash;&mdash;不問也罷！<\/font><\/p>", "comments": [{"name": "流月無聲", "date": "2007-07-29 10:53:26", "url": "http://blog.sina.com.tw/endiana/", "text": "張愛玲筆下的女子大多是不幸的，<br />\n有時是別人囚禁她們，<br />\n有時則是她們自己禁錮自己，<br />\n讀張愛玲的小說其實很多時候不是很愉快，<br />\n她的小說華麗而蒼涼。<br />\n<br />\n她曾經說過一句很有名的話：「生命是一襲華美的袍，爬滿了蚤子。」<br />\n我想是最能代表張愛玲的吧！", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-07-30 01:28:31", "url": "", "text": "是啊，同樣是悲劇，有些悲劇能洗滌人性，張愛玲的悲劇卻讓人更加無奈，白先勇說的故事也同樣讓人快樂不起來，但我們有時就是這樣情不自禁地掉入<br />\n他們所營造的寫實氛圍當中", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "alwang", "date": "2007-10-31 05:08:07", "url": "", "text": "張愛玲對事物的描寫<br />\n確實獨特<br />\n<br />\n描寫女性的不幸<br />\n多少自我的投射<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-10-31 11:02:39", "url": "", "text": "幾乎所有寫作的人都會將自己的情感與經驗作一定程度的投射<br />\n<br />\n或者應該說，透過作者的筆和眼，自然而然便沾染了作者的習氣", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "10396317", "title": "達文西", "date": "2007-07-20 06:43:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" height=\"475\" alt=\"\" src=\"img/35/1777051085.jpg\" width=\"350\"/><\/font><\/p>\n<p><font size=\"3\">達文西對靜物幾乎不感興趣。在他的繪畫作品中，人物幾乎都是在動作進行到一半的時候被達文西的「相機」捕捉下來。而且，畫中人物的眼神幾乎都沒有對著鏡頭，這意味著畫中人物並沒有意識到畫家或觀者的存在。<\/font><\/p>\n<p><font size=\"3\">達文西求真的企圖很明顯，一方面，從動態中萃取定格當然比擺 pose 更真實，另一方面，不讓受觀測的客體察覺被觀測，才能目睹真實毫不保留的展露。<\/font><\/p>\n<p><font size=\"3\">即使受雇於幫人畫肖相，達文西仍然在擺 pose 的做作中尋找乍現的自然，例如：<\/font><\/p>\n<p><font size=\"3\">1.&nbsp;吉內芙拉．班奇無奈與疲倦的眼神──被軟禁在深宅大院之中和石膏像有何區別？<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" height=\"368\" alt=\"\" src=\"img/35/1777051082.jpg\" width=\"350\"/>&nbsp;<\/p>\n<\/font><\/p>\n<p><font size=\"3\">2.&nbsp;西西麗亞．加勒蘭尼忽然聽到有人叫喚時的回眸──少女總是左顧右盼，總是坐不住；或者，你也可以說，嬪妃們總是隨時保持警覺，等待國王的寵幸，而等待的時刻，總該養個寵物陪伴自己吧。<\/font><font size=\"3\">\n<p align=\"center\"><img loading=\"lazy\" height=\"478\" alt=\"\" src=\"img/35/1777051081.jpg\" width=\"350\"/>&nbsp;<\/p>\n<\/font><\/p>\n<p><font size=\"3\">你怎能說達文西只追求照相機式的寫實？縱然達文西對細節的要求讓人歎為觀止，但更讓人讚歎的，是他的構圖、他對畫中人物情緒的補捉。他要補捉的不僅是外表的容貌，更是內心的情緒。<\/font><\/p>\n<p><font size=\"3\">不過，達文西有兩幅肖象畫，故意讓畫中人物完全意識到畫家或觀者的存在，那就是蒙娜麗莎和施洗者約翰。其中，施洗者約翰還有手部的動作，而蒙娜麗莎則是完全的靜止，嚴格說來，蒙娜麗莎唯一的動作是微笑。<\/font><\/p>\n<p><font size=\"3\">微笑是一種終極的回應，對於觀者的回應，不論觀者的動機如何，對蒙娜麗莎的感受如何，她都報以微笑，微笑是最大的包容，讓一切歸於寧靜。<\/font><\/p>\n<p><font size=\"3\">之前提到達文西對於動態有非常深刻的信仰，按理不可能滿足於靜物的描繪，所以蒙娜麗莎肯定有話想說、有情緒想抒發、有心事想表達。大家都說蒙娜麗莎神祕，他的神祕在於無言（包含肢體語言），面對蒙娜麗莎就像面對無言的大自然一樣，我們需要自己去感受。這是一幅真的需要觀者參與的畫，真正讓觀者與畫中人物產生互動的畫。<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" height=\"590\" alt=\"\" src=\"img/35/1777051083.jpg\" width=\"380\"/>&nbsp;<\/p>\n<\/font><\/p>\n<p><font size=\"3\">蒙娜麗莎象徵著達文西追求一生的目標。這個目標可能是母親（不是有人說，他的自畫像潛藏在蒙娜麗莎底下嗎），也可能是自我，也可能是宇宙人生，不管是什麼，他最後得到的，是這個目標對他的微笑（這和佛陀拈花微笑是多麼浪漫的巧合）。<\/font><\/p>\n<p><font size=\"3\">蒙娜麗莎絕對是達文西登峰造極之作，姑且讓我引用奧修形容佛陀的話：佛陀太完美了，彷彿在天空中飛翔，遙不可及。因此，對於我這個在滾滾紅塵中不斷輪迴的凡夫俗子而言，最令我感動的不是蒙娜麗莎，而是聖母和她的母親聖安妮。<\/font><\/p>\n<p><font size=\"3\">達文西對母愛的關懷異常強烈，一般人很少提及聖母瑪莉亞的母親，但達文西畫了兩幅。<\/font><\/p>\n<p><font size=\"3\">聖安妮是那麼滿足於望著自己的女兒或孫子。那種安詳是母愛最能輻射寧靜之美的部分，相較之下，瑪麗亞則被調皮的耶穌搞得哭笑不得。耶穌被羔羊、被施洗者約翰所吸引，被殉道與犧牲所吸引。母親急著用雙手拉住要遠他而去的兒子。達文西精準的畫風好比是用相機拍下來的，當然不致於被人認作抽象畫，但他的畫充滿隱喻與象徵，比抽象畫更穿透人心，負載了更深刻的道。<\/font><\/p>\n<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" height=\"531\" alt=\"\" src=\"img/35/1777051087.jpg\" width=\"350\"/>\n<p>瑪麗亞既已身為人母，為什麼還坐在母親膝上？除了母愛，這還會象徵什麼？除了女兒對母親的眷戀，這還會象徵什麼？如果你曾經被自己的子女黏住，硬要坐在自己腿上，你再看看聖安妮的表情，你一定可以體會我要表達的意思。<br/>\n<\/p>\n<p align=\"center\"><img loading=\"lazy\" height=\"369\" alt=\"\" src=\"img/35/1777051080.jpg\" width=\"300\"/><\/p>\n<p>我們再想像一下耶穌未來即將受到的苦痛與磨難，就回想 Mel Gibson 的《受難記》好了，想像少女瑪麗亞將目睹自己的兒子受到那樣皮開肉綻的折磨，這幅畫會帶給我們多大的衝擊。達文西關心的絕不是一般人心目中的男主角，而是男主角的母親。耶穌有個愛他的母親，孤兒達文西的母親在哪裡？&nbsp;<br/>\n<font size=\"3\"><br/>\n最後，我想提及達文西的完整與缺憾。<br/>\n<\/font><font size=\"3\"><br/>\n我們活在一個重視專家的時代，但也是充滿推託之辭的時代。當達文西畫最後的晚餐，他不會推說，「透視？那是數學家的事，我只負責畫畫」；當他畫聖傑若，他不會推說，「解剖？那是醫生的事，我只負責畫畫。」<\/font><\/p>\n<\/font><\/p>\n<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" height=\"258\" alt=\"\" src=\"img/35/1777051084.jpg\" width=\"450\"/>\n<p><font size=\"3\">所有分別都是人為的，大自然萬物本來是完整的，裡面涵蓋了全部的知識與智慧。然而，縱使達文西落實了跨領域的關懷，卻因為跑不過時間，而留下了許多未完成的作品。必然會有人嘲笑達文西沒有時間觀念，但在我看來，這實在是緣於人類不可能完美的無奈。而且，達文西非常謙虛，蔣勳在《破解達文西密碼》的結尾引用了一段傳說，達文西在離開人世前問他的弟子：<\/font>&nbsp;<br/>\n<font size=\"3\"><br/>\n「<font face=\"標楷體\">我這一生，到底有沒有成就什麼？<\/font>」<\/font><font size=\"3\">&nbsp;\n<p align=\"center\"><img loading=\"lazy\" height=\"268\" alt=\"\" src=\"img/35/1777051086.jpg\" width=\"200\"/>&nbsp;<\/p>\n<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\">這臨終之語不是和《悲慘世界》中的冉阿讓如出一轍嗎？<\/font><\/p>\n<p><font face=\"標楷體\" size=\"3\">&hellip;我把壁爐上這對燭臺留給她。燭臺是銀的，但對我來說，它是金的、是鑽石的，它能把插在上面的蠟燭變成神燭。我不知道把它贈給我的那一位，在天上是否對我滿意，我已盡我所能了&hellip;<\/font><\/p>\n<p><font size=\"3\">不少人笑 Dan Brown 膚淺，他的寫作技巧或許不甚高明，但他把達文西和雨果並列，單憑這點，就讓我心甘情願地微笑以對。<\/font><\/p>\n<p><font size=\"3\">Ps.<br/>\n關於詩，Robert Frost 如是說，It begins in delight and ends in wisdom. 達文西的畫正是如此。<\/font><\/p>", "comments": [{"name": "佩珠", "date": "2007-07-20 05:29:39", "url": "", "text": "不知道為什麼，這篇文章讓我差點落淚！<br />\n也許是感動、也許是觸動了心中的某些過往的記憶、也許只是單純的被你的文字和達文西所牽動......", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-07-20 10:07:11", "url": "", "text": "佩珠：<br />\n<br />\n我自己在寫這篇文章的時候也差點流淚，我原本加了一句 smoke gets in my eyes，後來怕太煽情，才把這個句子刪掉，當然，我也想看看，是否真的<br />\n會有人讀了想哭－－在沒有任何暗示應該流淚的情況下<br />\n<br />\n事實上，我在看悲慘世界時，真的是哭著讀完的，沒有一本小說能讓我感動成那樣，比小王子更想讓我想學法語<br />\n<br />\n另外一個差點讓我流淚的地方，自然就是望著聖安妮的時候了<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "10358214", "title": "Only Child", "date": "2007-07-18 09:30:00", "cat": "3966263", "private": false, "html": "<p align=\"center\"><font face=\"Times New Roman\" size=\"3\"><font size=\"5\"><img loading=\"lazy\" height=\"405\" alt=\"\" src=\"\" data-lost=\"35/1777051079.jpg\" width=\"300\"/><br/>\n<\/font><font size=\"3\">The Two Brothers, Picasso<\/font><\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"3\"><font size=\"5\">Only Child<br/>\n<\/font>(Linda Pastan)<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">Sister to no one,<br/>\nI watched<br/>\nthe children next door<br/>\nquarrel and make up<br/>\nin a code <br/>\nI never learned <br/>\nto break.<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">Go play!<br/>\nMy mother told me.<br/>\nPlay! said the aunts,<br/>\ntheir heads all nodding<br/>\non their stems,<br/>\na family of rampant<br/>\nflowers<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">and I a single shoot.<br/>\nAt night I dreamed<br/>\nI was a twin<br/>\nthe way my two hands,<br/>\nmy eyes,<br/>\nmy feet were twined.<br/>\nI married young.<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">In the fractured light<br/>\nof memory — that place<br/>\nof blinding sun or shade,<br/>\nI stand waiting<br/>\non the concrete stoop<br/>\nfor my own children<br/>\nto find me.<\/font><\/p>\n<p><font size=\"3\"><br/>\n也算翻譯：<br/>\n<br/>\n我只有一個人，所以我怎麼也不懂，為什麼鄰家的哥哥姐姐弟弟妹妹們總能在爭吵過後馬上和好，難道他們都不記恨嗎？我怎麼也解不開，就像面對一組深奧的密碼。<\/font><\/p>\n<p><font size=\"3\">看啊，媽媽有那麼多姊姊妹妹，他們講著一樣的口頭禪，感情那麼好，長得那麼像，可我只有一個人。<\/font><\/p>\n<p><font size=\"3\">夜裡我作了一個夢，夢中的我不再孤單。因此，我在醒來之後匆匆結婚。<\/font><\/p>\n<p><font size=\"3\">然而，我還是只有一個人。記憶的烏雲有一線光明穿透，於是，我倚立門前等候，不論陰晴，等著我的子女來找我。<\/font><\/p>\n<p><br/>\n<font size=\"3\">Ps.<br/>\n1. 孩子是上天的恩賜，除了等候又能如何。<br/>\n<br/>\n2. Linda Pastan 說：「<font face=\"&#x006a19;&#x006977;&#x009ad4;\">詩談的不是知識而是情緒經驗。是要人欣賞的，可以用來慶祝，也可以做為安慰<\/font>」。我很高興，這首詩應該不會成為女兒的情緒經驗，因為她一直有個情同手足的表妹 bu bu，何況，在她四歲多的時候，又多了一個超會搞笑的弟弟。<br/>\n<br/>\n3. 這首詩出自《給要離家的女兒》（Linda Pastan著，彭鏡禧、夏燕生譯，爾雅出版）。<\/font><\/p>", "comments": []}, {"id": "10244655", "title": "畢卡索", "date": "2007-07-12 00:28:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051077.jpg\"/><br/>\n<font face=\"Times New Roman\">Les Demoiselles d'Avignon, Picasso<\/font>\n<p align=\"left\">我對畢卡索的畫向來沒有好感，通常我習慣從反面破題，但這次不同，我並不打算推翻自己的成見，反而是要為我的成見或直覺作辯護。<br/>\n<font size=\"3\"><br/>\n異於往常的不只是破題方式，我通常不談自己不喜歡或反對的東西，討論喜歡的事情都來不及了，哪有時間去發表負面的言論，更何況，批評的初衷雖然是貶抑，卻往往造成鼓勵的反效果。<br/>\n<\/font><font size=\"3\"><br/>\n畢卡索是我要提出來反對的第一個人。我之所以會違背以鼓勵代替責備的原則，原因有二，其一，他已經紅透了，沒有變得更紅的空間。其二，我曾經很茫然，不喜歡畢卡索好像是一種罪，不懂畢卡索好像是一種無藥可救的笨，如果有人曾經像我一樣害怕公開承認自己討厭畢卡索，我希望我的經驗可以給他一些支持的力量。<br/>\n<\/font><font size=\"3\"><br/>\n畢卡索一點都不難，我要批評他的話將會很簡短，所以，我想在批評之前再多說一些。我的女兒目前在蘇荷畫室學畫，一堂課大約 90 分鐘，當小朋友盡情渾灑感情與創意的時候，蘇荷很用心地幫家長安排了藝術欣賞的課程。我就是在這個情況下對畢卡索有了多一層的認識，所以，我對畢卡索的認識仍然是極其有限的，我的言辭可能很偏頗，但我實在不吐不快，請諸位畢卡索的粉絲見諒。<br/>\n<\/font><font size=\"3\"><br/>\n以前我不敢亂說畢卡索的壞話，理由很簡單，我不願意用直覺作判斷。但現在呢，我覺得討厭畢卡索真是一件合乎邏輯的事。<br/>\n<\/font><font size=\"3\"><br/>\n許多小孩在懂了所謂的立體主義跟機械製圖沒有本質上的差異之後，他們就能畫出跟畢卡索一樣「好」的作品。也就是說，你根本分不出哪個是畢卡索畫的，哪個是三歲娃兒畫的。既然如此，吹捧畢卡索難道不是一種盲從的名牌主義嗎？<br/>\n<\/font><font size=\"3\"><br/>\n畢卡索的另一項特色是故作天真，難道只因為他有足夠的寫實能力，我們就應該對他愚蠢的筆觸視而不見嗎？這個意思和以下的比喻有什麼不同？某鋼琴家錯彈了一個音符，卻被當成即興演出。某芭蕾舞者不小心跌了一跤，卻被當成精心設計的舞步。某大文豪故意寫下一段連自己都看不懂的意識流，卻被當作渾然天成的詩篇。是不是只要簽上畢卡索的大名，鬼畫符也可以變成傑作。<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\">不過，我完全同意，畢卡索有個偉大的心靈。面對照相機的挑戰，他勇於放棄已經熟練的技巧，不斷實驗，尋找新的創作方式。他那些連三歲娃兒都畫得出的抽象畫確實有其價值，那些作品是一種提醒：不要畏懼挑戰、要實驗、要創新。<\/font><\/p>\n<p><font size=\"3\">但問題是，那些畫除了哲思之外，沒有帶給我任何一丁點美的聯想或印象。沒有了美感，藝術還能叫藝術嗎，雖然美是主觀的，但我還是懷疑，有多少人能從那些所謂的立體主義作品中得到美的經驗。<\/font><\/p>\n<p><font size=\"3\">達文西的蒙娜麗莎之所以美，難道是因為他畫得很寫實嗎？寫實就能產生美感嗎？畫家如果因為自覺在寫實程度比不上照相機而轉往抽象畫發展，我深深覺得，這實在是矯枉過正了。照相機固然拍攝不出畢卡索老頭的自畫像，但同樣也拍攝不出少年畢卡索的自畫像呀。<\/font><\/p>\n<p><font size=\"3\">老實說，我並不討厭畢卡索，我頂多只是對他的立體主義畫風不起共鳴而已。真正讓我受不了的是他竟然可以紅成那樣，竟然可以畫家或藝術家的身分爆紅成那樣。<\/font><\/p>\n<p><font size=\"3\">藝術絕不能脫離美。沒有美感的東西，不論多有思想，也不能稱為藝術品。畢卡索的思想很活潑，行動能力很強，感情生活也很豐富，那就讓他當思想家，當企業家，甚至當情聖呀，幹嘛把他當成藝術大師來崇拜呢？<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051078.jpg\"/><br/>\n<font face=\"Times New Roman\" size=\"3\">The Old Guitarist, Picasso<\/font><\/p>\n<\/font><\/p>", "comments": [{"name": "Annie", "date": "2007-07-11 18:40:24", "url": "http://anniechg.blogspotc.om/", "text": "&gt;.^", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-07-12 02:46:48", "url": "", "text": "從你的留言只有一個簽名看起來，畢卡索真是紅得有理，只要簽名對了，管他內容是什麼<br />\n<br />\n前一陣子很忙，接下來還要忙，除非我先治好”心盲”的毛病", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "流月無聲", "date": "2007-07-13 04:13:00", "url": "http://blog.sina.com.tw/endiana/", "text": "評斷藝術我不內行，<br />\n只能從美的角度來說喜不喜歡，<br />\n只能敝人不喜歡畢卡索的畫風（或者也可以說看不懂）。<br />\n他的畫藝術價值到底有多高我不知道，<br />\n不過我不喜歡他這個「人」就是，<br />\n因為我總認為人還是應有某種格調才是丫~<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "amymy", "date": "2007-07-13 08:39:39", "url": "", "text": "dear bruce：<br />\n<br />\n          哈哈哈哈哈哈哈，這真是篇理直氣壯又單純的妙文！<br />\n          你清晰表達了美中要有真、有善，追尋性靈提升，拒絕醜陋的堅持<br />\n<br />\n          我實在很欣賞你的觀點，還有，敢提出來！（哈哈）<br />\n          我猜妳比較喜歡莫內喔！！？<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "北國風情 - Yolanda", "date": "2007-07-13 11:35:24", "url": "http://tw.myblog.yahoo.com/yolanda-chen/", "text": "哈哈哈，真有意思，寫得很好，有主見，有見地。<br />\n<br />\n不蠻妳說，我們會開始真正喜歡畢卡索或是去欣賞達利時是因為走訪了眾<br />\n多他們在歐洲不同地方的博物館與美術館。對於他們基礎功力之深厚而讚<br />\n嘆，也藉此讓孩子們知道基本工的重要性。孩子們看了都相繼折服。<br />\n<br />\n因為看過了他們不同時期與各式多樣的作品，其中包括素描、陶瓷藝術、<br />\n雕塑作品等，真是不得不佩服。這就如同芬蘭的搖滾樂大提琴手們<br />\nApocalytica，後來雖是以重金屬搖滾風迷歐洲，但其傳統古典樂基礎之<br />\n豐厚，令我不得不刮目相看。更讓我們家兩個，再次知道，基礎的重要。<br />\n<br />\n謝謝妳的好文分享，也恭喜上嚴選！", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-07-13 23:00:06", "url": "", "text": "to Yolanda:<br />\n<br />\n原本就期待有人指出我膚淺的地方，但又擔心被罵得體無完膚，可說是既期待又怕受傷害，沒想到竟然得到這麼委婉的提醒，謝謝你<br />\n<br />\n我非常喜歡接觸不同類型的音樂，特別謝謝你告訴我 Apocalytica 這個名字，我會去找來聽聽<br />\n<br />\nto amymy:<br />\n是啊，莫內的畫是屬於一見鍾情而且可以廝守終身的典型：給我美，其餘免談<br />\n<br />\nto 流月無聲:<br />\n依然是印象中那個改敢愛敢恨的濃烈色彩，作為男人，我對於畢卡索的多情（女生可能會用濫情）還是充滿同情的，何況，我對於天蠍座”啊，有陷<br />\n阱...然後...跳下去”這種宿命是非常有研究的<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "Monica", "date": "2007-07-14 20:57:32", "url": "", "text": "真的十分.十分贊同您的說法<br />\n您所貼出來的圖,還是畢卡索的做品中我算欣賞的<br />\n去年到西班牙,特地去了一趟畢卡索故居(現為他的美術館)<br />\n從他年輕的作品看到老<br />\n我只能說 若他晚年的作品,也能如此的受到歡迎,台灣的父母可能不少要厄挽<br />\n不知罵過多少小畢卡索 ....<br />\n因為他晚年的作品(無論畫作或陶藝)   看在才疏學淺的小女子眼中  <br />\n跟鄰居弟弟牆壁上的畫....真的...真的很像 :P<br />\n只能羨慕他命好  從年輕紅到老 ... 不像梵谷 ...<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "雅心媽咪", "date": "2007-07-15 05:59:11", "url": "http://blog.yam.com/sing1999", "text": "我對畫家或者名畫也不太懂，<br />\n但是我知道有些畫之所以受到矚目或者被崇拜<br />\n並不是全因畫家的創意、技術如何頂尖，有些<br />\n是因為作品的想法跨越了時代，背離了當時的<br />\n主流，創造了新的傳統...<br />\n也許畢卡索的畫並不精緻，但是他顛覆了藝術<br />\n的細膩，創造新的經典，功還是不可沒的吧^^", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "北歐四季", "date": "2007-07-15 13:46:59", "url": "http://life.newscandinaviandesign.com", "text": "畢卡索，我不討厭也不特別喜歡，但我敬佩他的創作精神。：）<br />\n芬蘭的Apocalyptica我也很推薦，他們可說是發展出自己獨有的音樂型<br />\n態，那是真的會直接碰觸到人心底的音樂，台灣應該有幾張專輯找得到，<br />\n但並不是全部，之前有網友跟我說不太容易找，有興趣的話，也許可先上<br />\n他們的網頁試聽喲：<br />\nhttp://www.apocalyptica.com/home/index.php<br />\n這裡則是舊時曾寫過的介紹，僅供參考<br />\nhttp://life.newscandinaviandesign.com/?p=52<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-07-15 15:06:25", "url": "", "text": "to 北歐四季：<br />\n前幾天才從周星星的部落格發現你，對於你的人生經歷十分景仰，人生是不是太多巧合了？謝謝你提供有關 Apocalyptica 的訊息，nice to meet you<br />\n（我大概從一個月前養成了閱讀周星星的習慣）<br />\n<br />\nto 雅心媽咪：<br />\n我完全同意你的看法，我只是希望藝術家能著重在給人情感上的安慰，至於文以載道這種理性思維，還是留給哲學家比較好<br />\n<br />\nto monica：<br />\n謝謝你的認同，我之所以放這兩幅畫，一方面暗示我並不那麼討厭畢卡索，一方面我不希望為了配合文章的語氣而貼上我討厭的畫（醜的東西看一次就<br />\n夠了，不需要一直虐待自己），亞維儂的少女差不多是我能接受的極限，而彈吉他的老人我很喜歡<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "張靜怡", "date": "2007-11-05 06:06:58", "url": "", "text": "你畫的好像喔~~", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-11-05 14:29:17", "url": "", "text": "啊？不曉得你指的是...這篇文章所附的兩幅圖畫都是畢卡索先生的耶...<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "路人甲", "date": "2007-12-05 14:49:18", "url": "", "text": "其實,我本身也曾在蘇和畫室學過畫<br />\n我並不認同你的想法,但也不想武斷的說你不對,但或許是你接觸藝術這方面還不夠多吧!<br />\n就像我們看不懂林懷民的&quot;狂草&quot;,那是因為我們的藝術境界還沒有達到和他一樣的水平;妳的&quot;欣賞&quot;境界還不到&quot;專業&quot;的水準,所以你不懂畢卡索的&quot;藝術&quot;和<br />\n他作品的&quot;美&quot;", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "抱歉", "date": "2007-12-25 14:30:45", "url": "", "text": "我不同意你的說法<br />\n的確 畢卡索在晚年的筆觸  相當幼稚<br />\n但是你可能不知道  <br />\n他說過一句話<br />\n&quot;藝術最終的畫 是幼稚園生的畫&quot;<br />\n他的人生過得相當曲折<br />\n他所體會過的  我相信你一定無法體會<br />\n他一直以自己的心情轉化成自己的畫<br />\n這點已經相當了不起了  <br />\n以活潑的顏色 卻表達出哀傷的情緒<br />\n我相信這不是一般人能表現的<br />\n不可能  因為&quot;畢卡索&quot;三字就能代表一切<br />\n如果沒有好的畫 沒有很棒的驚艷   <br />\n畢卡索又能代表什麼呢?<br />\n畢卡索的確有很厲害的畫功<br />\n這是他在13歲就展現出來了<br />\n一個有很棒畫功的人 <br />\n他會放棄他的畫功而去改畫一些幼稚園的東西 <br />\n你覺得是為什麼呢?<br />\n他懶惰?  他已經又成就了?<br />\n我想你應該錯了<br />\n他的成就  卻大多是來自你那些看不懂 無法體會的畫<br />\n他的畫意    如果是現在你無法體會的話 <br />\n我希望你不要給予你那輕薄的批評<br />\n這樣會顯得你很無知 可笑<br />\n就像路人甲說的一樣<br />\n你的欣賞並沒有到達 跟畢卡索一樣的水準<br />\n等你在藝術裡有更高的成就 更高的名氣<br />\n如果還能堅持你的說法 <br />\n大家就無話可說了<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "", "date": "2007-12-31 09:01:44", "url": "", "text": "恩~<br />\n不錯喔~我喜歡畢卡索ㄉ畫", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "10042067", "title": "Don't Write me Off", "date": "2007-07-01 14:31:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><font size=\"5\" face=\"Times New Roman\">&nbsp;<img loading=\"lazy\" alt=\"\" src=\"img/35/1777051076.jpg\"/>\n<p><a href=\"#/album/38\" target=\"_blank\">Don&#39;t Write me Off<\/a><font size=\"4\" face=\"Times New Roman\"><br/>\n<br/>\nIt&#39;s never been easy for me<br/>\nTo find words to go along with a melody<br/>\nBut this time there&#39;s actually something on my mind<br/>\nSo please forgive these few brief awkward lines<br/>\n<\/font><font size=\"4\" face=\"Times New Roman\"><br/>\nSince I&#39;ve met you, my whole life has changed<br/>\nIt&#39;s not just my furniture you&#39;ve rearranged<br/>\nI was living in the past, but somehow you&#39;ve brought me back<br/>\nAnd I haven&#39;t felt like this since before Frankie said relax<br/>\n<\/font><font size=\"4\" face=\"Times New Roman\"><br/>\nAnd while I know based on my track record<br/>\nI might not seem like the safest bet<br/>\nAll I&#39;m asking you is don&#39;t write me off, just yet<br/>\n<\/font><font size=\"4\" face=\"Times New Roman\"><br/>\nFor years I&#39;ve been telling myself, the same old story<br/>\nThat I&#39;m happy to live off my so called former glories<br/>\nBut you&#39;ve given me a reason to take another chance<br/>\nNow I need you, despite the fact that you&#39;ve killed all my plants<\/font><\/p>\n<\/font>\n<p>&nbsp;<\/p>\n<p><font size=\"4\" face=\"Times New Roman\">And though I know I&#39;ve already blown more chances<br/>\nThan anyone should ever get<br/>\nAll I&#39;m asking you is don&#39;t write me off, just yet<br/>\nDon&#39;t write me off just yet<\/font><\/p>\n<p><br/>\n<font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\"><font size=\"5\">不要把我劃掉<br/>\n<\/font><br/>\n<\/font><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">我向來不擅長這種事<br/>\n替旋律配上歌詞<br/>\n但這次我是真的有話想說<br/>\n所以，請原諒我寫下這些簡短而笨拙的句子<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">遇到你以後，我整個生活都變了<br/>\n不只是我的傢俱被你換了地方<br/>\n我一直活在過去，直到被你不曉得用什麼方法把我拉回來<br/>\n我好久沒有這種感覺了，從 Frankie 說 Relax 之後就沒有了<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">雖然我知道，從過往的記錄看起來<br/>\n我並不是最保險的號碼<br/>\n但我只有一個請求，不要把我劃掉，暫時還不要<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">多年來我一直對自己說（這不是新鮮事了）<br/>\n我很樂於不提那些所謂的&ldquo;當年勇&rdquo;<br/>\n但你給了我一個理由，讓我再次冒險<br/>\n我需要你啊，雖然，你把我所有的盆栽都搞死掉了<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">我也曉得，我搞砸的機會<br/>\n遠超過任何人該得到的<br/>\n但我只有一個請求，不要把我劃掉，暫時還不要<br/>\n不要把我劃掉，暫時還不要<\/font><\/p>\n<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"img/35/1777051074.jpg\" width=\"300\" height=\"444\"/>&nbsp;<\/font><\/p>", "comments": [{"name": "阿信", "date": "2007-07-09 07:42:33", "url": "", "text": "啟台兄:<br />\n時光倏忽而過，現在市場已經開始興起六年級的懷舊風了,<br />\n前陣子剛滿30的我,已經開始有&quot;前中年症候群&quot;了。", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "8390259", "title": "傷城", "date": "2007-04-02 13:41:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" height=\"348\" alt=\"\" src=\"\" data-lost=\"35/1777051071.jpg\" width=\"400\"/> \n<p>暴力是娛樂的重要元素，即便是天真無知的小孩子也喜歡看人滑倒，幸災樂禍八成是人的天性。不過，很少有人會公開承認自己喜歡暴力，因此，百分百的暴力電影就跟百分百的色情電影一樣有其侷限性，所謂侷限指的不僅是商業價值，也包含藝術價值。<br/>\n<font size=\"3\"><br/>\n色情和愛情結合，就能登上大雅之堂。那麼，暴力該和什麼結合呢？什麼樣的暴力能被容忍，甚至被歌頌呢？<br/>\n<\/font><font size=\"3\"><br/>\nMel Gibson 從《英雄本色（Braveheart）》到《受難記（The Passion of the Christ）》到《阿波卡獵逃（Apocalypto）》，一直很著迷於暴力細節的刻劃，但我們默許了，這或許是因為他打著還原歷史與譴責暴力的旗幟。<\/font><\/p>\n<\/font>\n<p><font size=\"3\">因為要譴責暴力，所以儘可能將暴力的畫面真實呈現，這是暴力電影（尤其是戰爭電影）的一種典型。另外一種典型剛好相反，專注於暴力的原因是為了歌頌暴力，這樣的講法可能會讓文明人覺得不太舒服，但只要把世界各地的法律條文攤開，就曉得這世界還有哪些地方歌頌暴力。<\/font><\/p>\n<p><font size=\"3\">我的意思是，復仇。<\/font><\/p>\n<p><font size=\"3\">復仇讓我們容忍，甚至歌頌暴力；而死刑就是一種合法的復仇，受害者對加害者的復仇，社會秩序維護者對破壞者的復仇。當我們自己是受害者或認同被害者的時候，暴力是緩解復仇情緒的特效藥。<\/font><\/p>\n<p><font size=\"3\">在《越過死亡線（Dead Man Walking）》當中，修女主張廢除死刑，一個人的生命不該由另一個人來決定何時結束、如何結束。修女對於罪犯只有一個請求：停止自欺、承認自己的罪過。<\/font><\/p>\n<p><font size=\"3\">也許每個人的良心都住著這麼一位修女，像太陽一樣不斷升起與降落，於是，犯罪後的懲罰在我們心中不斷輪迴，這是無間地獄所以無間的原因。<\/font><\/p>\n<p><font size=\"3\">在《傷城》中，周元勝的寓所擺放著許多佛像。如果我們同意居住空間反映主人的價值觀，我們可以如是推測，不需要劉正熙（或陳偉強）拿起佛像當頭棒喝，周元勝早就活在自己所建構的無間地獄之中。<\/font><\/p>\n<p><font size=\"3\">從《無間道》開始，導演就強調黑道人物同樣尋求神的庇佑，甚至比一般人更為虔誠。年輕的時候看《教父（The Godfather）》，以為切換在黑社會與教會之間的蒙太奇是一種表裡不一的反諷，年長後才知道，這是矛盾的統一。或者說，黑道人物也是人，有著和我們一樣的人性，眼前不是黑道的虛偽，而是黑道的無奈。<\/font><\/p>\n<p><font size=\"3\">東北說過，人的頭腦擅長編織痛苦，擅長把注意力焦點擺在痛苦。痛苦的另一種講法是不得不然，是無奈，也就是說，無奈是人生的視覺焦點，我們的視線跟著無奈，跟著痛苦而遊移著，這或許是我們雖然生活在黑道之外，卻依然能夠對黑道電影產生共鳴的原因吧。<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" height=\"250\" alt=\"\" src=\"\" data-lost=\"35/1777051070.jpg\" width=\"400\"/><\/p>\n<p align=\"left\"><font size=\"3\">後記：<br/>\n<br/>\n看起來，劉偉強與麥兆輝的崛起，不僅源於作品本身的價值，也源於對行銷策略的配合，願意接受一種表裡不一但可能更具誘惑的包裝方式。以《傷城》為例，雖然故事只有一個主角，兩位導演卻接受了雙雄對決的廣告策略。<\/font><\/p>\n<\/font>\n<p><font size=\"3\">預期落空的觀眾雖然一如預期被騙進電影院，卻可能在離開電影院之後進行反宣傳。最賣座的電影從來不是靠著片商的廣告行銷，而是靠著作品本身的說服力與觀眾的口碑。不實廣告不但是畫地自限、欠缺鴻鵠之志的作為，也可能扭曲了觀眾的理解，這算是《傷城》另一個讓人感傷之處。<\/font><\/p>", "comments": []}, {"id": "7699225", "title": "Seasons of Love", "date": "2007-02-14 11:35:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051067.jpg\" width=\"300\" height=\"431\"/><\/p>\n<p><font size=\"5\" face=\"Times New Roman\"><a href=\"#/album/38\" target=\"_blank\">Seasons of Love<\/a><\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">525600 minutes <br/>\n525000 moments so dear<br/>\n525600 minutes<br/>\nHow do you measure<br/>\nMeasure a year?<\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">In daylights, in sunsets<br/>\nIn midnights, in cups of coffee<br/>\nIn inches, in miles<br/>\nIn laughter, in strife<br/>\nIn 525600 minutes<br/>\nHow do you measure<br/>\nA year in the life?<\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">How about love?<br/>\nHow about love?<br/>\nHow about love?<br/>\nMeasure in love<br/>\nSeasons of love<br/>\nSeasons of love<\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">525600 minutes<br/>\n525000 journeys to plan<br/>\n525600 minutes<br/>\nHow do you measure the life of a woman or a man<\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">In truths that she learned<br/>\nOr in times that he cried<br/>\nIn bridges he burned<br/>\nOr the way that she died<\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">It&#39;s time now to sing out<br/>\nThough the story never ends<br/>\nLet&#39;s celebrate<br/>\nRemember a year in the life of friends<\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">(Remember the Love)<br/>\nOh you got to remember the love<br/>\n(Remember the Love)<br/>\nYou know that love is a gift from up above<br/>\n(Remember the Love)<br/>\nShare love, give love, spread love<br/>\n(Measure In Love)<br/>\nMeasure, measure your life in love<br/>\nSeasons of love<br/>\nMeasure your life in love&nbsp;<br/>\n<\/font><br/>\n<br/>\n<br/>\n<font size=\"3\" face=\"&#x006a19;&#x006977;&#x009ad4;\"><font size=\"5\">愛的時光<\/font><br/>\n<br/>\n<font size=\"4\">五十二萬五千六百分鐘<br/>\n五十二萬五千個動人的時刻<br/>\n五十二萬五千六百分鐘<br/>\n你要怎麼測量<br/>\n測量一年的生活？<\/font><\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">用日出？用日落？<br/>\n用午夜？或是用喝了幾杯咖啡？<br/>\n用方寸計算？或是用道里計算？<br/>\n用歡笑？用爭吵？<br/>\n或是用五十二萬五千六百分鐘<br/>\n你要怎麼測量<br/>\n一年的生活<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">用愛吧<br/>\n用愛吧<br/>\n用愛吧<br/>\n用愛來測量<br/>\n用愛的時光<br/>\n愛的時光<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">五十二萬五千六百分鐘<br/>\n五十二萬五千個籌畫中的旅行<br/>\n五十二萬五千六百分鐘<br/>\n你要如何測量男人或女人的一生<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">用她領悟了多少事實？<br/>\n用他痛哭了多少次？<br/>\n用他炸毀了幾座橋？<br/>\n還是用她心碎過多少方式？<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">是時候了，唱出來吧<br/>\n雖然故事永遠不會結束<br/>\n讓我們慶祝<br/>\n並記得這一年有朋友的日子<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">（記得愛）<br/>\n你一定要記得愛<br/>\n（記得愛）<br/>\n你曉得愛是老天的恩賜<br/>\n（記得愛）<br/>\n分享愛，付出愛，傳播愛<br/>\n（用愛來測量）<br/>\n用愛來測量你的一生<br/>\n用愛的時光<br/>\n用愛來測量你的一生<\/font><\/p>\n<p align=\"center\">&nbsp;<img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051068.jpg\"/><\/p>", "comments": [{"name": "Annie", "date": "2007-02-16 00:10:49", "url": "http://anniechg.blogspot.com/", "text": "祝　Bruce　～<br />\n<br />\n恭賀新禧．新年快樂！<br />\n心想事成．萬事如意！<br />\n闔府平安．健康幸福！<br />\n<br />\n&gt;.^", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "Annie", "date": "2007-03-05 20:45:43", "url": "http://anniechg.blogspot.com/", "text": "剛才看到了幾篇邀 Bruce 去瞧瞧－－<br />\n<br />\n070220：維納斯讀情詩　http://blog.yam.com/tonyblue/article/8298251<br />\n070301：前列腺閹色男　http://blog.yam.com/tonyblue/article/8519625<br />\n070303：記得教我跳舞　http://blog.yam.com/tonyblue/article/8541685<br />\n<br />\n有詩、有音樂、有精典劇情、…<br />\n你一定會喜歡<br />\n<br />\n&gt;.^", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "yaya718", "date": "2007-03-29 17:23:40", "url": "", "text": "hihi 忘言居士  好久不見  我也超愛吉屋出租耶  你寫得好棒呢  看來我們有好多很相似的喜好...", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "Annie", "date": "2007-04-06 20:24:11", "url": "http://anniechg.blogspot.bom/", "text": "♡♡ 邀請你來小婆家欣賞櫻花 ♡♡<br />\n<br />\nhttp://anniechg.blogspot.com/2007/04/20070405.html<br />\n<br />\n&gt;.^", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "7669186", "title": "火線交錯　Babel", "date": "2007-02-12 10:54:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><font size=\"3\">&nbsp;<img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051072.jpg\"/>\n<p><br/>\n《Babel》的片名即使不算晦澀難解，至少是具有爭議性的，不妨讓我們從片尾的題獻看起吧。<br/>\n<font face=\"Times New Roman\" size=\"4\"><br/>\nTo my children - my brightest lights in the darkest night.<br/>\n<\/font><font size=\"3\"><br/>\n所以，《火線交錯》的主題是「孩子」，這樣的講法可能會引起一些人抗議──主題應該是「溝通」吧，怎麼說呢？<br/>\n<\/font><br/>\n<font face=\"標楷體\" color=\"#993300\" size=\"5\">溝通<br/>\n<\/font><font size=\"3\"><br/>\n美國旅客意外遭到調皮的摩洛哥少年槍擊，順理成章地被扭曲為恐怖事件。墨西哥保姆在三更半夜帶著兩個美國小孩越過邊境，同樣順理成章地被扭曲為綁架事件。這平行發生的兩件事有著十分工整的對仗關係：兩個未成年的孩子，和他們的監護人，在沙漠中逃亡。<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051065.jpg\"/><\/p>\n<p align=\"left\"><font size=\"3\">除了英語、阿拉伯語、西班牙語、日語之外，手語是另外一種語言，使用這個語言的民族比摩洛哥人或墨西哥人更弱勢，受到的歧視比其他民族更悲慘。語言的確有強弱之分，我們很難期待強弱雙方採取平等的溝通方式，強勢的一方可以拒絕溝通（如同耳聾的少女所受的待遇），也可以要求盤查（如同墨西哥駕駛所受的待遇）。<br/>\n<\/font><font size=\"3\"><br/>\n如果再加上聖經巴別塔故事一開頭就提到語言，我們很容易辨認出電影《火線交錯》的主題具有「溝通」這項元素。相較之下，「孩子」這項主題元素並不那麼明顯，但比重卻強得多。<br/>\n<\/font><font face=\"標楷體\" color=\"#993300\" size=\"5\"><br/>\n孩子<br/>\n<\/font><font size=\"3\"><br/>\n不妨先開個玩笑：Babel 的前 4 個字母是 Babe，而 Babe 就代表「小孩」。如果覺得這種聯想太牽強，讓我們再換個單字，有人認為 Babel 就是 Babylon，而 Babylon 的前 4 個字母是 Baby。<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051062.jpg\"/><\/p>\n<p align=\"left\"><font size=\"3\">現在讓我們看看《火線交錯》中的孩子。<br/>\n<\/font><font size=\"3\"><br/>\n美國：Roger 和 Susan 最小的孩子才剛猝死於嬰兒床上，女兒 Debbie 和兒子 Mike 又困在沙漠中孤立無援。<br/>\n<\/font><font size=\"3\"><br/>\n摩洛哥：Abdullah 的大兒子 Ahmed 追求父親的肯定，但與弟弟 Yussef 爭寵的結果只換來自卑；另一方面，對生理好奇的 Yussef 和渴望愛情的姊姊 Zohra，他們在地廣人稀的沙漠裡將彼此當成夢中情人，但快樂時光是短暫的，他們隨時都處在被哥哥揭發祕密的恐懼當中。<br/>\n<\/font><font size=\"3\"><br/>\n日本：島田的女兒知惠子有聽覺障礙，愛情像摩洛哥的 Zohra 一樣遙遙無期，Zohra 從弟弟身上取材，而知惠子則把電視上看來的故事情節複製到現實人生，嘗盡了鄙視和拒絕之苦。<br/>\n<\/font><font size=\"3\"><br/>\n我不確定將這部電影獻給子女的導演想說什麼，但他給我的啟發是：孩子在獨立之前，父母絕不能將視線移開，沒有任何藉口可以將視線移開，甚至連另一個孩子的死都不能是藉口。<br/>\n<br/>\n片<\/font><font size=\"3\">中的三個家庭都非常富有，買得起最時髦的玩具（來福槍），可以聘請 24 小時的保姆照顧生活起居，可以就讀一流的特殊教育學校補救先天的殘障。<br/>\n<\/font><font size=\"3\"><br/>\n但孩子最需要的可能只是爸爸媽媽陪著他一起長大，而不是把陪伴這件事委託給玩具、保姆，或老師。真正的陪伴在平常並不容易察覺，只有在孩子的行為即將發生偏差，甚至要跌倒、受傷的時候，我們才會發現，父母慈悲的雙手早就已經在孩子的身邊守候。<br/>\n<\/font><font size=\"3\"><br/>\n除了「溝通」，除了「孩子」，《Babel》可能還有一個更重要的主題元素，這得從聖經中的巴別塔說起了。<br/>\n<\/font><font face=\"標楷體\" color=\"#993300\" size=\"5\"><br/>\n巴別塔的正面意義<br/>\n<\/font><font size=\"3\"><br/>\n聖經巴別塔的故事提到了人類分崩離析，遷居到不同的地方，使用不同的語言。或許《火線交錯》選擇抓住這個聖經故事的一角，選擇以「溝通不良」來詮釋巴別塔的崩塌，若從這樣的角度來看，重建巴別塔就有了「互相諒解」的正面意義。<br/>\n<\/font><font size=\"3\"><br/>\n電影鏡頭最後停在一棟彷彿是巴別塔的樓頂，樓頂上放著父親對女兒的愛，或許這意味著上帝從未離棄人類，也或許意味著重建巴別塔的關鍵在於愛，一種無私的愛。<br/>\n<\/font><font size=\"3\"><br/>\n這樣的觀點可能是各界對這部電影最普遍的解讀方式，事實上這也是《火線交錯》給我的第一印象，這樣的觀點沒什麼不好，電影是否發人深省，遠比他引導出什麼樣的省思，以及這個省思和電影作者的企圖是否一致來得更重要。<br/>\n<\/font><font size=\"3\"><br/>\n話雖如此，拋開個人的成見或期待，用比較客觀的角度來看巴別塔，是一件非常有趣而且意義深遠的事情。<br/>\n<\/font><font size=\"3\"><font face=\"標楷體\" color=\"#993300\" size=\"5\"><br/>\n巴別塔的負面意義<\/font><br/>\n<br/>\n直接讓我們打開天窗說亮話好了，「溝通」很可能根本不是聖經中的巴別塔所要傳遞的訊息，它頂多只是巴別塔寓言中最表面的意思。以下挑幾個聖經巴別塔寓言較不容易察覺的寓意，這些寓意很可能比「溝通」更值得我們深思。\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051058.jpg\"/><\/p>\n<p><font size=\"3\">1.&nbsp;巴別塔意味著人對自我的崇拜，對科學技術的崇拜。<br/>\n2.&nbsp;人們建造巴別塔的目的在於傳揚自己的名字，而非上帝的名字。<br/>\n3.&nbsp;巴別塔展現人們的控制慾與權力慾（渴望擁有控制萬物的權力），但人們註定沒有通天的本領，巴別塔註定要崩塌。<br/>\n4.&nbsp;真正能夠拯救心靈的不是「高塔」，而是「山谷」，不是控制，而是臣服。<br/>\n<\/font><font size=\"3\"><br/>\n從這樣的角度來看，巴別塔是一個絕對負面的字眼，是應該要極力摧毀的概念。回想建造巴別塔之初，人類的世界只有一種語言，因此，重建巴別塔就是要否定多元價值，讓世界重回一言堂。<\/font>&nbsp;<\/p>\n<\/font><\/p>\n<\/font><\/p>\n<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\">很不幸，重建巴別塔不是神話，不是寓言，而是一直在發生的事情，任何時代似乎總有獨裁者向人們宣揚世界統一或種族淨化的美夢，但最後的結果呢？總是整個世界陪著他們一起作噩夢，秦始皇如此，希特勒也是如此。<\/font><\/p>\n<p><font size=\"3\">那麼，在電影《Babel》中，什麼是巴別塔呢？或者說，此時此刻企圖引領全球文化風潮或普世價值觀的是誰呢？<\/font><\/p>\n<p><font size=\"3\">當然是：美國。<\/font><\/p>\n<p><font size=\"3\">在《火線交錯》中，美國企圖將控制權伸入摩洛哥（Roger v.s.當地導遊）、墨西哥（邊境警察 v.s. 闖關的駕駛）與日本三個地方，但真正買帳的只有日本，摩洛哥和墨西哥堅持保有自己的尊嚴，自己的文化。<\/font><\/p>\n<p><font size=\"3\">老實說，墨西哥導演毫不遮掩他對自己民族文化的熱愛，以及他對日本的歧視。電影中的墨西哥婚禮，現場演奏的民俗音樂讓人驚豔；反觀日本的次文化既缺乏創意（舞廳播放的音樂是美國的 disco）又低級無比（色情電視），甚至連故事本身都把槍擊事件的原罪歸咎日本。<\/font><\/p>\n<p><font size=\"3\">日本在電影中被刻意塑造成東方的美國，這不僅是音樂上被征服，也包含了建築元素的統一，當電影最後一幕從父女的特寫伸展為城市的長鏡頭時，我們幾乎很難辨認眼前是紐約或東京。這也傳達出導演對於巴別塔企圖將語言文化統一的不以為然。<\/font><\/p>\n<p><font face=\"標楷體\" color=\"#0000ff\" size=\"5\"><br/>\n<font color=\"#993300\">向墨西哥致敬<\/font><\/font><\/p>\n<p><font size=\"3\">這位墨西哥導演 Alejandro Gonz&aacute;lez I&ntilde;&aacute;rritu 真是太厲害了，他讓美國人出大筆鈔票，讓日本人出一流演員，結果卻不著痕跡地、狠狠地打了美國及其附庸（日本）的耳光，這正是俗話說的：被人賣了都不曉得，還跟著一起數鈔票。<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051064.jpg\"/><\/p>\n<p><font size=\"3\">美國和日本當然不笨，只是墨西哥太聰明了，電影《Babel》設計了足夠豐富的障眼法，讓自大與膚淺的美國和日本只看見他們想看見的，這個障眼法就是大家都看見的「溝通」。<br/>\n<\/font><font size=\"3\"><br/>\n溝通失敗或產生誤解的原因不僅是語言文化的差異，也在於語言文字是依附時間的，是直線進行的，但事情往往在一瞬間同時發生，語言文字難以忠實呈現。更糟的是，只要刻意顛倒一下說故事的次序，聽故事的人很容易就被搞得暈頭轉向，這也是《火線交錯》不容易在第一次就看懂的原因，太多事件交錯呈現，而呈現的時間順序又有些紊亂。<br/>\n<\/font><font size=\"3\"><br/>\n美國人很可以陶醉於「誤解」這個概念，覺得全世界都誤解他們作為世界警察的善意。事實上，美國人似乎很喜歡大方坦承自己不了解其他國家，或許他們的重點在表現大方，以及期待其他國家也承認自己不了解美國。<br/>\n<\/font><font size=\"3\"><br/>\n日本人也很可以陶醉於「誤解」這個概念，覺得自己有種神祕的美感。<br/>\n<\/font><font size=\"3\"><br/>\n例如，我們無從得知日本媽媽是怎麼死的，如果是自殺，為什麼要自殺？女兒寫給警察的字條上寫的又是什麼？<br/>\n<\/font><font size=\"3\"><br/>\n爸爸說媽媽用槍自殺，女兒說媽媽跳樓自殺。以說話的情境而言，當然爸爸的話比較足以採信。那麼，媽媽用爸爸的槍自殺很可能帶有因爸爸而死的寓意，什麼樣的丈夫會讓妻子想要自殺呢？<br/>\n<\/font><font size=\"3\"><br/>\n另一方面，女兒為什麼要騙人呢？他是不是不願面對殘酷的事實，寧願活在虛假的幻想，想像爸爸媽媽始終是相愛的，想像自己沒有看到媽媽死亡的那一幕？<br/>\n<\/font><font size=\"3\"><br/>\n日本線的故事留下那麼多神祕的問號，壓軸鏡頭又選在日本結束，日本人自我陶醉都來不及了，哪還會注意到墨西哥人用手語罵他們？<\/font>&nbsp;&nbsp;<\/p>\n<\/font><\/p>\n<p>&nbsp;<\/p>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051059.jpg\"/><\/p>\n<p><font size=\"3\">Ps.<br/>\n這篇文章是近來寫作時間最久的一次，之所以會耐著性子把它寫完，起因於對奧修的懷念、起因於對曾慶豹教授<a href=\"http://tci.fhl.net/bulletin7_1_1.htm\" target=\"_blank\">《巴別塔與後現代之源》<\/a><\/font><font size=\"3\">這篇文章的佩服，當然，也起因於舊約聖經創世紀的第 11 章：<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">And the whole earth was of one language, and of one speech. <\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">And it came to pass, as they journeyed from the east, that they found a plain in the land of Shinar; and they dwelt there. <\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">And they said one to another, Go to, let us make brick, and burn them thoroughly. And they had brick for stone, and slime had they for morter. <\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">And they said, Go to, let us build us a city and a tower, whose top may reach unto heaven; and let us make us a name, lest we be scattered abroad upon the face of the whole earth. <\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">And the LORD came down to see the city and the tower, which the children of men builded. <\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">And the LORD said, Behold, the people is one, and they have all one language; and this they begin to do: and now nothing will be restrained from them, which they have imagined to do. <\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">Go to, let us go down, and there confound their language, that they may not understand one another's speech. <\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">So the LORD scattered them abroad from thence upon the face of all the earth: and they left off to build the city. <\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">Therefore is the name of it called Babel; because the LORD did there confound the language of all the earth: and from thence did the LORD scatter them abroad upon the face of all the earth.<br/>\n<br/>\n<font face=\"Arial\" size=\"3\">（King James Version）<\/font><\/font><\/p>", "comments": [{"name": "Annie", "date": "2007-02-12 22:15:58", "url": "http://anniechg.blogspot.com/", "text": "WOW!<br />\n<br />\nI will read this article carefully later.<br />\n<br />\n&gt;.^", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "kevincs", "date": "2007-02-13 13:30:30", "url": "", "text": "但我覺得日本那邊的故事很美呢<br />\n我認為則是父女仇恨的冰釋<br />\n其中我覺得爸爸說的是對的<br />\n但卻因為這樣    而導致兩人不停地被警察騷擾<br />\n所以女兒才要再編出一個新的故事不讓爸爸再被騷擾<br />\n<br />\n但其實我覺得這部電影算是導演的一次退步呢<br />\n雖然仍在水準之上", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "10855470", "title": "我的老天爺，今天只有 14 度", "date": "2007-01-28 12:49:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835297.jpg\"/><br/>\n<br/>\n<p align=\"left\">平常姐姐早上上學時，都由把拔打點，父女倆出門時，我通常還在暖暖的被窩裏賴床。星期一把拔因為學校有事必須提早出門，打點女兒的事自然就落在我的身上。一想到明天早上只有十來度，我忍不住就說：&nbsp;<br/>\n<font size=\"3\"><font color=\"#800080\"><br/>\n「唉喲，一想到明天有寒流還要那麼早起就覺得好冷哦。」<\/font>說完，我忍不住抖了一下。<br/>\n<\/font><font size=\"3\"><font color=\"#ff99cc\"><br/>\n<\/font><font color=\"#ffcc99\">「沒關係，妳不用擔心，我會幫妳的忙。」<\/font>女兒馬上跑過來說：<font color=\"#ffcc99\">「妳啊，明天早上只要把ㄋㄟㄋㄟ放進奶瓶給我，我自己搖就好了。等我喝完，處理好自己的事情，我再去叫妳，妳再帶我下去坐娃娃車就好了。」<\/font>她說得好認真，好認真。<br/>\n<\/font><font color=\"#800080\" size=\"3\"><br/>\n「ㄡ，妳對我真好，可是我很怕會來不及，遲到耶。」<br/>\n<\/font><br/>\n&nbsp;<font size=\"3\"><font color=\"#ffcc99\">「妳放心，我真的不會賴床，不信，妳明天早上就知道了，真的。」<\/font>當她用慧黠的雙眼盯著妳的時候，妳真的會相信她對妳作的承諾。<br/>\n<\/font><font size=\"3\"><br/>\n第二天早上一起床，她果然「言而有信」，不僅不賴床，下了床還盯著客廳的溫度計，邊走邊喊：<font color=\"#ff99cc\"><font color=\"#ffcc99\">「我的老天爺，今天只有 14 度&hellip;」<br/>\n<\/font><br/>\n<\/font>2007.1.28<\/font><\/p>\n<\/font><\/p>", "comments": []}, {"id": "10877059", "title": "明天葉老師一定會說...", "date": "2007-01-27 14:41:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835398.jpg\"/>\n<p>姐姐頭髮過肩，好幾次想幫她剪她都不肯。最近寒流來襲，每次洗完頭都得花上一陣功夫才能把頭髮吹乾，我忍不住，又舊話重提。<br/>\n<font color=\"#800080\" size=\"3\"><br/>\n「微微，我幫妳把頭髮剪短好不好？」<br/>\n<\/font><font color=\"#ffcc99\" size=\"3\"><br/>\n「不要，我要留長。」<br/>\n<\/font><font color=\"#800080\" size=\"3\"><br/>\n「那，剪前面就好，妳的頭髮已經要刺到眼睛了。」<br/>\n<\/font><font color=\"#ffcc99\" size=\"3\"><br/>\n「好，那妳幫我剪『小丸子』那樣的髮型。」<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800080\">「那很難耶，要怎麼剪啊？」<\/font>真是傷腦筋。<\/font><\/p>\n<p><font size=\"3\"><font color=\"#ffcc99\">「就是這邊比較長，然後這邊比較短ㄚ。」<\/font>她比出手勢。<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800080\">「我知道，我是說，這種髮型很難剪&hellip;我試試看，可是如果失敗了妳不能哭ㄡ。」<\/font> 我先跟她約法三章。<\/font><\/p>\n<p><font size=\"3\"><font color=\"#ffcc99\">「失敗了就會很醜ㄡ？」<\/font>她望著我問。<\/font><\/p>\n<p><font color=\"#800080\" size=\"3\">「對呀。」<\/font><\/p>\n<p><font color=\"#ffcc99\" size=\"3\">「ㄡ&hellip;好，我不會哭。」<\/font><\/p>\n<p><font size=\"3\">整個剪髮過程，她全程參與，結束後，她甩甩頭，對著鏡子看&hellip;<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800080\">「雖然不像小丸子，但是也蠻可愛的啦。」<\/font>左看看右看看，似乎還蠻滿意的。<font color=\"#ffcc99\">「明天葉老師一定會說：『唉喲，靜微，妳剪頭髮了啊，好可愛ㄡ~』」<\/font>。<br/>\n<br/>\n2007.1.27<\/font><\/p>", "comments": []}, {"id": "11071969", "title": "妳今天在公司有沒有吃蓮霧", "date": "2007-01-16 18:09:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835390.jpg\"/>\n<p>星期二晚上，照例，我從ㄚ嬤家回來時會去 YAMAHA 教室等姐姐下課一起回家。今天音樂班提早下課，我手機又剛好沒電，空等幾分鐘後，遇見鋼琴老師，才知父女二人早已回家。於是我快步走，想和他們在街上來個不期而遇。好不容易到了家，按了樓下電鈴，門一開，就聽到姐姐站在樓梯口喊：<br/>\n<font size=\"3\"><font color=\"#ff99cc\"><br/>\n<\/font><font color=\"#ffcc99\">「媽媽，妳快點上來聽〈老鼠愛大米〉。」<\/font>這首歌是她跟學校裏的同學學的。<br/>\n<\/font><font size=\"3\"><font color=\"#800080\"><br/>\n「妳們倆個實在很過份，竟然沒有等我就回來，害我一個人傻傻的坐那麼久。」<\/font> 其實我並沒有動怒，只想看看她的反應，於是又加油添醋了一番。「<font color=\"#800080\">妳看，我的腳都起水泡了，怕來不及，我還用跑的&hellip;&hellip;」<br/>\n<\/font><\/font><font size=\"3\"><font color=\"#ffcc99\"><br/>\n「ㄚ我們有打妳的手機，妳都不接啊。」<\/font>她覺得很無辜，眉頭跟著皺了起來。<\/font><\/p>\n<\/font><\/p>\n<p><font color=\"#800080\" size=\"3\">「我手機沒電啊，我哪一次沒有去等妳下課，上次你們沒等我，今天竟然又沒等，真的很過份耶。」<\/font><\/p>\n<p><font size=\"3\"><font color=\"#0000ff\">「那妳手機為什麼不充電？」<\/font>把拔端了一盤水果出來。<\/font><\/p>\n<p><font size=\"3\"><font color=\"#ffcc99\">「對嘛。」<\/font>姐姐跟著附和一句。<\/font><\/p>\n<p><font color=\"#800080\" size=\"3\">「人家只有一個電池啊。」<\/font><\/p>\n<p><font size=\"3\"><font color=\"#ffcc99\">「那為什麼妳不買兩個？」<\/font>咦？開始質疑我了？？<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800080\">「ㄚ我沒有那麼多錢錢，怎麼買兩個？」<\/font>姐姐一時之間也不知要說什麼好，便低頭吃水果&hellip;&hellip;&hellip;<\/font><\/p>\n<p><font color=\"#ffcc99\" size=\"3\">「妳今天在公司有沒有吃蓮霧？」<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800080\">「沒有。」<\/font> <\/font><\/p>\n<p><font color=\"#ffcc99\" size=\"3\">「那棗子呢？」<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800080\">「也沒有。」<\/font>問這個幹嘛呢？<\/font><\/p>\n<p><font size=\"3\"><font color=\"#ffcc99\">「那我這些給妳吃，是給妳的補償&hellip;&hellip;&hellip;」<\/font> 說完，看著我，露出天真的笑容。<font color=\"#ffcc99\">「因為我們今天沒有等妳。」<br/>\n<\/font><br/>\n2007.1.16<\/font><\/p>", "comments": []}, {"id": "7308589", "title": "父子 v.s. 墨攻", "date": "2007-01-15 18:40:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051056.jpg\"/>\n<p><br/>\n最近看的兩部電影是郭富城的《父子》與劉德華的《墨攻》，如果分開來看，並沒有特別的感觸，但如果將兩部片合在一起，就有些意思了。<br/>\n<font size=\"3\"><br/>\n《墨攻》是一個不平凡的故事，可惜沒有拍好；《父子》是一個平凡的故事，但拍得不錯。這兩部片剛好可以作為「形式（form）」與「內容（content）」的註解。<br/>\n<\/font><font size=\"3\"><br/>\n通常，文學家並不主張「文以載道」，甚至，文學家很可能擔心焦點被模糊而反對「文以載道」。文學家在意的是「文」，不是「道」。「文」這個字不但看起來清高，基本上它的目標也只是看起來清高就夠了。孔子說過：「質勝文則野，文勝質則史。文質彬彬，然後君子。」因此，「文」重視的是外在美，是表面功夫。<br/>\n<\/font><font size=\"3\"><br/>\n還記得在大學時代，電影欣賞那門課的教科書以《教父》作為例子，陳述了這麼一個概念：故事的內容是什麼不重要，重要的是你怎麼說這個故事，這才是藝術或文學關注的焦點，這才是衡量藝術或文學價值的標準。為了支持這個概念，經常被引用的例子還有 Jane Austen &nbsp;和張愛玲。<br/>\n<\/font><font size=\"3\"><br/>\n從這個標準來看，《父子》的藝術成就高於《墨攻》。<br/>\n<\/font><font size=\"3\"><br/>\n不過，如何說故事比較重要，並不意味著故事的內容不重要，真正感動人心的作品，絕對不是只有外在美而己。「文」可以看成是一種行銷的手段，讓訊息更忠實、更有效地傳遞。如果訊息本身的價值不高，再棒的行銷手段也不能帶來真正的感動。<br/>\n<\/font><font size=\"3\"><br/>\n對我而言，《父子》傳遞的訊息是舊的，而《墨攻》則是新的。《墨攻》能開我的眼界，但《父子》不能。<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\">從這個標準來看，《墨攻》的實用價值──對此時此刻的我而言──高於《父子》。<\/font><\/p>\n<p><font size=\"3\">為什麼要強調──對此時此刻的我而言呢？講到這兒，就不能不提輪迴，<a href=\"#/post/4196376\" target=\"_blank\">心情的輪迴<\/a>。此時此刻的我是善良的，就像郭富城信誓旦旦地告訴兒子，明天就去找工作。但老實說，我不曉得邪惡的那一刻什麼時候來臨，就像郭富城發了瘋似地命令兒子，現在就去偷。<\/font><\/p>\n<p><font size=\"3\">這就是為什麼《父子》的主題雖然陳腔濫調，仍然能感動人心。當人心冷不防又墮落到萬丈深淵時，《父子》的呼喚就能引起共鳴。<\/font><\/p>\n<p align=\"left\"><font size=\"3\">反過來說，《墨攻》的主題雖然比較新鮮，卻註定了一路衰敗到底的命運，當歷史故事的趣味消失以後，當我們期望在故事中聽見人性呼喚的時候，可能會遺憾地發現，眼前只有木偶和木偶之間的碰撞──如果不要這麼嚴苛的話，大概只剩下逸悅這個角色比較像人吧。<br/>\n<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" height=\"303\" alt=\"\" src=\"\" data-lost=\"35/1777051057.jpg\" width=\"450\"/><\/p>\n<\/font><\/p>\n<p>&nbsp;<\/p>\n<p>&nbsp;<font size=\"3\">ps.<br/>\n同樣一個笑話，擅長講笑話的人還沒開口就已經讓人笑翻天了，這就是為什麼文學看重形式更甚於內容。<br/>\n<br/>\n流月無聲是個擅長講笑話的人，但他似乎比較偏好感性的文字路線，他所介紹的《墨攻》是我看過最棒的一篇，值得推薦：<br/>\n<br/>\n<a href=\"http://blog.sina.com.tw/endiana/article.php?pbgid=13545&amp;entryid=290746\" target=\"_blank\">http://blog.sina.com.tw/endiana/article.php?pbgid=13545&amp;entryid=290746<\/a><\/font><\/p>", "comments": [{"name": "Annie", "date": "2007-01-17 20:11:30", "url": "http://anniechg.blogspot.com/", "text": "To Bruce:<br />\n<br />\n剛看到篇好文章<br />\n和這無關聯<br />\n但很不錯看<br />\n有空去瞧瞧吧<br />\n<br />\n夏瑞紅《黃昏之煉》<br />\nhttp://blog.chinatimes.com/xletter/archive/2007/01/11/142517.html<br />\n<br />\n&gt;.^", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "atong0103", "date": "2007-01-19 02:19:08", "url": "", "text": "兩大天王，越老越值錢唷...", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "celestechien", "date": "2007-01-19 03:21:43", "url": "http://www.wretch.cc/blog/celestechien", "text": "讓我想到郭與劉在雷諾傳裡飾演父子的情節 @.@", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "流月無聲", "date": "2007-01-22 02:50:25", "url": "blog.sina.com.tw/endiana", "text": "郭富城是我非常欣賞的演員（絕對不是因為他的帥），<br />\n我一直相信他總有一天發揮他的潛能，<br />\n從《三岔口》開始，<br />\n我發現他作到了。<br />\n《父子》是我想看、但還未看的電影，<br />\n他訴說的是人性的掙扎與人生的卑微，<br />\n題材雖然沉鬱，<br />\n或者是試圖替許多沉淪的靈魂找一個出口吧！<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "11071906", "title": "我現在比較沒興趣去ㄚ嬤家了", "date": "2007-01-13 18:05:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835392.jpg\"/>\n<p>星期六晚上&hellip;&hellip;&hellip;<br/>\n<font color=\"#800080\" size=\"3\"><br/>\n「微微，妳星期一上學的時候，記得跟老師說要坐第一班娃娃車回我們家ㄡ。」<\/font><\/p>\n<\/font><\/p>\n<p><font color=\"#ffcc99\" size=\"3\">「為什麼？」<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800080\">「妳知道的啦。」<\/font>這時，她通常會回答──因為妳休假ㄡ，但今天不同，她說：<\/font><\/p>\n<p><font color=\"#ffcc99\" size=\"3\">「因為要去淑燕阿姨家ㄡ？」<\/font><\/p>\n<p><font color=\"#800080\" size=\"3\">「不是，那是星期天。」<\/font><\/p>\n<p><font color=\"#ffcc99\" size=\"3\">「那星期一為什麼要坐第一班娃娃車回來？」<\/font><\/p>\n<p><font color=\"#800080\" size=\"3\">「因為我要帶妳去ㄚ嬤家呀。」<\/font><\/p>\n<p><font color=\"#ffcc99\" size=\"3\">「可是我現在比較沒興趣去ㄚ嬤家了ㄋㄟ。」<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800080\">「為什麼？」<\/font>這可真是大大出乎我的意料。<\/font><\/p>\n<p><font size=\"3\"><font color=\"#ffcc99\">「因為ㄚ嬤家的零食越來越少了啊。」<br/>\n<\/font><br/>\n&hellip;&hellip;&hellip;&hellip;<br/>\n<br/>\n2007.1.13<\/font><\/p>", "comments": []}, {"id": "7151956", "title": "香水　Perfume", "date": "2007-01-03 17:02:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051066.jpg\">\n<p>第一次看《香水》，對於徐四金營造氣氛的文字魅力歎為觀止，我忍不住想到張愛玲。但除了同樣擅長營造氣氛之外，徐四金和張愛玲關懷的主題實在太不相同了，張愛玲的興趣是愛情，而徐四金的興趣是哲學。<br><font size=\"3\"><br>如果看過徐四金的《低音大提琴》、《夏先生的故事》，或者《鴿子》，很難不去懷疑《香水》背後藏著深刻的哲學意涵，但我的「意根」太遲鈍，或者說，徐四金灑了太多頂級香水，用障眼法買通了我的「眼耳鼻舌身」，於是，第一眼看到的《香水》似乎只有犀利的文字風格像徐四金的其他作品。<br><\/font><font size=\"3\"><br>如今，透過電影版本再次體驗《香水》，我的「意根」似乎對香水味免疫了，我隱約看到那個被香水味所覆蓋的，徐四金的哲學家原型。<\/font><\/p><\/font>\n<p><\/p>\n<p><font size=\"3\">既然是哲學，我就不拘泥文字的表現了，請容許我單刀直入地列出《香水》最關心的課題：<\/font><\/p>\n<p><font size=\"3\">1.&nbsp;我們透過感官認識世界，但感官所體驗到的是真實的嗎？<br>2.&nbsp;不能被感官所察覺的事物，是否就不存在呢？（例如「道」）<br>3.&nbsp;感動能夠保存嗎？代價是什麼？<br>4.&nbsp;感動能夠傳遞嗎？會不會遭到誤解？<\/font><\/p>\n<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051051.jpg\" width=\"450\" height=\"338\"> \n<p>徐四金以比喻或象徵的方式傳達這些概念，他的設計實在太棒了：<br><font size=\"3\"><br>1.&nbsp;「道」是最抽象、最難覺知、最難描述的，非常適合用嗅覺來比喻。<br>2.&nbsp;葛奴乙亦正亦邪，身兼多重而矛盾的比喻。他有慧根覺知別人不能覺知的事物，是正。但他貪戀慧根所能感受的境界之美，是邪。<br><\/font><font size=\"3\"><br>在這些嚴肅的話題之外，《香水》的熱鬧似乎只是一種包裝或行銷的手段而已，就像香水的功能一樣。<\/font><\/p><\/font>", "comments": [{"name": "Annie", "date": "2007-01-06 14:52:48", "url": "http://anniechg.blogspot.com/", "text": "小婆還沒看過這部電影<br />\n也沒拜讀過這本小說<br />\n倒是看了些部落客的論點<br />\n<br />\n● 電影製造奇觀，觀眾才會歎服，《香水》的集體交歡圖堪稱影史之最了。<br />\nhttp://blog.yam.com/tonyblue/article/4876353<br />\n<br />\n● 《香水》不僅是要開啟觀眾的感官，也要開啟知識的窄門。<br />\nhttp://blog.yam.com/tonyblue/article/4695571<br />\n<br />\n● 聞香不知味，人生的美麗就錯失了大半，《香水》挑戰的是所有人的麻痺感官。<br />\nhttp://blog.yam.com/tonyblue/article/4685937<br />\n<br />\n● 《香水》是知名小說，拍成電影時，你聞得到香氣嗎？<br />\nhttp://blog.yam.com/tonyblue/article/3315490<br />\n<br />\n如果你也和小婆一樣喜歡看電影<br />\n「藍藍的 movie blog」<br />\nhttp://blog.yam.com/tonyblue<br />\n是至目前為止小婆瀏覽過的部落格中最優也最齊備的<br />\n<br />\n格主的姓名叫「藍祖蔚」<br />\n他在 PC Home 和 Xuite 也有部落格<br />\n但只是相同文章多貼而已", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "Annie", "date": "2007-01-06 15:02:35", "url": "http://anniechg.blogspot.com/", "text": "印象中黃小黛 Debby 也寫過一小段<br />\nhttp://2006islife.blogspot.com/2006/11/11152006.html<br />\n<br />\n街道上的巴士，《香水》的電影廣告開始露出，遠遠遙望，一個女人，躺在海報上，白皙身體，金亮微捲的紅長髮，死亡般的表情大量的橫掃街頭。<br />\n<br />\n對於小說改編的電影，我心裡都有點保留，能怎樣編劇呢？這麼一部長長的，而充滿思緒的歲月，怎麼才能講到全然的精髓，很疑慮。<br />\n<br />\nFor your reference.<br />\n<br />\n&gt;.^", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-01-09 00:51:05", "url": "", "text": "to annie:<br />\n<br />\n我一直不相信改編的東西會比原著好，但看過《悲慘世界》的音樂劇之後，我覺得不同的藝術型式可能訴求不同的感官，而到達相同的感動境界。<br />\n<br />\n另外一種支持改編的理由是，電影版本或音樂劇版本提供了原著小說的讀者重溫舊夢的機會。因此，我們不必擔心電影或音樂劇無法呈現太多的細節，尤<br />\n其是心理的描繪。這就是所謂「講給已經懂的人所聽的話，讓他的理解更深刻」。<br />\n<br />\n當然，對於先接觸電影版本或音樂劇版本的人而言，改編也可能是鼓勵他們接觸原著的一項誘因。", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "Annie", "date": "2007-01-10 17:49:19", "url": "http://anniechg.blogspot.com/", "text": "To Bruce:<br />\n<br />\n建議你將上則留言轉述到黃小黛的部落格<br />\n藉此多交了位文友<br />\n<br />\np.s. 小婆和 Debby 不怎麼對盤<br />\n<br />\n比較喜歡看－－<br />\n<br />\n「女主人的沙龍」http://www.wretch.cc/blog/justcrystal<br />\n「酪梨壽司的日記」http://blog.pixnet.net/cwyuni<br />\n「明日天涯任我行」http://mypaper.pchome.com.tw/news/sameme<br />\n<br />\n&gt;.^", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "艾晞娜", "date": "2007-01-12 08:02:28", "url": "http://blog.pixnet.net/Asenath", "text": "嗯...<br />\n感官所感受到的，常會讓我們產生錯覺...<br />\n甚至很多時候，一些毒藥就是利用刺激我們的腦部，使我們產生錯覺，而有可怕的反應呢！<br />\n<br />\n哲學...愈探討，會不小心就鑽到牛角尖去了...<br />\n<br />\n不過，我們所需要的，就是認真活美一天，<br />\n活著，能好好去感受生活，就算是錯覺，能夠快樂，詳和，也是一種幸福吧!?<br />\n(我覺得我的留言也錯亂了... :p)", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-01-12 15:44:58", "url": "", "text": "to 艾晞娜:<br />\n<br />\n你說的沒錯，就像電影駭客任務中的叛徒所說的，你幹嘛把我叫醒，我寧可活在夢裡...", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "atong0103", "date": "2007-01-19 02:21:27", "url": "", "text": "《台北人》，一本百看不厭之經典！", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "11071475", "title": "我現在已經不喜歡上學了", "date": "2007-01-01 17:38:00", "cat": "9658339", "private": false, "html": "<font size=\"3\">\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835282.jpg\"/><\/p>\n姐姐幼稚園下課後的某一天傍晚。<\/font>\n<p><font size=\"3\"><font color=\"#ffcc99\">「媽媽，我現在已經不喜歡上學了。」<\/font> 她一臉正經的看著我說，讓我不由得不把它當一件大事來處理。<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800080\">「為什麼？我看妳每天還是開開心心去學校啊，是不是和同學吵架了？」<\/font> 我想，誰又不跟誰好應該是不喜歡上學的主因吧。<\/font><\/p>\n<p><font size=\"3\"><font color=\"#ffcc99\">「不是啦，難道妳不曉得上學都要睡午覺的嗎？」<\/font>我的老天爺&hellip;這問題叫我如何解決啊&hellip;&hellip;<br/>\n<br/>\n2007.1.1<\/font><\/p>", "comments": []}, {"id": "6984179", "title": "蔡康永　比女人更有女人味的男人", "date": "2006-12-22 08:25:00", "cat": "3966439", "private": false, "html": "<p align=\"center\"><font size=\"3\"><a href=\"http://blog.webs-tv.net/kangyong\" target=\"_blank\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051047.jpg\" border=\"0\"/><\/a><br/>\n<a href=\"http://blog.webs-tv.net/kangyong\" target=\"_blank\"><font size=\"2\">圖片來源：蔡康永的部落格　http://blog.webs-tv.net/kangyong<\/font><\/a><\/font><\/p>\n<p><font size=\"3\">前兩個禮拜的今天（95.12.8），蔡康永到建中演講。當時，大家都還在猜測庹宗康和屈中恆到底有沒有吸大麻，媒體記者到處探詢娛樂圈的看法。蔡康永說，娛樂圈的人其實很像小孩子，喜歡笑，喜歡玩。如果用大人的價值觀來檢視這些藝人，一定會覺得到處不對勁。<br/>\n<br/>\n他演講的時候坐在桌上，兩腿交疊，像個穿窄裙的女子，講起話來慢條斯理，和他敏捷的思緒不太搭調。不曉得是不是因為主持過許多談話性的節目，他非常擅於聆聽，不只是在第一時間聽懂問題，還能幫口齒不清的人重新描述問題，提問者稀哩糊嚕講了三分鐘，看著大家面面相覷的表情，我不曉得有多少人聽得懂，但蔡康永卻用一兩句話總結問題的重點，然後再開始回答。<\/font><\/p>\n<p><font size=\"3\">有學生問：生涯規劃。<\/font><\/p>\n<p><font size=\"3\">蔡康永說，他是個懶散的人，從來不作規劃。<\/font><\/p>\n<p><font size=\"3\">有學生問：挫折。<\/font><\/p>\n<p><font size=\"3\">蔡康永說，每個人都會遇到挫折。面對挫折時不一定要繼續奮鬥下去，也可以考慮離開戰場，或許我們根本就不適合玩這個遊戲。<\/font><\/p>\n<p><font size=\"3\">有學生問：阻力。<\/font><\/p>\n<p><font size=\"3\">蔡康永說，他母親反對他唸文學，他回答，教文學的是外國佬，對英文有幫助啊。他父親要他出國唸書，而且要選名校，他照父親的意思進了柏克萊，但他父親沒料到他竟然跑去唸電影。<\/font><\/p>\n<p><font size=\"3\">有學生問：熱情消失。<\/font><\/p>\n<p><font size=\"3\">蔡康永說，他也曾失去熱情。念再興中學的時候，有一次室友看出他內心要死不活的樣子，天還沒亮就抓他到陽台等日出。也許有些人需要日出，有些人需要夕陽或星空或大海，大自然總是有神祕的安慰力量。不過，蔡康永最後卻說，何不就接受它、感覺它的消失呢？<\/font><\/p>\n<p><font size=\"3\">有人稱讚他讀很多書。<\/font><\/p>\n<p><font size=\"3\">蔡康永說，對此他總覺得慚愧，甚至帶點罪惡感。如果有人每天打電腦遊戲逃避現實人生，但別人卻稱讚他、鼓勵他繼續玩下去，這個人會怎麼想呢？蔡康永只是把逃避現實的工具從電腦換成書本而已。<br/>\n<br/>\n<img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051049.jpg\"/><\/font><\/p>\n<p><font size=\"3\">蔡康永演講的隔天，我去參加好朋友 Gary 的婚禮，我和另一位好朋友 Endiana 同桌，她以前很迷蔡康永，但現在不那麼迷了，她說，當初她佩服蔡康永讀的書非常多，現在則對他陷入娛樂圈太深而不以為然。<\/font><\/p>\n<p><font size=\"3\">蔡康永對娛樂圈的看法是什麼呢？<\/font><\/p>\n<p><font size=\"3\">除了前面說過，娛樂圈有很多天真的小孩子之外。因為中天與中視剛剛合併，蔡康永和張菲、吳宗憲見面聊天的機會多了，蔡康永的觀察是，大概沒有半個主持人知道自己是怎麼變成主持人的，而那些過氣的主持人大概也不知道自己為什麼突然就不紅了。娛樂圈的神祕就像人生一樣，沒有人知道名聲是怎麼來的，怎麼去的。<\/font><\/p>\n<p><font size=\"3\">雖然自己學的是電影電視，但蔡康永毫不諱言地說，電視是低級的。不要花錢的東西幾乎都是低級的，電視節目只想把你留下來看廣告。許多科技，包含電視和網際網路，發明家最初的理想和人們最後怎麼應用發明，完全是兩碼子事。<\/font><\/p>\n<p><font size=\"3\">蔡康永給了一個建議，先把電視的聲音關掉，聲音對人控制力超乎想像，只要把聲音關掉，電視就控制不了我們。<\/font><\/p>\n<p><font size=\"3\">學生又問：成名。<\/font><\/p>\n<p><font size=\"3\">蔡康永說，成名的唯一好處是可以收到別人善意的回應──當然也不免有惡意的回應，但總是比曹雪芹的時代好多了，不會那麼寂寞。但成名必然會失去自由，也必然會過氣，想成名的人要有心理準備。<\/font><\/p>\n<p><font size=\"3\">有學生問：異己。<\/font><\/p>\n<p><font size=\"3\">蔡康永說，他也會忍不住罵髒話（something like &ldquo;go to hell&rdquo;），但不會真的殺死他所反對的，那太辛苦了，不理他比較容易。<\/font><\/p>\n<p><font size=\"3\">有學生問：憤怒。<\/font><\/p>\n<p><font size=\"3\">以蔡康永溫柔的女性特質，我原以為他反對憤怒，結果，我真是太低估蔡康永女性化的層次了。<\/font><\/p>\n<p><font size=\"3\">蔡康永說，憤怒是好的，憤怒和熱情連在一起，而熱情可能是他最推崇的價值，事實上，他認為熱情是小S最迷人的地方。蔡康永看不起那些只有慾望卻沒有熱情的政客，被問到「願不願意當行政院長？」的時候只會回答「不排除這種可能性」。<\/font><\/p>\n<p><font size=\"3\">蔡康永打趣說，如果有人問你想不想吃巧克力，你會回答「不排除這種可能性」嗎？想吃就吃，不想吃就不想吃，什麼叫做「不排除這種可能性」？蔡康永說孔子是他的偶像，孔子周遊列國，到處拜託國王聘請他當行政院長，這就是熱情。<\/font><\/p>\n<p><font size=\"3\">雖然蔡康永表面上這麼說，但他的謙遜和包容更像老子，我覺得他只是希望他的另一半像孔子，倒不是他自己想成為孔子。<\/font><\/p>\n<p><font size=\"3\">舉手發問的人實在太多，蔡康永不得不說：最後一個問題。<\/font><\/p>\n<p><font size=\"3\">最後一個問題是：祕密。<\/font><\/p>\n<p><font size=\"3\">蔡康永說，蘋果日報和 e 週刊對他其實蠻失望的。為了不讓建中的學生失望，蔡康永公開了自己的一個癖好──喜歡把鼻屎抹在可能不會再翻閱的書頁上。蔡康永承認，他當然有一些祕密，如果有一天不幸被揭露，大概就是和大家告別的時候了。<\/font><\/p>\n<p><font size=\"3\">末了，主持人送了一份建中的紀念品給蔡康永，然後宣布大家可以到前面和蔡康永合照、索取簽名，就看著建中的學生一陣蜂湧而上&hellip;<\/font><\/p>\n<p><font size=\"3\">我當時忙著遺憾沒有帶相機，我坐在第一排，與蔡康永只有三步之隔，照武俠小說的寫法，一個箭步就可以取他性命了，結果卻連半張特寫照片都沒取下來。<\/font><\/p>\n<p><font size=\"3\">事隔一個多禮拜，當我行筆至此，忽然覺得那陣蜂湧而上的場景似乎帶著徐四金的香水味。<br/>\n<br/>\n<img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051048.jpg\"/><\/font><\/p>\n<p><br/>\n<font size=\"3\"><font face=\"標楷體\" color=\"#0000ff\" size=\"4\">後記<\/font><br/>\n<br/>\n這可能是個最「顛倒夢想」的後記了，不僅僅因為這個寫在結尾的後記是這篇文章最早寫好的部分；更顛倒的地方在於，這個後記是關於蔡康永這場演講的主題，而主題竟然沒有出現在本文，而出現在後記。<\/font><\/p>\n<p><font size=\"3\">因為我不是，也不想成為一個好記者，與其說我想記錄事情，倒不如說我想記錄心情。我最想記錄的是蔡康永給我的印象，而不是重建當時的場景（如果剛好可以當然很好，那會是一個我樂於見到的巧合）。<\/font><\/p>\n<p><font size=\"3\">蔡康永的講題是「你想向命運要求什麼？」。<\/font><\/p>\n<p><font size=\"3\">這個講題的典故來自宮部美幸的暢銷書《勇者物語》，故事的主角是一位少年，父親外遇，母親痛不欲生。這個少年偶然發現另一個空間存在著命運女神，只要通過各種考驗，便能見到命運女神，並請她實現自己的一個願望。<\/font><\/p>\n<p><font size=\"3\">蔡康永問，如果見到了命運女神，你最想實現的願望是什麼？<\/font><\/p>\n<p><font size=\"3\">人生的難題像海浪一個接著一個，等待命運女神幫忙解決問題並不能一勞永逸。面對人生的困難，蔡康永建議我們尋找新的可能，從建中到台大並不是人生的唯一選項。<\/font><\/p>\n<p><font size=\"3\">書（朋友也像一本書）的價值在於，他們讓我們知道這世上有那麼多不同的生活方式，有那麼多不同的可能性，然後，我們可以回顧自己，重新認識自己，什麼才是自己該走的路。<\/font><\/p>\n<p><font size=\"3\">書對蔡康永的意義真是非比尋常，他說他從來感覺不到資訊爆炸，「書本就像空氣一樣，誰會嫌空氣太多呢？」<\/font><\/p>", "comments": [{"name": "tzumimi", "date": "2006-12-22 00:43:07", "url": "", "text": "蠻欣賞他的文筆", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "", "date": "2006-12-29 13:18:47", "url": "", "text": "同樣地給外人深刻印象「讀過很多書……」<br />\n蔡康永就比王文華來得「真誠與圓融」<br />\n小婆也曾想將他的部落格放入右欄中<br />\n但仔細一看已近五個月沒有更新<br />\n不知為啥<br />\n但總覺他不太在意這塊版圖與人氣<br />\n<br />\n普遍發現博客們<br />\n即使像是蕭言中<br />\n也曾因留言數少而感慨地嚷著要「罷工」<br />\n實則是 Yahoo! 奇摩必須是會員才能留言<br />\n真不懂他們為什麼要限制留言資格<br />\n<br />\n因為若是所謂的「機器人」留言<br />\n有辨識碼輸入系統隔離<br />\n若是所謂的「法輪功」或者「不明究理」來鬧場的<br />\n格主有其責任清理過濾版面<br />\n<br />\n博客們為何而寫？為啥而寫？<br />\n小婆常是提醒他們別忘初衷<br />\n即使觀眾／讀者只賸你一人<br />\n<br />\n&gt;.^", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "佩珠", "date": "2007-01-03 05:32:10", "url": "", "text": "你連感性時都如此的成熟呢！<br />\n<br />\n雖然再不能咚咚咚的跑到你的座位旁問問題，但看著你的文字，一樣得到人生的指引和解<br />\n答。<br />\n<br />\n你離開是對的，至少不用一起在這裡莫名的憂鬱......<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-01-03 09:15:56", "url": "", "text": "to 佩珠<br />\n<br />\n蔡康永說，再有趣的事變成工作之後也就不再有趣了，蔡康永喜歡和人接觸，這是他對付工<br />\n作憂鬱症的辦法<br />\n<br />\n我相信你也會找到自己的辦法", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "sskng987", "date": "2007-01-04 01:26:56", "url": "", "text": "重新認識蔡康永<br />\n是加分的     Dinah", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "瞳瞳", "date": "2007-01-26 01:38:32", "url": "", "text": "www.kangyong.com.cn 蔡康永FANS網站", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "11816152", "title": "這個電影很悲傷很感人", "date": "2006-11-24 17:20:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835352.jpg\"/>\n<p align=\"left\">星期五休假一天，正好「快樂腳」在微風影城有中文發音版， 於是向姐姐學校請了一天假後，母女二人開開心心準備些許零嘴就出發了&hellip;&hellip;<br/>\n<br/>\n「<font color=\"#800080\">微微，妳猜這部電影會很開心還是很悲傷？<\/font>」在電影放映前我問她。<br/>\n<br/>\n「<font color=\"#ffcc99\">嗯，我不曉得。<\/font>」姐姐有個毛病，除非很有把握，不然不輕易給猜測。<br/>\n<br/>\n「<font color=\"#800080\">那我猜會很快樂。<\/font>」每次我都得拋磚引玉。<br/>\n<br/>\n「<font color=\"#ffcc99\">為什麼？<\/font>」<br/>\n<br/>\n「<font color=\"#800080\">因為它的名字叫『快樂腳』啊。<\/font>」我不假思索的回答。<br/>\n<br/>\n「<font color=\"#ffcc99\">那我也猜會很快樂。<\/font>」怕犯錯，每次都來這招。<br/>\n<br/>\n事實證明，這部電影根本沒那麼快樂，姐姐還在戲院裏哭到不能自己（剛開始只是輕輕啜泣，被我發現後便嚎啕大哭），走出戲院時，雙眼腫得跟核桃一樣大（我還花了好一陣工夫才平復她的情緒，真是感情充沛的孩子&hellip;..）<br/>\n<br/>\n星期一，下課回來，她告訴我：<br/>\n<br/>\n「<font color=\"#ffcc99\">媽媽，葉老師說，因為我星期五沒有來上學，要我跟同學分享看的電影，我就告訴林芳羽這個電影很悲傷很感人，ㄚ林芳羽聽不懂什麼是很感人就說：『我聽不懂妳在說什麼啦，妳頭腦是不是有問題啊？』<\/font>」<br/>\n<br/>\n說完，皺了皺眉聳聳肩就去忙她的事了&hellip;&hellip;&hellip;<br/>\n<br/>\n2006.11.24<\/p>\n<\/font><\/p>", "comments": []}, {"id": "6015814", "title": "金剛　King Kong", "date": "2006-10-12 12:16:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051034.jpg\" width=\"450\" height=\"315\"><\/p>\n<p><font size=\"3\">金剛自帝國大廈墜落是經典中的經典。<\/font><\/p>\n<p><font size=\"3\">要欣賞這個經典，得先注意到金剛的三個隱喻：大自然、暴力、父親。<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800000\" size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">金剛 as 大自然<br><\/font><br>金剛的巨大是一種提醒，難道非得要萬物的表相巨大到讓我們敬畏的程度，我們才會開始學著尊重萬物？我們是不是應該放大我們對各種生物的尊重？尤其是小草、螞蟻這樣看起來微不足道的生命。<\/font><\/p>\n<p><font size=\"3\">如果把金剛作為大自然的隱喻，把帝國大廈作為人類文明的表徵，金剛之死是環保人士最深沈的控訴：將文明提升到頂點是否要以犧牲大自然作為代價？<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800000\" size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">金剛 as 暴力<br><\/font><br>Carl 對金剛之死下了一個註解：<br><br>It wasn&#39;t the airplanes, it was Beauty killed the Beast.<br><br>這句話表面的意思很清楚──Carl 的搖錢樹被一個美女給害死了。言者或許無心，聽者何妨有意，當我們把金剛看成暴力的化身時，金剛之死意謂著：真正止戈的不是武器，而是美。<\/font><\/p>\n<p><font size=\"3\">英語中的 kill 也有浪漫的用法，Roberta Flack 有一首情歌 ”<a href=\"#/album/38\" target=\"_blank\">Killing me Softly with His Song<\/a>”，指的是 Don McLean （代表作為 <a href=\"#/album/38\" target=\"_blank\">Vincent (Starry Starry Night)<\/a>）的自彈自唱太美了，讓人為之傾倒。<\/font><\/p>\n<p><font size=\"3\">美能殺死暴力，這樣的議題讓我想到 Eugene Trivizas 和 Helen Oxenbury 的童書：《三隻小狼與大壞豬（The Three Little Wolves and the Big Bad Pig）》。<br><br>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051037.jpg\"><\/p><\/font>\n<p><\/p>\n<br>\n<p><font size=\"3\">在這個故事裡，狼與豬的角色互換，而科技也變得更進步，大壞豬分別用榔頭、電鑽以及炸藥摧毀了磚塊、水泥以及鋼鐵所建構的圍牆，最後三隻小狼改用花朵蓋了一間弱不禁風的小屋子，只要大壞豬使勁一吹就能吹倒。<\/font><\/p>\n<p><font size=\"3\">然而，當大壞豬狠狠地吸進一口氣，準備將花屋給吹倒的時候，牠聞到了濃郁的花香，花香驅逐了牠的暴戾之氣，大壞豬不再搞破壞了，牠甚至和三隻小狼變成了好朋友。<\/font><\/p>\n<p><font size=\"3\">不論是環保觀點或美學觀點都太嚴肅了，我最喜歡的觀點是從人性的角度來詮釋金剛的墜落。<\/font><\/p>\n<p><font size=\"3\"><font color=\"#800000\" size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">金剛 as 父親<br><\/font><br>將大猩猩聯想成父親，在安東尼布朗（Anthony Browne）的經典童書《大猩猩（Gorilla）》曾經出現過。如果從演化論的觀點來看，這也是貼切的比喻，我期待「金剛與父親」這個比喻未來能和「大地與母親」一樣為人津津樂道。<br><br>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051036.jpg\"><\/p><\/font>\n<p><\/p>\n<br>\n<p><font size=\"3\">金剛與 3 隻恐龍的決鬥看得讓人驚心動魄，於是我們很容易錯過一個明顯的類比，金剛救了 Ann 意謂著父親給予兒女生命。<\/font><\/p>\n<p><font size=\"3\">當兒女還只是小孩的時候，父親就像金剛一樣巨大如山，父親會將兒女放在肩上，父親會拉著兒女的小手，讓他們飛在空中轉圈圈（就像金剛和 Ann 在中央公園結了冰的湖面上旋轉），父親會將女兒視為掌上明珠（就像 Ann 溫柔地躺在金剛的手中）。<\/font><\/p>\n<p><font size=\"3\">Ann 在片頭依偎著一位慈眉善目的長者，在我看來是一個精巧的設計，暗示著 Ann 的心裡渴望一位父親。<\/font><\/p>\n<p><font size=\"3\">因此，當 Jack 要把 Ann 從金剛的手中帶走的時候，Ann 內心的掙扎是親情與愛情的掙扎，是過去與未來的掙扎。<\/font><\/p>\n<p><font size=\"3\">而金剛的憤怒是余光中在〈我的四個假想敵〉中所描寫的憤怒（余光中生了四個女兒，他的假想敵就是女兒的男朋友）；金剛的嫉妒是雨果在《悲慘世界》中所描寫的嫉妒，Jean Val Jean 對 Marius 的嫉妒。<\/font><\/p>\n<p><font size=\"3\">然後，我們看到金剛因為憤怒與嫉妒承受了接二連三的折磨，從 Skull island 一直延伸到 New York。但金剛想必並不後悔，因為他至少曾經和 Ann 一起在中央公園溜冰，一起在帝國大廈看夕陽。<\/font><\/p>\n<p><font size=\"3\">最後，我們看見 Ann 挺身站在金剛與戰鬥機之間，女兒還能夠對父親做更多的犧牲嗎？我們看見金剛在墜落之前與 Ann 的凝眸，女兒與父親的眼神還能流露更多的依戀嗎？&nbsp;<br><br>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051035.jpg\"><\/p><\/font>\n<p><\/p>\n<br>\n<p><font size=\"3\">父親墜落之後，女兒的情人接著爬上了世界的屋頂，好比在婚禮中，父親將女兒的手交給了新郎。John Cougar Mellencamp 說：<br><br><span style=\"font-family:Times New Roman;\">There is nothing more sad or glorious than generations changing hands.<br><\/span><br>這句話的原意是世代交替，用於父死子繼時，榮耀的成分居多，若用在父親和女婿身上，潰堤的應該是悲傷的情緒吧？<\/font><\/p>\n<p><font size=\"3\">據說，Peter Jackson 9 歲的時候從電視上看到 1933 年版的《金剛》，看到金剛從帝國大廈墜落時忍不住流下淚來。大概從那個時候開始，他就立志要重拍金剛吧？我沒有本事重拍金剛，但我希望讓更多人知道 Peter Jackson 的《金剛》不只是一部講究特效的娛樂片。<\/font><\/p>", "comments": [{"name": "h", "date": "2006-10-13 16:45:29", "url": "", "text": "雖然還沒有看這部片子，但文章中引用的歌聲與繪本，就像闊別多年的老友般在此<br />\n重逢，有一種說不出的感動‧<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2006-10-14 22:54:04", "url": "", "text": "我們應該都曾想過要留下什麼東西給兒女吧，我想留給他們的遺產可能有很<br />\n多，但我現在想到的是，留給他們一些能觸動心弦，讓心靈唱歌的東西，就像<br />\n這裡出現的：一首歌、一本書、一部電影...<br />\n<br />\n當這些音符在未來的某一天響起時，我們會想起，我們曾經為同一首歌感動<br />\n過，這也算是千里共嬋娟吧？", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "5505601", "title": "The Way he Makes me Feel", "date": "2006-08-31 14:08:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><font size=\"4\" face=\"Times New Roman\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051030.jpg\" width=\"350\" height=\"480\"/>\n<p><a href=\"#/album/38\" target=\"_blank\"><font size=\"5\">The Way he Makes me Feel<\/font>&nbsp;<br/>\n<\/a>(Marilyn Bergman, Alan Bergman, Michel Legrand)<br/>\nperformed by Barbra Streisand<\/p>\n<\/font>\n<p>&nbsp;<\/p>\n<p><font size=\"4\" face=\"Times New Roman\">There&#39;s no chill and yet I shiver.<br/>\nThere&#39;s no flame and yet I burn.<br/>\nI&#39;m not sure what I&#39;m afraid of<br/>\nAnd yet I&#39;m trembling.<\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">There&#39;s no storm yet I hear thunder.<br/>\nAnd I&#39;m breathless, why I wonder.<br/>\nWeak one moment,<br/>\nThen the next I&#39;m fine.<\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">I feel as if I&#39;m falling<br/>\nEvery time I close my eyes.<br/>\nAnd flowing through my body<br/>\nIs a river of surprise.<br/>\nFeelings are awakening<br/>\nI hardly recognize as mine!<\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">What are all these new sensations?<br/>\nWhat&#39;s the secret they reveal?<br/>\nI&#39;m not sure I understand<br/>\nBut I like the way I feel.<\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">Oh, why is it that every time<br/>\nI close my eyes he&#39;s there?<br/>\nThe water shining on his skin,<br/>\nThe sunlight in his hair?<br/>\nAnd all the while I&#39;m thinking things<br/>\nThat I can never share with him.<br/>\n<br/>\n(That I can&#39;t wait to share with him)<\/font><\/p>\n<p><font size=\"4\" face=\"Times New Roman\">I&#39;m a bundle of confusion<br/>\nYet it has a strange appeal.<br/>\nDid it all begin with him,<br/>\nAnd the way he makes me feel<\/font><\/p>\n<p><font size=\"3\"><font size=\"4\" face=\"Times New Roman\">I like the way he makes me feel...<br/>\n<br/>\n<span style=\"FONT-FAMILY:新細明體;FONT-SIZE:12pt;\"><br/>\n<font color=\"#993300\" size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">【中譯】<\/font><\/span><br/>\n<font size=\"3\" face=\"Arial\"><br/>\n<font size=\"5\" face=\"&#x006a19;&#x006977;&#x009ad4;\">他給我的感覺<\/font><\/font><\/font><\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">不冷，可是我在發抖<br/>\n沒有火，但覺得燙<br/>\n我不確定自己害怕什麼<br/>\n但我在戰慄<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">沒有狂風暴雨，卻聽見雷聲<br/>\n我喘不過氣來，為什麼會這樣呢<br/>\n一會兒覺得軟弱無力<br/>\n一會兒又好了<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">我覺得自己往下掉<br/>\n每次我閉上雙眼<br/>\n流遍全身的<br/>\n是一條河流，滿是驚奇<br/>\n新的感受被喚醒<br/>\n我幾乎認不出那是自己的感受<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">這些全新的感動是怎麼回事？<br/>\n它們透露著什麼祕密？<br/>\n我不確定自己懂不懂<br/>\n但我喜歡這些感覺<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">啊，為什麼每次<br/>\n閉起眼睛就見到他<br/>\n肌膚上閃亮的水珠<br/>\n頭髮上的陽光<br/>\n我一直想、一直想<br/>\n那些永遠也無法和他分享的心事<br/>\n<br/>\n(那些等不及和他分享的心事)<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">我陷入迷惘<br/>\n但迷惘有股奇妙的吸引力<br/>\n是否這一切都起因於他<br/>\n以及他給我的感覺<\/font><\/p>\n<p><font size=\"3\"><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">我喜歡他給我的感覺<\/font><\/font><\/p>", "comments": []}, {"id": "11815286", "title": "妳以前就是餵我吃這個哦？", "date": "2006-08-31 12:26:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835367.jpg\"/>\n<p>臭笛六個月大的某一天，正當我準備好餵他精心調配的麥粉泥時，又被眼尖的姐姐看到了&hellip;<br/>\n<font size=\"3\"><br/>\n「<font color=\"#ffcc99\">媽媽，妳給弟弟吃什麼？<\/font>」對這檔事，她可是非常有興趣的。<br/>\n<\/font><font size=\"3\"><br/>\n「<font color=\"#800080\">麥片泥加高湯啊。<\/font>」<br/>\n<\/font><font size=\"3\"><br/>\n「<font color=\"#ffcc99\">我看看&hellip;<\/font>」 說完，放下手邊的事，走了過來&hellip;<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">唉喲！好噁！妳以前就是餵我吃這個哦？怪不得我都不喜歡吃&hellip;&hellip;<\/font>」語畢，皺起眉頭又去忙了。<br/>\n<br/>\n2006.8.31<\/font><\/p>", "comments": []}, {"id": "5466440", "title": "衝擊效應　Crash", "date": "2006-08-28 16:05:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" height=\"243\" alt=\"\" src=\"\" data-lost=\"35/1777051029.jpg\" width=\"470\"/>\n<p>Crash是衝突，對比也算是一種衝突，戲劇張力決定於衝突或對比的強度，這部片子有許多對比，非常發人深省。<\/p>\n<\/font><\/p>\n<p>&nbsp;<\/p>\n<p><font face=\"標楷體\" color=\"#993300\" size=\"4\">John v.s. Hanson<\/font><\/p>\n<p><font size=\"3\">人是多麼的不穩定，這一刻是英雄，下一刻卻變成雜碎，這一刻是雜碎，下一刻卻變成英雄。Hanson 不齒 John 的作為卻沒有勇氣舉發，最後選擇一條沒有夥伴的路。兩個人分道揚鑣時，John 對 Hanson 說：<\/font><\/p>\n<p><font size=\"3\">You think you know who you are?... You have no idea.<\/font><\/p>\n<p><font size=\"3\">我們確實高估了自己抵抗誘惑的能力，我們也低估了自己捨身救人的勇氣，我們同時具備英雄與雜碎的潛力，全看環境、時勢以及我們的一念之間。難怪我們不應該評斷每一個人，因為我們只能看到片段。難怪偏見或成見的英文是 prejudice，過早下結論就叫作成見、偏見。<\/font><\/p>\n<p><font size=\"3\">我們的眼界往往只停在人事物的表面或最外層，我們忘了關心是什麼樣的背景造成我們眼前的景象。側隱之心難道不是本能嗎？我想我們欠缺的不是同情心，而是記性或耐性，我們忘了朝人事物的裡面多深入觀察一點。<\/font><\/p>\n<p><br/>\n<font face=\"標楷體\" color=\"#993300\" size=\"4\">Farhad v.s. Daniel<\/font><\/p>\n<p><font size=\"3\">Daniel 可能曾經是混混，但現在是個慈愛的爸爸，有個可愛的女兒 Elisabeth。他和女兒是愛的化身，借用 Daniel 的講法，愛可以防彈（impenetrable）。波斯人 Farhad 的恨和南美人Daniel 的愛撞了正著，結果 Farhad 的恨被愛吸收而融化了。<\/font><\/p>\n<p><font size=\"3\">Elisabeth 為父親擋子彈的畫面應該算是整部片子的高潮，但 Farhad 最後和女兒 Dori 的對話同樣令人動容。原來 Farhad 也懂得微笑，Dori 終於在父親的眼神中看到了愛，那是睽違了多久的微笑啊，想必讓 Dori 想起了童年時的父親。<\/font><\/p>\n<p align=\"center\"><font face=\"標楷體\" color=\"#993300\" size=\"4\"><img loading=\"lazy\" height=\"238\" alt=\"\" src=\"\" data-lost=\"35/1777051028.jpg\" width=\"470\"/>\n<p>Graham v.s. Peter<\/p>\n<\/font><\/p>\n<p><font size=\"3\">Graham 賣命工作，擁有一定的社會地位，<font size=\"3\">他的弟弟 Peter 卻是四處劫車的街頭混混。Graham 可能深受同事肯定，卻被母親唾棄。Peter 信仰 Saint Christopher，最後還因祂而死，這似乎隱含著理想主義者殉道，或不見容於現實社會的寓意。<br/>\n<\/font><\/font><font size=\"3\"><br/>\n大概連女友也只是 Graham 獲取別人認同或向人炫耀的工具，當他被母親趕走的時候，他選擇獨自一人回到 Peter 被棄屍的荒野，他似乎撿到 Saint Christopher 的雕像。Graham 該信仰什麼？該認同什麼？<\/font><\/p>\n<p><font size=\"3\"><font face=\"標楷體\" color=\"#993300\" size=\"4\">Cameron v.s. Anthony<br/>\n<\/font><br/>\nCameron 是個事業成功的黑人，他對各種歧視採取明哲保身、逆來順受的態度，他成功地融入一個扭曲的社會，直到不公平惡狠狠地撞上他和他的老婆。<\/font><\/p>\n<p><font size=\"3\">Anthony 始終用憤怒的眼光過生活，表面看起來，他反社會的行徑有著清楚的頭腦作為後盾，其實他的頭腦還沒有他的朋友Peter來得清楚。否則，他不會一面搶白人的車，另一面卻透過白人來銷贜。一面控訴自己被白人歧視，另一面卻歧視黃人。<\/font><\/p>\n<p><font size=\"3\">以上列出的這些對比算是主軸，但<br/>\n<br/>\n<font face=\"標楷體\" color=\"#993300\" size=\"4\">還有一些交叉對比也很有意思<\/font><br/>\n<br/>\n例如：<\/font><\/p>\n<p><font size=\"3\">John 和 Graham：<br/>\n一個是平庸的交通警察，和父親相依為命，另一個是優秀的刑事警探，卻失去母親的愛。<br/>\n<br/>\nHanson 和 Cameron：<br/>\nHanson 決定沈淪時，鏡頭中的他背對著火燒車，另一方面，和孩子一起在雪中玩火的 Cameron 則面對著火燒車－－火是光明的象徵。<br/>\n<br/>\n<\/font><font size=\"3\">John 和 Rick：<br/>\n一個因父親重病得不到援助，任由沮喪的情緒帶著他濫用警察的權力，不但傷害無辜，也危及自己的飯碗。另一個是工作狂，雖然位高權重，卻任由加班逐漸腐蝕他和妻子Jean的關係。<\/font><\/p>\n<p><font size=\"3\">飾演 Jean 的 Sandra Bullock 雖然在卡司中排名第一，戲份卻很少，然而，特殊的地方還不只這一點。<\/font><\/p>\n<p><font size=\"3\">Crash 這部片出現了很多衝擊，尤其是那種影響深遠的衝擊，例如：John 羞辱 Cameron夫婦、Hanson 誤殺 Peter、Farhad 誤殺 Elisabeth、Cameron 修理 Anthony、Graham 的母親控訴他是兇手。<\/font><\/p>\n<p><font size=\"3\">然而，發生在 Jean 身上的衝擊卻是自己失足，她和豪宅的空虛、寂寞、和謊言相撞，換來他和外籍傭人的擁抱，但他可能還要面對更大的傷害，Rick 看起來挺像個外遇的丈夫。<br/>\n<br/>\n<img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051026.jpg\"/><\/font><\/p>\n<p><font size=\"3\"><font face=\"標楷體\" color=\"#993300\" size=\"4\">已經講了這麼多，但還沒講完<br/>\n<\/font><br/>\nCrash 的豐富讓我應接不暇。但我已經寫得太久了，必須就此打住，雖然 Crash 給我的衝擊還沒完全描述完畢──更離譜的是，還沒描述的可能比已描述的更重要。<\/font><\/p>\n<p><font size=\"3\">我只能暫時先記下一些綱要，也許有朝一日再發展吧：<\/font><\/p>\n<p><font size=\"3\">1.&nbsp;偏見與歧視如何扭曲一個人？或者應該說兩個人，歧視的客體（例如波斯人Farhad）固然感到不安全，但歧視的主體（例如白人Jean）同樣感到不安全。歧視與偏見不是解決問題的辦法，對於歧視的主體與客體雙方都不是。<\/font><\/p>\n<p><font size=\"3\">2.&nbsp;指責不能使人變好，反而使他變壞，歧視只會讓受歧視的人變本加厲。<\/font><\/p>\n<p><font size=\"3\">3.&nbsp;表面上是大人在保護小孩子，其實是小孩子在保護大人，保護我們免於墮落、腐化、憤怒、仇恨&hellip;<\/font><\/p>\n<p><font size=\"3\">4.&nbsp;面對不公平的對待，我們應該羞愧的活著？或是有尊嚴的死去？<\/font><\/p>\n<p><font size=\"3\">每個人都有煩惱，即使連信仰堅定的 Daniel 也有，即使他把自己管好，也沒有辦法保證老婆和女兒能安穩地一覺到天亮，社會問題不是獨善其身就能夠解決的問題。導演對此是全然無助的，但不是全然悲觀的，他還懷抱著一絲希望，因為片尾曲是這麼唱的：<\/font><\/p>\n<p><font size=\"3\">Maybe tomorrow I'll find my way home...<\/font><\/p>", "comments": []}, {"id": "11822380", "title": "噓……妳不要講那麼大聲嘛", "date": "2006-08-22 19:05:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835310.jpg\"/>\n<p>洗完澡，把拔把姐姐抱上床準備睡覺。<br/>\n<font size=\"3\"><br/>\n「<font color=\"#0000ff\">不准再有聲音了，不然我會變臉ㄡ！<\/font>」把拔下完指令後，燈關了就到客廳去了。<br/>\n<\/font><font size=\"3\"><br/>\n姐姐在我耳邊偷偷講話，「<font color=\"#ffcc99\">把拔說要帶我去看醫生，結果都沒有去。<\/font>」<br/>\n<\/font><font size=\"3\"><br/>\n因為很小聲，我不確定是不是聽清楚了，於是我問<font size=\"3\">：<br/>\n<br/>\n「<font color=\"#800080\">妳說什麼？<\/font>」<br/>\n<\/font><\/font><font size=\"3\"><br/>\n「<font color=\"#ffcc99\">噓&hellip;&hellip;把拔昨天跟今天都說要帶我去看醫生，結果都沒有去。<\/font>」她很怕被把拔發現沒有乖乖睡覺，小嘴湊到我耳邊非常小聲地說。<br/>\n<\/font><font size=\"3\"><br/>\n「<font color=\"#800080\">妳說看醫生ㄡ？<\/font>」我重複一次。<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">噓&hellip;&hellip;妳不要講那麼大聲嘛。<\/font>」因為怕把拔已經聽到了，她有點生氣不想繼續這個話題 「<font color=\"#ffcc99\">趕快睡覺了啦........<\/font>」說完，馬上背過身，眼睛閉了起來。<\/font><\/p>\n<p><font size=\"3\">出於好奇，我坐起來看她，只見她眼睛不停的眨，不一會兒，竟然就&hellip;&hellip;&hellip;<\/font><\/p>\n<p><font size=\"3\">睡著了&hellip;&hellip;&hellip;<br/>\n<br/>\n<\/font><font size=\"2\">2006.8.22<\/font><\/p>", "comments": []}, {"id": "11823456", "title": "ㄚ我還在想嘛", "date": "2006-08-22 11:29:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835300.jpg\"/>\n<p align=\"left\">又是晚上擠奶時，又是姐姐端了一盤水果進房&hellip;&hellip;&hellip;<br/>\n<font size=\"3\"><br/>\n「<font color=\"#800080\">微微，怎麼辦？我有一件事很煩惱很矛盾，妳幫我想一個辦法好不好？<\/font>」這樣的對話，姐姐最有興趣了。<br/>\n<\/font><font size=\"3\"><br/>\n「<font color=\"#ffcc99\">是什麼事啊？<\/font>」<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">我每天不是都回ㄚ嬤家看弟弟嗎？陪妳的時間那麼少，妳覺得我要不要每個星期三不要去看弟弟，專心回來陪妳？<\/font>」這個問題一直盤旋腦海，遲遲下不了決心（我有戀嬰兒情結，以前姐姐放ㄚ嬤家時，我每天風雨無阻，下了班就直奔回去，等戀夠回家時都已經接近晚上十二點了。）<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">嗯，沒關係，妳回去看弟弟。<\/font>」姐姐應該還記得臭弟送ㄚ嬤家第一晚，我忍不住哭出來的那一幕吧。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">可是，我都沒有陪到妳ㄋㄟ<\/font>」每天她上下課都是把拔接送，我到家時都接近晚上十點了。<br/>\n<br/>\n「<font color=\"#800080\">真的不用我在家陪妳嗎？<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">嗯，好吧。<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#0000ff\"><font color=\"#800080\">那我想弟弟的時候要怎麼辦？<\/font><\/font>」我真是猶豫不決。<br/>\n<br/>\n「<font color=\"#800080\">幫我想個好辦法吧。<\/font>」<\/font><\/p>\n<p><font size=\"3\">姐姐低頭吃水果............<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">喂，為什麼妳都不回答我？<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">ㄚ我還在想嘛，這麼困難的事！<\/font>」<br/>\n<br/>\n2006.8.22<\/font><\/p>", "comments": []}, {"id": "11825184", "title": "這樣妳還說我懂事ㄡ？", "date": "2006-08-16 18:23:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835327.jpg\"/>\n<p align=\"left\">晚上，我在房間擠奶時，姐姐拿著一盤水果進房&hellip;&hellip;<br/>\n<br/>\n「<font color=\"#ffcc99\">我在這裡邊吃邊陪妳，好不好？<\/font>」<br/>\n<br/>\n每天晚上，我都回ㄚ嬤家看臭弟，沒什麼時間陪姐姐，這是我們唯一可以交談的時候。「<font color=\"#800080\">當然好，我去把冷氣打開，這裡太熱了。<\/font>」<br/>\n<br/>\n「<font color=\"#ffcc99\">那我去關門。<\/font>」姐姐是個省能源大王，如果你打開水龍頭太久，就會被她碎碎唸。<br/>\n<br/>\n「<font color=\"#800080\">妳可以再幫我一個忙嗎？<\/font>」<br/>\n<br/>\n「<font color=\"#ffcc99\">什麼忙，ㄏㄣ~<\/font>」順勢交叉雙手，一副「小大人」樣。<br/>\n<br/>\n「<font color=\"#800080\">幫我拿個電話吧。<\/font>」<br/>\n<br/>\n「<font color=\"#ffcc99\">在哪一間呢？<\/font>」嘴角微揚，略帶笑意。<br/>\n<br/>\n「<font color=\"#800080\">抱歉，我也不曉得，可能要麻煩妳找一找囉。<\/font>」姐姐喜歡玩「裝大人」的遊戲。<br/>\n<br/>\n「<font color=\"#ffcc99\">好，請妳等一下，我去找了。<\/font>」說完，向我點了點頭，關上門就出去了。<br/>\n<br/>\n不一會兒，電話已經交到我的手上。<br/>\n<br/>\n「<font color=\"#800080\">謝謝，妳真是個懂事的孩子，真希望以後弟弟也像妳一樣懂事。<\/font>」我想適時讚美一下。<br/>\n<br/>\n「<font color=\"#ffcc99\">我懂事啊哈？你說我懂事啊？我每次吃飯都要人家餵還要人家催，你還說我懂事ㄡ？<\/font>」她笑著問我：「<font color=\"#ffcc99\">ㄚ每次我住ㄚ嬤家就一直跟妳說bye-bye 就是要叫妳回家我要做壞事了，這樣妳還說我懂事ㄡ？我這樣還有懂事嗎？<\/font>」<br/>\n<br/>\n真沒想到，一句謝謝，惹來這麼多的「舉一反三」&hellip;&hellip;&hellip;<br/>\n<br/>\n2006.8.16 阿微 4 足歲<\/p>\n<\/font><\/p>", "comments": []}, {"id": "11825863", "title": "媽媽說不能跟講你啦！", "date": "2006-08-06 06:11:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835364.jpg\"/>\n<p align=\"left\">晚上，到ㄚ嬤家載臭弟的路上，我跟姐姐在車子上耳語：<br/>\n<br/>\n「<font color=\"#800080\">微微，父親節快要來了，妳要不要像上次一樣，畫一張圖給把拔，讓他有一個驚喜？<\/font>」去年，我們趁把拔洗澡時，躲在房間裏偷偷畫了張畫，等把拔睡著時，再把它貼在門口，隔天，姐姐一反往常，一早就坐在沙發上，等著享受「看把拔驚喜」的喜悅。<br/>\n<br/>\n「<font color=\"#ffcc99\">我早就知道了，而且我已經畫好在學校了。<\/font>」一副「老神在在」的模樣。<br/>\n<br/>\n「<font color=\"#800080\">可是，父親節是星期二， 等妳拿回來時已經是晚上，這樣就沒有驚喜了呀。<\/font>」 通常學校會在節日當天放學時發回她們的作品。<br/>\n<br/>\n「<font color=\"#ffcc99\">好吧， 那我再畫一張，然後妳再幫我把它貼在綠色的門上面<\/font>」。<br/>\n<br/>\n「<font color=\"#800080\">不要啦，我們這次貼在最外面的門，這樣把拔打開門就會嚇一跳&hellip;說：『哎喲，這是誰畫的圖呀？』<\/font>」。<br/>\n<br/>\n「<font color=\"#ffcc99\">是嗎？<\/font>」她接著說，有點「小大人」的樣子。<br/>\n<br/>\n「<font color=\"#800080\">對ㄚ<\/font>」。<br/>\n<br/>\n「<font color=\"#ffcc99\">那我們不要跟把拔講，這是我們的秘密ㄡ。<\/font>」說完，嘴角微揚，用斜眼瞄了瞄把拔。<br/>\n<br/>\n「<font color=\"#800080\">好！<\/font>」<br/>\n<br/>\n「<font color=\"#0000ff\">你們在說什麼啊？<\/font>」把拔邊開車邊問，姐姐笑而不答。這年紀的她，只要覺得跟妳是好朋友就會跟妳分享秘密 (雖然有時候「秘密」的內容沒什麼大不了，對她們來說這可是「天大」的事)。<br/>\n<br/>\n「<font color=\"#0000ff\">不公平，每次你們有秘密都不告訴我&hellip;<\/font>」<br/>\n<br/>\n後來， 把拔竟然趁我不在的時候&hellip;<br/>\n<br/>\n「<font color=\"#0000ff\">妳剛剛跟媽媽講什麼秘密？<\/font>」<br/>\n<br/>\n「<font color=\"#ffcc99\">不能告訴你。<\/font>」姐姐很慎重的回答，她是個「一諾千金」的好孩子。<br/>\n<br/>\n「<font color=\"#0000ff\">喔&hellip;不然，我也跟你講一個祕密好不好， 妳不要跟媽咪講喔。<\/font>」<br/>\n<br/>\n「<font color=\"#ffcc99\">好啊！<\/font>」。<br/>\n<br/>\n「<font color=\"#0000ff\">那你先跟我講你和媽咪的祕密，我再跟你講。<\/font>」把拔竟然如此攻於心計。<br/>\n<br/>\n「<font color=\"#ffcc99\">可是這樣就沒有『驚喜』了呀！<\/font>」渾然不覺已經掉入把拔設的陷阱裏。<br/>\n<br/>\n把拔瞪大眼睛說「<font color=\"#0000ff\">妳說要給我驚喜喲？<\/font>」&nbsp;<br/>\n<br/>\n一看自己不小心洩了密，她馬上哭了出來說：「<font color=\"#ffcc99\">媽媽說不能跟你講啦！<\/font>」<br/>\n<br/>\n好一個信守承諾的孩子！<br/>\n<br/>\nP.S.<br/>\n有一天在車上，她問我：「<font color=\"#ffcc99\">為什麼父親節我
