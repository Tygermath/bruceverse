都有畫圖送把拔，ㄚ兒童節的時候你們都沒有畫圖送我？<\/font>」<br/>\n<br/>\n2006.8.6<\/p>\n<\/font><\/p>", "comments": []}, {"id": "11827070", "title": "如果我說不會，妳會不會很傷心？", "date": "2006-08-03 12:26:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"img/93/1400835391.jpg\"/>\n<p>親朋好友常說姐姐有特異功能，在預測未來的事情上，常有幾分準，以下是她的特異實蹟&hellip;&hellip;<br/>\n<br/>\n1. 有一年公司尾牙，我問她：「媽媽明天尾牙會不會中大獎？」，她說「會」，我就抱了第一獎（NTD30,000）回家。隔年，再問同樣問題時，她回我：「如果我說不會，妳會不會很傷心？」果然，不出所料。第三年，還是同樣問題，她告訴我：「媽媽，妳會中大獎ㄡ。」，我又抱了二獎（NTD20,000）回來。<br/>\n<br/>\n2. 有一次，ㄚ嬤說她經過彩券行順手買了一張樂透，正打算收到口袋時，姐姐開口了：「ㄚ嬤，妳不會中獎啦。」事後證明連一個號碼也沒中。<br/>\n<br/>\n3. 舅舅報名中華電信新進員工甄選，事前準備不充分，臨考前幾天，問姐姐：「舅舅會不會考上？」「會啊」一點不猶豫，大家夥心理好幾個問號：「可能嗎？」幾個月過去，有一天，舅舅打電話來，「大姊，微微猜中了&hellip;&hellip;&hellip;」。<br/>\n<br/>\n4. 有一天晚上，把拔說統一獅和興農牛在新莊體育場有一場比賽， 要帶姐姐去感受一下現場的氣氛，下半場接近尾聲時，因比數相差太大而且隔天還要上課，我們決定先行離開，在回家的路上，我問姐姐：「妳覺得橘和綠誰會贏？」「X 會贏」（因時空距離遙遠，已不復記憶），我告訴把拔，他說：「除非有大逆轉」，之後也沒放心上。隔天翻開報紙一看，我馬上打電話給把拔，「真的假的，X 真的贏了！」<br/>\n<br/>\n5. 三阿姨的銀行舉行內部考試，每天晚上回家以後扣掉和姐姐、Bu-Bu 玩的時間，已經沒剩多少可以讀書。「鐵定完蛋的！」三阿姨很擔心，ㄚ嬤告訴她：「去問問看靜微。」於是三阿姨走過去，「微微，三阿姨明天會不會通過考試？」「會啦」隔天， 我回家時，三阿姨笑瞇瞇說：「過了」。<br/>\n<br/>\n6. 2004 年總統大選時，我問她：「阿扁會當選還是連會當選？」她回答：「阿扁會當選，可是連會第一名」。當下，我只覺得納悶，因為不合邏輯。後來發生 319 槍擊事件，我這才恍然大悟&hellip;&hellip;原來如此，好一個先知啊！<br/>\n<br/>\n7. 在我不確定是否懷了第二胎時，姐姐跑來告訴我說「有啦！妳的肚子裏已經有一個娃娃，而且是一個男生」。<br/>\n<br/>\n8. 我們家並沒有政治狂熱份子，不過這次的國民黨黨主席選舉競爭非常激烈，閒話家常之餘，我們好奇地問了問姐姐：「馬和王誰會贏？」其實這個問題我之前已經問過兩次了，她每次的回答都一樣，今天我特別把主詞對調，想看看答案是不是一樣。「我不是已經跟妳說過馬會贏了嗎？」乖乖，大家都說我們應該去簽賭，肯定海撈一票的&hellip;&hellip;&hellip;&hellip;<br/>\n<br/>\n2006.8.3<\/p>\n<\/font><\/p>", "comments": [{"name": "", "date": "2012-01-28 07:30:27", "url": "", "text": "微微真是太厲害了", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "", "date": "2012-01-28 07:31:24", "url": "", "text": "希望我們家也有個先知", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "", "date": "2012-01-28 07:32:29", "url": "", "text": "有先見之明啊！", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "11829103", "title": "ㄚ嬤，妳明天要好好照顧 Bu-Bu ㄡ", "date": "2006-08-01 14:34:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835348.jpg\"/>\n<p align=\"left\">我每天下班後都到ㄚ嬤家看弟弟，爸爸和姐姐則是偶而過來，今天剛好是 Bu-Bu 幼稚園這學期最後一天上課，明天一早 Bu-Bu 就會來ㄚ嬷家過暑假。<br/>\n<font size=\"3\"><br/>\n臨走前，姐姐和大家說再見後準備穿鞋子，穿到一半突然停了下來。<br/>\n<\/font><font size=\"3\"><br/>\n「<font color=\"#ffcc99\">媽媽，妳等我一下，我要跟ㄚ嬤說一件事。<\/font>」說完，馬上跑到ㄚ嬤旁邊。<br/>\n<\/font><font size=\"3\"><br/>\n「<font color=\"#ffcc99\">ㄚ嬤，妳明天要好好照顧 Bu-Bu ㄡ。<\/font>」ㄚ嬤聽完一頭霧水。<br/>\n<\/font><font size=\"3\"><br/>\n「應該是好好照顧弟弟才對吧？」<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">不是啦，妳要好好照顧 Bu-Bu，因為她 ㄏㄛ 比較頑皮，有時候會不小心壓到我弟弟啦&hellip;<\/font>」<\/font><\/p>\n<p><font size=\"3\">&nbsp;P.S.<br/>\n有一次，臭弟洗完澡躺在床上，我聽到姐姐對他説：「<font color=\"#ffcc99\">弟弟，我這麼疼你，這麼愛你，你以後長大要記得ㄡ，不可以因為比我強壯就欺負姐姐ㄡ。<\/font>」<br/>\n<font size=\"3\"><br/>\n2006.8.1<\/font><\/font><\/p>", "comments": [{"name": "greendog嘉雲", "date": "2008-03-24 16:36:07", "url": "", "text": "看到你這文，想到看到一段話轉述<br />\n曾野綾子&quot;中年以後&quot;<br />\n孩子是一種不可思議的存在，無論好壞，會讓你的人生過地更馥郁濃密，<br />\n歡喜和怨憎也都更深，那是孩子的存在所帶來的贈禮......<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2008-03-28 10:43:36", "url": "", "text": "我不懂這位日本人的話...希望不是翻譯的問題...<br />\n<br />\n不過，大概可以和我歸在同一派，同屬支持生小孩的一派吧", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "11828789", "title": "我好像已經不癢了耶", "date": "2006-07-31 19:45:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835322.jpg\"/>\n<p align=\"left\">姐姐和ㄚ嬤一家人從淡水玩回來後，腳掌出現許多疹子，晚上睡前坐在床上拼命抓癢，還不斷自言自語：「<font color=\"#ffcc99\">奇怪，怎麼會這樣，我到底是吃到什麼東西？<\/font>」<br/>\n<br/>\n她抬起兩隻腳仔細端詳，「<font color=\"#ffcc99\">難道是右腳傳染給左腳嗎？為什麼只有左腳會癢？還是香港腳？<\/font>」&nbsp;<br/>\n<br/>\n「<font color=\"#ffcc99\">ㄡ，實在是太癢了&hellip;.我都快要忍不住了&hellip;&hellip;<\/font>」 姐姐是個聽話而自制力又強的孩子（或者應該說膽小？），爸拔告訴她不要亂抓癢──萬一抓破皮流血，就從癢變成痛了。因此，不管再怎麼癢，姐姐頂多只用「指腹」摩擦摩擦。<br/>\n<br/>\n「<font color=\"#ffcc99\">會不會是吃了太多薯條的關係？<\/font>」平常我們會限制她只能吃幾條，也會告訴她薯條對身體不好，糖果吃多會蛀牙&hellip; 聽完之後她說：「怎麼好吃的東西都對身體不好啊？」<br/>\n<br/>\n看她這樣自言自語了老半天，我覺得道義上應該搭搭腔，「<font color=\"#800080\">妳可能是肚子裏有太多細菌，要不要多喝一些水把細菌沖出來？<\/font>」<br/>\n<br/>\n「<font color=\"#ffcc99\">嗯，對ㄡ<\/font>」 她馬上拿起水壺咕嚕咕嚕喝了半瓶水&hellip;隔了一分鐘左右&hellip;「<font color=\"#ffcc99\">ㄟ，我好像已經不癢了耶&hellip;<\/font>」<br/>\n<br/>\n2006.7.31<\/p>\n<\/font><\/p>", "comments": []}, {"id": "11831579", "title": "真的很抱歉", "date": "2006-07-31 19:08:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835357.jpg\"/>\n<p align=\"left\">姐姐和ㄚ嬤一家人到淡水住了一晚，隔天下午回到家，上廁所時看到澡盆裡有臭笛洗完澡的水，馬上跑來房間，非常慎重的告訴我：<br/>\n<br/>\n「<font color=\"#ffcc99\">媽媽，很抱歉，我今天沒有辦法幫妳拖地了。<\/font>」眉頭微皺。<br/>\n<br/>\n「<font color=\"#ffcc99\">妳看，因為我受傷了。<\/font>」怕我不相信，她指了指膝蓋。「<font color=\"#ffcc99\">都流血了。<\/font>」這個傷口是她在淡水時，邊走邊睡跌倒來的。<br/>\n<br/>\n「<font color=\"#800080\">ㄡ，沒有關係啦。<\/font>」這種對話要給人聽見，人家會怎麼想這個媽？<br/>\n<br/>\n「<font color=\"#ffcc99\">真的很抱歉，都沒辦法幫妳做家事，唉！<\/font>」雙手交叉胸前，一副小大人的模樣。<br/>\n<br/>\n2006.7.31<\/p>\n<\/font><\/p>", "comments": []}, {"id": "11824790", "title": "唉呦，妳要小心啦！", "date": "2006-07-30 17:55:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835380.jpg\"/>\n<p align=\"left\">晚上，趕著送臭弟去ㄚ嬤家，廁所裡的洗澡水也沒來得及處理就出門了。回到家打點好一切，姐姐上床時已經是晚上十點鐘了，看著澡盆裡的水，我想倒掉也可惜，不如胡亂拖一回地總比沒拖好。於是，我拿起拖把小心翼翼，儘可能不發出任何聲音&hellip;&hellip;<br/>\n<br/>\n「<font color=\"#ffcc99\">媽媽，妳怎麼那麼辛苦，失眠那麼嚴重不睡覺還在拖地。<\/font>」本來背對著我睡覺的姐姐不知道什麼時候坐起來的。<br/>\n<br/>\n「<font color=\"#800080\">ㄚ我想說水水倒掉太浪費了啊。<\/font>」我又想來機會教育一下。<br/>\n<br/>\n「<font color=\"#ffcc99\">ㄡ，可是妳不是失眠嗎？<\/font>」<br/>\n<br/>\n「<font color=\"#800080\">我很快就拖好，妳趕快睡了。<\/font>」<br/>\n<br/>\n「<font color=\"#ffcc99\">不然把拔又要變臉了ㄡ？<\/font>」把拔有個規定，如果超過時間還講話，就會變生氣的臉，這招對她還蠻管用的。<br/>\n<br/>\n「<font color=\"#800080\">對啊。<\/font>」說完，我差點滑倒。<br/>\n<br/>\n「<font color=\"#ffcc99\">唉呦，妳要小心啦！<\/font>」說完，像個大人一樣搖搖頭。<\/p>\n<\/font><\/p>\n<p>2006.7.30<\/p>", "comments": []}, {"id": "4995849", "title": "快樂的跳舞", "date": "2006-07-21 17:18:00", "cat": "2354773", "private": false, "html": "<p><font size=\"3\"><\/font><\/p>\n<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835373.jpg\"/>\n<p>阿微正準備她的第 3 次鋼琴表演，她坐在 YAMAHA 音樂教室倒數第 2 排，坐在她旁邊的男同學比她高一個頭。因為沒有心理準備，輪到他們這一排上場的時候，兩個人都呆了，不曉得應該誰先上場。<br/>\n<font size=\"3\"><br/>\n黃老師問了一聲，輪到誰啦？幾乎所有小朋友都笑嬉嬉地比著阿微，我從教室後方望著她的背影，覺得事情不妙，只見她緩緩搖頭，事後媽咪說阿微幾乎要哭出來了。雖然，坐在她旁邊的男生終於自告奮勇率先上台，但我和媽迷都很擔心阿微的情緒沒辦法及時恢復正常。<\/font><\/p>\n<\/font><\/p>\n<p><font size=\"3\">阿微的命宮有顆擎羊星，經常像個山羊一樣，老愛跟人頂撞、作對，絕不輕易就範。如果你沒事先打聲招呼，取得她的同意，臨場才要她做這個、做那個，你最好準備看她的臉色，不然就只好讓她看你的臉色。<\/font><\/p>\n<p><font size=\"3\">幸好，剛才這點小狀況沒有引發阿微習慣性的對抗或不合作，前一位同學敬完禮，阿微就乖乖起身了。<\/font><\/p>\n<p><font size=\"3\">因為這是第3次表演，阿微又在家裡練了好多次，我這個攝影師平靜得像個局外人，倒是第1次的表演緊張刺激，值得回憶一下。<\/font><\/p>\n<p><font size=\"3\">有一天，黃老師的課上到一半，突然對大家宣布，我們今天請小朋友上台來表演吧。首先，黃老師要小朋友們把椅子推到教室中央。待大家重新就位後，黃老師開始講解遊戲規則：<\/font><\/p>\n<p><font size=\"3\">待會兒每個小朋友都要表演，表演之前先走到正前方站好，面對大家，報告自己的姓名、今天要表演的曲子，然後敬禮──這時候台下的小朋友要記得拍手。<\/font><\/p>\n<p><font size=\"3\">等敬完禮，小朋友才可以到鋼琴前面，身體坐好、雙手擺好──雙手要保持不動一下下才開始表演。表演完畢之後，雙手要擺回原來的位置，同樣要保持不動一下下才可以離開鋼琴。<\/font><\/p>\n<p><font size=\"3\">注意，不要馬上回座喔，要先走到剛剛自我介紹的位置，向大家再敬一次禮──跟剛才一樣，台下的小朋友要記得拍手，這樣才算完成表演，才可以回自己座位休息。<\/font><\/p>\n<p><font size=\"3\">講解完畢之後，黃老師問誰要先表演，每個班級總有幾個特別活潑的孩子會搶著舉手，我們很開心地把機會讓給他們。趁著他們表演的時候，我趕緊問阿微待會兒要表演什麼曲子，曲子選定之後，還得注意什麼時候輪到阿微，你得事先提醒她，讓她有起身的心理準備。<\/font><\/p>\n<p><font size=\"3\">其實，大部分的小朋友都很緊張，像是受到驚嚇的小鵪鶉。平時在爸爸媽媽身邊個個生龍活虎、笑逐顏開；但一個人獨自面對台下的觀眾時，頓時臉色慘白、口齒不清。<\/font><\/p>\n<p><font size=\"3\">有位小朋友最特別，一上台就開始揉眼睛，黃老師請她報告名字，她沒有空講話，因為她的眼睛還沒有揉好。我和其他小朋友先楞了一下，然後就忍不住開始笑，這位小女生真是太可愛了，比阿微還要害羞，一直揉眼睛，那麼認真、那麼用力地揉，好像是專門上台為大家表演揉眼睛，你真怕她把眼睛都揉出來了。<\/font><\/p>\n<p><font size=\"3\">我們越笑越大聲，一直笑到她轉身朝黃老師吆喝，我們才靜下來。黃老師不再逼問她的名字了，直接把他帶到鋼琴前面坐好，問她要表演什麼曲子。她沒有答話，也沒有動作，她的媽咪隔著好遠安慰她說，隨便一首都好啊，反正你每首都會彈。<\/font><\/p>\n<p><font size=\"3\">這句話不假，她挑了一首難度最高的曲子，而且彈得很精準，讓人肅然起敬。她揉眼睛的時候，你知道她在逃避某些東西，你以為她不會彈，其實她彈得最好，你親眼目睹了怯場為何物。<\/font><\/p>\n<p><font size=\"3\">輪到阿微的時候，她也一樣嚇壞了，她沒有揉眼睛，但是她望著台下的小朋友發呆，還好黃老師問一句，她答一句，總算勉強完成了自我介紹，其實，你只看到嘴巴動，因為聲音太細了。<\/font><\/p>\n<p><font size=\"3\">我看著黃老師從背後輕輕推著阿微，讓她在鋼琴前面就坐，讓她的雙手在琴鍵上就位。我聽到心臟砰砰砰的聲響，天啊，我這一輩子只曾為自己的事情心悸過，莫非我的心跑到阿微那裡去了？<\/font><\/p>\n<p><font size=\"3\">接下來就是一連串音符緩緩從阿微的指尖綻放，你感覺心跳得更快了，因為你不曉得下一刻是不是還能像剛才一樣流暢，你被拋在半空中，心懸在半空中，表演藝術最迷人的魅力就是這種不確定性吧？心跳聲還未停歇，淚水又跟著來了，寶貝女兒啊，那散發光彩與魅力的人真的是妳嗎？<\/font><\/p>\n<p><font size=\"3\">終於，我屏著呼吸，聽著、看著阿微的大姆哥按下最後一個音符，我恍若剛獲得六福村大怒神的饒恕，從空中安全著陸。心跳聲雖然消失，淚水卻決堤了。我使勁地鼓掌，大概潛意識以為掌聲可以治水吧。<\/font><\/p>\n<p><font size=\"3\">下課前，黃老師說下週還要請大家再表演一次。我問阿微高不高興，她噘著嘴說，以後我不要上台表演了，但我知道她真正想說的是，我不喜歡無預警的意外。一週之後，她開開心心地上台作第生平第2次鋼琴表演。<\/font><\/p>\n<p><font size=\"3\">之後，我等了3個月才又等到第 3 次與第 4 次表演機會。我跟阿微說，這次我們來彩排。阿微一臉疑惑，「什麼是彩排？」。<\/font><\/p>\n<p><font size=\"3\">爸比扮演黃老師，媽咪扮演同學，阿微扮演自己，電子琴扮演鋼琴，客廳扮演教室，這就是彩排。<\/font><\/p>\n<p><font size=\"3\">之後，阿微經常吵著要彩排，角色扮演遊戲永遠是孩子們的最愛。我突然有種領悟，不曉得應該高興或傷悲：童年是一場多麼有趣的彩排，只可惜彩排的終點是殘酷現實的成人世界。<\/font><\/p>\n<p><font size=\"3\">Ps.<br/>\n阿微「正式」表演過的曲目：<br/>\n第 1 次：松鼠的搖籃曲<br/>\n第 2 次：活潑的孩子們<br/>\n第 3 次：快樂的跳舞<br/>\n第 4 次：蜜蜂進行曲<\/font><\/p>", "comments": [{"name": "玉山", "date": "2006-07-21 15:03:03", "url": "", "text": "讀完以上精闢的描述，發覺阿微的老爸，心思可真細膩，完全<br />\n就是以職業級作家的觀察力道加上一位平凡父親對女兒全心全<br />\n意的關愛之情，淋漓呈現．．．！<br />\n<br />\n不過，阿微老爸的真情流露，本人可相當能理解－－－<br />\n因上回ＢＵＢＵ幼幼班的母親節表演（獻花一幕：其實是很俗<br />\n套的劇碼），但，不知怎的，在下的眼眶．．．竟也略略閃了<br />\n一點點淚光．．．<br />\n<br />\n親情的力量，是很微妙的！不經意便露了饀（自己可是了然於<br />\n胸的）．．．<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "流月無聲", "date": "2006-07-26 12:11:46", "url": "blog.sina.com.tw/endiana", "text": "微微很可愛啊，<br />\n能看見自己的寶貝有所成長事件非常欣喜的事。<br />\n不過，很可惜不知道是否是電腦連線問題，<br />\n無法順暢欣賞，<br />\n但相信是很棒滴！", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2006-07-26 14:52:37", "url": "", "text": "能得到胡大俠的讚美，微微的爸爸真是替她感到光榮啊！<br />\n<br />\n由於影片檔大概有 50 MB，所以下載的時間要比較久一點，下次<br />\n我會放解析度小一點的檔案<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "4952061", "title": "蘇起　內功深厚的英文高手", "date": "2006-07-17 23:25:00", "cat": "3966439", "private": false, "html": "<p><font size=\"3\"><font face=\"標楷體\" color=\"#993300\">本篇專訪原載於《建中人》一甲子校慶特刊（94.12.10出刊），特此感謝蘇起先生慷慨同意轉載。<br/>\n<\/font>\n<p align=\"center\"><img loading=\"lazy\" height=\"343\" alt=\"\" src=\"\" data-lost=\"35/1777051015.jpg\" width=\"500\"/><\/p>\n<p align=\"center\">&nbsp;<font face=\"標楷體\">建中時代的蘇起：為自己打球，為自己讀書。<\/font><\/p>\n<\/font><\/p>\n<p>&nbsp;<\/p>\n<p><font size=\"3\">從「立法委員、陸委會主委、新聞局長&hellip;」這些頭銜，以及透過新聞媒體的鏡框所得到對蘇起學長的印象，原本以為這會是一場充滿政治味的訪談，但實際情形完全不是如此。民國56年自建中畢業的蘇起，接受採訪時雖然身在立法院，卻似乎乘著記憶的翅膀回到了高中母校。<\/font><\/p>\n<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" height=\"343\" alt=\"\" src=\"\" data-lost=\"35/1777051017.jpg\" width=\"500\"/>\n<p>首先浮上蘇起腦海的是橄欖球和足球，這是當時建中最流行的兩項運動，蘇起也跟著同學一起玩。起初是打橄欖球，不料打了兩次襯衫都被撕破，於是改踢足球。大概因為缺少足球的基礎，而籃球又打得不錯，蘇起一開始被同學選為球門，「我這個球門顯然當得還不錯，兩年只給人進了一球，所以我們班連續兩年都是冠軍｣。<br/>\n<br/>\n運動家的外型正好反映出內在壑達的個性，蘇起才剛講完這段英雄事蹟，話鋒一轉，就換了一件糗事。<br/>\n<br/>\n<\/p>\n<\/font><\/p>\n<p>&nbsp;<\/p>\n<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" height=\"349\" alt=\"\" src=\"\" data-lost=\"35/1777051016.jpg\" width=\"500\"/>\n<p align=\"center\"><font face=\"標楷體\">兩年只給人進了一球，還能不拿冠軍嗎？<\/font><\/p>\n<\/font><\/p>\n<p>&nbsp;<\/p>\n<p><font face=\"標楷體\" color=\"#993300\" size=\"4\">音樂課受挫，從此不敢唱卡拉OK<\/font><\/p>\n<p><font size=\"3\">蘇起自嘲沒有音樂天份，在建中卻碰到一位教學很認真，對學生也很嚴厲的音樂老師，有一回挨了老師一頓駡，讓他的自信心完全喪失，音樂成了學生時代最大的惡夢，蘇起用十足開玩笑的口吻說，「現在到卡拉OK都不太敢唱，對我後半輩子影響很大｣。<\/font><\/p>\n<p><font size=\"3\">對音樂的畏懼雖源自老師，但蘇起對英文的興趣也是源自老師。初中開始學英文時，就遇到一位長髮披肩、非常漂亮的女老師，使得全班都迷上英文，「我們那時候哪懂得那麼多，只覺得這個老師漂亮，因為喜歡她就跟著喜歡英文」。後來到建中又遇到同樣的狀況，英文老師剛從師大畢業，比學生大不了幾歲，跟學生的互動很好，這就是所謂的移情作用吧。<\/font><\/p>\n<p><font size=\"3\">蘇起在台中出生，一家人輾轉搬到中壢，最後又搬到台北，就是為了考建中。早期建中有初中部，可惜命運捉弄人，初中部在蘇起正要參加考試的那一年取消，於是他多等了三年才考進建中。<\/font><\/p>\n<p><font size=\"3\">「我們家男生都是建中畢業的，我們非常感恩。｣蘇起這麼謙虛，又是個運動健將，再加上從高二就選定文法科，原本以為蘇起的學業成績只是普通，後來才知道他不但成績優異，還以第一志願保送政大外交系，甚至連口試都不需要。為什麼選擇外交系呢？除了對英文的興趣之外，蘇起回憶當時閉塞的台灣環境，「讀了那麼多世界上的事情，總覺得應該走出臺灣看看。」<\/font><\/p>\n<p><font size=\"3\">雖然學業成績名列前茅，蘇起卻很感慨，「我一點都不enjoy，名次造成許多無謂的競爭，其實每個人有不同的潛力」，也許是記者、畫家、醫生、工程師，甚至企業家。因此蘇起非常反對排名，每個人該關心的是如何把自己的潛力發揮出來，同時要將眼光放遠。將來的競爭對手不見得是身邊的同學，而是目前在北京、上海、漢城、紐約的某一個人。<\/font><\/p>\n<p><font size=\"3\">提到競爭力，蘇起借用武俠小說的情境打了個比喻：中文、英文、數學是內功，其他科目都是外功，是招式、劍法、刀法，只要內功深厚，將來不論學什麼都會很快。<br/>\n<br/>\n基於自己的法政背景，蘇起特別提出英文的重要性。現在的資訊特色是「quick and thick──快速而大量」，英文好比為我們開啟了一扇窗，讓資訊得以進來，不論外界有什麼風吹草動，我們都能比別人搶先一步知道。<br/>\n<br/>\n好的決策奠基於豐富、正確而快速的資訊，如何吸收資訊顯然是影響競爭力的重要關鍵。「建中的學生將來不是領導人就是重要幕僚，絕對不能輕忽英文。」<\/font><font size=\"3\">&nbsp;\n<p align=\"center\"><img loading=\"lazy\" height=\"285\" alt=\"\" src=\"\" data-lost=\"35/1777051018.jpg\" width=\"380\"/><\/p>\n<p align=\"center\"><font face=\"標楷體\">學英文沒有捷徑，「重點是你們要把它當成一件事來做。」<\/font><\/p>\n<\/font><\/p>\n<p>&nbsp;<\/p>\n<p><font size=\"3\">關於怎麼把英文學好，蘇起的感想是沒有捷徑，要下苦功，把它當成一件事來做。他在高三、大一的時候，持續每天早上起來讀一小時的英文，遇到生字就老老實實查字典，把意思弄懂，久了之後認識的字越來越多，就會進步很快。<br/>\n<br/>\n對照今日的學習環境，蘇起有些感慨，「我們那時候走來走去都看不到外國人，沒有英文雜誌，也沒有英文報紙&hellip;我們家一直到我唸大學才有電視機，等到我出國的時候，才發現世界上還有影印機這種東西」，蘇起前前後後強調了好幾次，「重點是你們要把它當成一件事來做。」<\/font><\/p>\n<p><font face=\"標楷體\" color=\"#993300\" size=\"4\">培養國際觀，不僅為了競爭力<\/font><\/p>\n<p><font size=\"3\">雖然從競爭力談到國際觀，但蘇起認為國際觀的培養並不只是為了競爭力，「建中人很容易把自己變得很大」，因為一路走來都是第一名，很難不自我膨脹。但如果我們發現世界上有各式各樣的人種與宗教，就會把自己變得比較小，學會互相尊重，人和人之間的相處會站在比較平等的地位。<\/font><\/p>\n<p><font size=\"3\">對於國際觀的培養，蘇起建議採取輕鬆一點的心情，先從培養興趣開始，例如每個禮拜看一點英文雜誌或小說，不要有壓力。「當成調劑會比較容易進入我們的system，如果當成苦功就難了。」<br/>\n<br/>\n談到這裏蘇起特別推薦了一本書：《人類的故事（<br/>\nThe Story of Mankind）》，原著為「房龍（Hendrik Van Loon）」。作者用祖父對孫子講故事的口氣來講人類歷史的發展，所以很淺顯易懂。「這是我第一本從頭讀到尾的英文書，讀了好幾遍，對我啟發很大，原來人類的發展有很多面向，每個地方都有特色。｣<\/font><\/p>\n<p><font face=\"標楷體\" color=\"#993300\" size=\"4\">為自己讀書<\/font><\/p>\n<p><font size=\"3\">或許是學弟們的仰慕之情表現得太明顯，蘇起突然提起了學生時代最自豪的兩件事：從未補過習、從未作過弊。「考不好就考不好，無所謂。」與其說這是自我要求或「慎獨」的工夫，蘇起更強調為自己讀書，人的一生不是為了討好爸爸媽媽，也不是為了得高分，而是為了提高自己的競爭力來讀書。<br/>\n<br/>\n如果抱著為別人、為考試而讀書的態度，就容易產生作弊的想法。那些為自己讀書的人，由於出自心甘情願，讀書時間雖然比不上參加補習的人，但讀書比較專心，效果一定比較好，更何況跑補習班常把自己弄得精疲力盡，得不償失。<\/font><\/p>\n<p><font size=\"3\">蘇起很遺憾台灣的社會缺少讀書風氣，有錢人寧可花大筆鈔票把家裏裝潢成宴客的場地，卻吝於安排一間書房。究其原因，很可能就是從小只為考試、為別人讀書，有朝一日壓力解除，沒有人在一旁盯著，也就不再讀書了。<\/font><\/p>\n<p><font size=\"3\">在立法院一個小時的訪談，蘇起不疾不徐的談吐讓人如沐春風，不論什麼話題，總會回到該給學弟們什麼樣的人生建議。「長大以後，你們會發現社會上的人際關係很複雜，不像學校認識的朋友那麼真誠，所以，不要常常跟同學吵架，也不要常常嫉妒來嫉妒去的。」蘇起對建中情懷的追憶之情溢於言表，願學弟們都能更加珍惜同學之間的友誼。<\/font><\/p>\n<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" height=\"285\" alt=\"\" src=\"\" data-lost=\"35/1777051019.jpg\" width=\"380\"/><br/>\n<font face=\"標楷體\">蘇起和來訪的學弟們合影於立法院中興大樓貴賓室<br/>\n<br/>\n<br/>\n<font face=\"新細明體\">\n<p align=\"left\">==================================<br/>\n後記<br/>\n<br/>\n<font face=\"新細明體\">我曾經以為自己能勝任記者、編輯，甚至作家的身份，寫完這篇專訪之後，才知道自己的專長不在於此。雖然只是 1 個小時左右的訪談，只有 2500 字左右的篇幅，卻寫得筋疲力盡。我的意思不是「能不能把一件事做好？」，而是「要花多少力氣才能把一件事做好？」，以及「能不能做得比別人更好？」。<\/font> <\/p>\n<\/font>\n<p><font face=\"新細明體\" size=\"3\">這篇專訪的標題是我下的，但分段以及各段標題是主編下的。事實上，主編做的事遠遠超過這些，我不得不承認，她的眼光真是銳利，隨便看看，就挑出一堆不當的用語，剛好是修辭上的缺陷，是我想了老半天也還修補不了的缺陷──雖然，她並不一定告訴你該怎麼修，但你知道，在她底下不容易混得過去。我相信有一天她的名字會讓人肅然起敬，她叫做羅若禮。<\/font><\/p>\n<p><font face=\"新細明體\" size=\"3\">若禮很強勢，是得理不饒人的那一類型。但她是女生、是實習老師、剛從學校畢業、年紀又比我小得多，於是，她的傲慢和我的偏見吵了一架。我驚覺自己的人際關係在此被歸零了（其實對若禮而言又何嘗不是？），我也驚覺自己在前一個公司待得太久了，久到以為世界應該以我為中心。我隱約覺得，在一個人際關係歸零的環境，你得到的尊重才是真正的尊重。<\/font><\/p>\n<p><font face=\"新細明體\" size=\"3\">這篇專訪的另一個收穫是遇見蘇起。我對政治向來漠不關心，更遑論政治人物，工作如此分配，只能用緣分解釋。但我喜歡冒險的心情是愉悅的，當我在立法院中興大樓的入口看見柯俊雄和馬永成的時候，我依稀可以辨認出追星族看見偶像的感覺，雖然政治人物和演藝人員對我而言只是茶餘飯後的閒聊話題。<\/font><\/p>\n<p><font face=\"新細明體\" size=\"3\">蘇起不算媒體寵兒，我對這次專訪也沒有特別的期待，事實上，採訪前的功課全都交給建中青年社的同學負責。好吧，我承認我經常狀況外，直到採訪完畢，我才知道要負責編寫工作，我原本以為只需要協助錄音和攝影，我在建中常常這樣子碰上一連串的意外，美麗的意外。<\/font><\/p>\n<p><font face=\"新細明體\" size=\"3\">我對政治人物有一套刻板的印象，大抵就是「表演工作坊」在《這一夜，誰來說相聲》所刻畫的那個樣子──「嗯&hellip;啊&hellip;嗯&hellip;啊&hellip;嗯&hellip;啊&hellip;大家辛苦了！」但蘇起很不一樣，他其實更像學者或老師。<\/font><\/p>\n<p><font face=\"新細明體\" size=\"3\">像學者的部分是犀利，他非但不迴避問題，而且每次回答都直指問題要害；像老師的部分是斯文，若禮描述錢復的文字其實也很適合蘇起：「措辭優雅、熊度從容、一派名士風範、令人折服」。<\/font><\/p>\n<p><font face=\"新細明體\" size=\"3\">但他也有像政治人物的一面。我第一次請蘇起幫忙，是請他提供建中時代的老相片，希望增加專訪的趣味性與說服力。他當天回信說「找找看」的時候我只當是客套話，沒想到蘇起第二天就把照片交給我了。<\/font><\/p>\n<p><font face=\"新細明體\" size=\"3\">第二次請蘇起幫忙是想徵求他的同意，將這篇專訪放在我的部落格，畢竟受訪者才是主角。沒想到信才寄出一會兒，就得到蘇起肯定的答覆，而且還不忘提醒我，暑假是K英文的好時機，要好好把握。<\/font><\/p>\n<p><font face=\"新細明體\" size=\"3\">為什麼說蘇起在這兩件事情的表現像是政治人物呢？政治人物的熱忱──對選票的熱忱，頂多也不過如此吧。<\/font><\/p>\n<\/font><\/font><\/p>", "comments": []}, {"id": "4896303", "title": "Follow Your Heart", "date": "2006-07-13 15:32:00", "cat": "2354773", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835362.jpg\">\n<p>媽咪有個特點，腦袋像台錄音機，總能有條不紊地把人物間的對話說得原音重現。大約一兩週以前，她記錄了一段和姊姊的對話：<br><font size=\"3\"><br>================================================<br>晚上，從ㄚ媽家回家的路上，我讚美姊姊穿的衣服很漂亮。<br><\/font><font size=\"3\"><br>「<font color=\"#ffcc99\">可是，妳知道嗎？有一天我跟ㄚ媽去公園的時候，我有看到一個很小很小的小朋友，他ㄏㄛ年紀只有三歲，三歲而已ㄡ。<\/font>」她比出「三」的手勢，眼睛瞪得大大的。<\/font><\/p><\/font>\n<p><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">才三歲就戴了耳環、項鍊、手環和戒指，很誇張ㄡ，戴那麼多東西，可是真得很美麗。<\/font>」最近三阿姨給了姊姊一堆首飾，所以她對這些東西很有興趣。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">可是妳長得那麼可愛，雖然沒有戴東西還是很漂亮ㄚ。<\/font>」我一直擔心她太崇尚物質，所以對這種話題總是表現得興趣缺缺…<br><\/font><font size=\"3\"><br>====================================================<br><br>媽咪的風格是「表演工作坊」，即便是悲劇，也喜歡用輕鬆幽默的方式呈現。所以啦，媽咪只喜歡記錄兩個寶貝讓人噴飯的事情。上面這段對話沒有特別的笑點，媽迷說她不曉得怎麼結尾，就丟給爸比善後。<\/font><\/p>\n<p><font size=\"3\">爸比擅長的是讓人感傷，看見這個原本應該是笑話的對話，實在不曉得怎麼修改，最後決定不對記錄作任何更動，但在尾巴加上一些註解，你看看爸比是不是冷場高手：<\/font><\/p>\n<p><font size=\"3\">爸比的註解：<br><br>1.&nbsp;<br>阿微在口語表達上經常有超齡的表現，這八成遺傳自媽咪，還有兩成嘛，應該歸功於常常聽爸比講故事。最近她才得到一張獎狀，獎項是「說故事高手」。<\/font><\/p>\n<p><font size=\"3\">2.&nbsp;<br>小孩子還不太有金錢或名牌的概念，「養樂多」和「可可多」對他來講都差不多。他對事物的喜好幾乎不會受到價格或名牌干擾，而是源自內心深層的直接認同，當他在興頭上的時候，路邊的石頭可能比鑽戒或玉鐲子更有吸引力。<\/font><\/p>\n<p><font size=\"3\">珠寶首飾雖然是罪惡的溫床，但自有其獨立在金錢之外的美感，總不能說許多「貴夫人」在意首飾的「貴重」，就認為小孩也會因喜愛首飾之美而墮落成「貴夫人」。<\/font><\/p>\n<p><font size=\"3\">下次有機會，倒是可以問問阿微，為什麼喜歡這個首飾？喜歡哪個部分？或許會透露出阿微的價值觀。<\/font><\/p>\n<p><font size=\"3\">3.&nbsp;<br>有一陣子，阿微常常會拿別人送他的禮物對著我嗆聲：「你都沒有這個」，一直嗆一直嗆，嗆到我似乎免疫之後，她再下個結論：「誰叫你是臭男生」。<br><br>小朋友在意「有」或「沒有」，常常是基於一種炫耀或發表的本能。擁有什麼不一定是他真正在意的，他在意的是「我有你沒有」，他在意那個人我的差異。<\/font><\/p>\n<p><font size=\"3\">如果真是如此，我們就可試著把「擁有」的標的物從金錢、首飾等身外之物轉移到其他方面，我指的是別人奪不走的部分，屬於個性與能力的部分。與其擁有那些用錢可以買得到的財產，倒不如擁有獨立謀生的能力。<\/font><\/p>\n<p><font size=\"3\">那麼我呢？我以擁有什麼為榮呢？<\/font><\/p>\n<p><font size=\"3\">我以擁有信心為榮，我對老天爺、對自性有信心。如果有一天，當我的孩子們面對人生的關卡而感到徬徨時，我希望他們不會只是忙著從外面找答案，也會靜靜地聽，聽自性發出的聲音，接著呢，Follow your heart 就好了。<\/font><\/p>", "comments": [{"name": "玉山", "date": "2006-07-13 13:57:54", "url": "", "text": "看來你們小朱家族搭配得真是天衣無縫！！！<br />\n媽咪負責耍嘴皮子   (也就是說.學.逗.唱)<br />\n爸比專職文字的呈現及發掘背後深藏的人生哲理<br />\n微微嘛，則是動靜皆宜，能文善舞．．．<br />\n能得到雙親良性遺傳因子，真是可喜可賀！！！<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "4810013", "title": "兒子的腳", "date": "2006-07-06 17:20:00", "cat": "2354773", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" height=\"391\" alt=\"\" src=\"\" data-lost=\"2/1139613088.jpg\" width=\"400\"/>\n<p><br/>\n很久沒畫畫了，畫畫是一件迷人又駭人的事。迷人處在作畫中及完成後，駭人處在動筆前。<\/p>\n<\/font><\/p>\n<p><font size=\"3\">為什麼動筆前會害怕呢？我從來不知道自己會畫成什麼樣，作畫時彷彿手不是自己的，像是被傳說中的碟仙所支配。畫圖的成就感遠遠超過寫文章，因為結果超出預期太多，我始終懷疑作畫的不是自己的手。<\/font><\/p>\n<p><font size=\"3\">這次畫兒子其實有點狗急跳牆，因為心裡想了很久，卻一直沒有付諸行動，看著兒子的腳越來越大，越來越不可愛，真的有些擔心無法為最美的時刻留下見證。<\/font><\/p>\n<p><font size=\"3\">那天是週六，平常兒子給外公外婆帶，我只有週六週日能見到他。我在書房加班加到累了，想看看兒子，一出房門，遠遠看見他睡了，潛意識馬上號令我衝回書房拿鉛筆和白紙，我不曉得他睡了多久，不曉得他什麼時候會醒，我等不及套用先拍照再臨摹的公式，我開始寫生了。<\/font><\/p>\n<p><font size=\"3\">除了國中時代有寫生的印象之外，每次作畫大概都是照著圖片臨摹，為求精準，我甚至還打過格子。我有些訝異自己哪來的勇氣，竟然敢寫生。<\/font><\/p>\n<p><font size=\"3\">我很怕他突然醒來，很怕他的腳突然變換姿勢，我的動作必須很快。我的手一定不是我的手，我的動作沒這麼快，三兩下就把輪廓畫出來了。心才剛定下來，剛準備要捕捉光和影，兒子開始不安份了，他沒有醒，但開始搓腳了，兒子真是超愛搓腳的，阿公常常納悶，這樣子一前一後搓來搓去，怎麼都不會脫皮或受傷。<\/font><\/p>\n<p><font size=\"3\">搓腳是兒子表達情感的重要方式，他一高興起來，除了發亮的眼神、變簿的嘴唇、豐年果糖一樣的口水、抖動但不太聽使喚的小手之外，就是他踢來踢去、蹬來蹬去、搓來搓去的雙腳，他肉滾滾的小身體隨著雙腳的律動而起舞。<\/font><\/p>\n<p><font size=\"3\">這就是為什麼我們可憐的傻瓜相機和可悲的攝影技術抓不到他最可愛的模樣。他最可愛的時候，是他跳舞的時候。於是，你或多或少可以從相機連拍的畫面，從模糊的影像中，感受到他雀躍的心跳。<\/font><\/p>\n<p><font size=\"3\">話說回來，他終於醒了，在我還來不及記錄光和影之前，他醒了。就好像在我還來不及記錄女兒翻身、長牙、學坐、學爬、學步...，她已經能夠像大人一跟你聊心事了。<br/>\n<br/>\n時間是怎樣被我像賭博一樣給揮霍掉的？時間是怎樣在光與影的追逐中消逝掉的？<\/font><\/p>", "comments": []}, {"id": "4642238", "title": "花瓣", "date": "2006-06-22 17:14:00", "cat": "2185624", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051010.jpg\" width=\"380\" height=\"341\"/>\n<p align=\"left\">上天送給男人一件麻煩的東西，讓他們在梳理時比女人多了一道手續。不管這些男人是以瀟灑的鬍子自豪，還是偏好一張乾淨的臉，總不會讓鬍子自生自滅。<br/>\n<font size=\"3\"><br/>\n對阿進而言，刮鬍子不但麻煩，還讓人害怕。打從他開始用刮鬍刀，幾乎沒有一次不受傷的。痛還在其次，他最怕看見自己流血的樣子。尤其那把刮鬍刀上的銹斑，常會讓阿進聯想到破傷風。<\/font><\/p>\n<\/font>\n<p><font size=\"3\">現在，阿進正要開始他這一天的盥洗。看見鏡子裡那張邋遢的臉，他嘆了口氣，「鬍子越來越長了」。阿進已經很久沒動過刮鬍刀，那些藉口倒也有幾分道理：鬍子刮了還會再長，而且長得更兇，永遠刮不完。阿進拿起刮鬍刀看了看，心中猶豫著，再拖個幾天吧？<\/font><\/p>\n<p><font size=\"3\">在阿進的記憶裡，只有他的最愛，小芬，能夠讓他每天把鬍子刮得乾乾淨淨的。他是如此疼惜小芬，連用鬍子扎一下都捨不得。小芬讓刮鬍子這件事，從麻煩與危險變成了責任與奉獻，裡裡外外都散發出美的氣質。<\/font><\/p>\n<p><font size=\"3\">然而，兩個人分手以後，刮鬍刀也跟著失去了意義。剛失戀不久，阿進還會看著刮鬍刀安慰自己，「以後我不必再勉強自己了」。<\/font><\/p>\n<p><font size=\"3\">直到有一天，阿進仔細端詳著鏡中的大鬍子，心中的感覺從陌生到熟悉，再從熟悉到嫌惡，最後是一種無名的恐懼。似乎，不管生命中有沒有小芬，刮鬍刀都是無法逃開的宿命。<\/font><\/p>\n<p><font size=\"3\">他想辦法不照鏡子，彷彿不照鏡子，醜陋的大鬍子就不存在。但不曉得是鏡子總會冷不防的出現呢，或是好奇心總會高漲到失控的局面？每隔一段時間，他總會看見鏡中那個令人嫌惡的大鬍子。<\/font><\/p>\n<p><font size=\"3\">這情形就像潮汐一樣來來回回。為什麼明明知道刮鬍子無法一勞永逸，必須天天刮、天天刮，卻依然日復一日地讓自己陷於刮與不刮的猶疑當中？為什麼生命中會有這麼一種無法卸下的負荷？<\/font><\/p>\n<p><font size=\"3\">突然，阿進的腦海中閃過那個宣稱「上帝死了」的傢伙所說的話，「人是一片一片的花瓣，露水滴下來，便顫抖不已。」終於，他又成功了一次，成功地把視線自鏡子裡移開。但他似乎又忘了，忘了鏡中的大鬍子正跟著他一起笑著。<\/font><\/p>", "comments": []}, {"id": "4469288", "title": "東北　第一次接觸 (Part 3)", "date": "2006-06-08 06:38:00", "cat": "3966439", "private": false, "html": "<p><font size=\"3\">賽跑的時候，當你作好起跑姿勢，等待鳴槍起跑前的一刻是最緊張的，心臟像把榔頭咚咚咚地敲著。一旦起跑之後，緊張的情緒反而會得到舒解。當我拿起麥克風問話的時候，心跳聲似乎也平靜下來了。<\/font><\/p>\n<p><font size=\"3\">「<font face=\"標楷體\">先不講為什麼，直到現在，我講話的此時此刻，心中仍然有一點氣憤的情緒。我曉得師父曾經說過，貪嗔痴這些不好的習氣，出現的速度是非常驚人的，該怎麼對付呢？<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font face=\"標楷體\">你的問題其實就是如何降伏頭腦。拿頭腦想出來的辦法去對付頭腦是沒完沒了的，走路才是降伏頭腦的辦法。<\/font>」<\/font><\/p>\n<p><font size=\"3\">我原本打算，把剛才用腦袋想出的那一套「不要有任何期待」的理論拿出來就教大家，沒想到東北用「降伏頭腦」四個字，四兩撥千金地撥開了壓在心頭的疑惑。「降伏頭腦」當然不是第一次聽到，我也很清楚它的意思，但怎麼在緊要關頭就忘了呢？<\/font><\/p>\n<p><font size=\"3\">在繼續記錄之前，我必須聲明，當我回憶這些場景時，已經事隔 1 週以上，我不可能逐字逐句如實地記載我聽到的每一句話。<\/font><\/p>\n<p><font size=\"3\">我想到佛經的開頭總有「如是我聞」這四個字，這似乎代表阿難心中的惶恐，深怕自己聽錯了世尊所講的話。我的心情正是如此，所以請別忘了，這些記錄都是透過我狡猾的頭腦所記錄下來的，未必是當天真實的情況。<\/font><\/p>\n<p><font size=\"3\">我又問了一個壓在心中很久的疑惑，<br/>\n「<font face=\"標楷體\">下一個成佛的是彌勒，而且還有 56 億年之久，照這樣說，什麼時候才輪到我呢？<\/font>」<\/font><\/p>\n<p><font size=\"3\">大家聽到這個問題都笑開了，大概很少有人在宣誓大會上敲退堂鼓吧？我非常不擅長說笑話，卻引來這麼多笑聲，頗為洋洋得意，以致於沒聽清楚東北的回答。他大概是說，<br/>\n<br/>\n「<font face=\"標楷體\">時間空間都是虛幻不實的，這應該看成譬喻。彌勒代表慈悲，5 和 6 也各有所指，意謂在某些條件下，能讓自己的慈悲心升起。<\/font>」<\/font><\/p>\n<p><font size=\"3\">許多佛經都是靠著阿難記下來的，奧修的書也幾乎都是演講記錄。師父和門徒到底是什麼樣的關係呢？<\/font><\/p>\n<p><font size=\"3\">奧修對各種宗教的認識與包容是最吸引我的一個部分，我一直不願為自己的信仰作教派上的定位，我喜歡讓人知道我喜歡佛陀、喜歡耶穌、喜歡老子，但我會刻意迴避讓人知道我信仰什麼。<\/font><\/p>\n<p><font size=\"3\">奧修很重視門徒，我深受影響，如果奧修還在世，我會非常希望成為他的門徒，更別說是佛陀、耶穌，或老子了。<\/font><\/p>\n<p><font size=\"3\">我該歸依嗎？該歸依何處呢？後來，我在如是禪中心的網頁看到一篇文章<\/font><a href=\"http://www.is-zen.org/tc/practice/ao_TheBuddhaTree.htm\" target=\"_blank\"><font size=\"3\">〈佛陀成道的那一棵樹〉<\/font><\/a><font size=\"3\">，裡面寫著：<br/>\n<\/font><br/>\n<font size=\"3\"><font face=\"標楷體\">你在此並非只是要聽我講道，因為如果只是要聽我講道，你也可以去讀書、或聽錄音帶。你在此是要分享我的存在，你在此是要分享在我身上已經蛻變過的物質<br/>\n<\/font><br/>\n那篇文章是一個引信，或許不是很恰當的比喻，但我就像同志一樣出櫃了：<font face=\"標楷體\" color=\"#993300\">我要成為一個佛弟子，我要尋找一位師父<\/font>。於是，我問了今天最重要的問題：&nbsp;<br/>\n<br/>\n「<font face=\"標楷體\">要成為你的門徒有什麼條件？<\/font>」<\/font><\/p>\n<p><font size=\"3\">這個問題其實是中場休息期間，和久會閒談時，她鼓勵我提出來的。我提的是問題，但同時也是讚美，在我看來，東北的表情顯得有些靦腆，事實上，他低著頭想了好一會兒才回答。<\/font><\/p>\n<p><font size=\"3\">「<font face=\"標楷體\">我沒想過這個問題。如果你真的有興趣，就來蓮花湖（美國德州）看看吧，看看那是不是你想要的，免得被我騙了。你幾歲？<\/font>」<\/font><\/p>\n<p><font size=\"3\">「38。」<\/font><\/p>\n<p><font size=\"3\">「<font face=\"標楷體\">確實有一批 30 到 40 歲的人是要來成道的。<\/font>」<\/font><\/p>\n<p><font size=\"3\">我給他一個讚美，他也還我一個。君子如嚮，大抵如此吧。接著發言的是一位退休的女教官，Peggy 說他一臉慈眉善目，她的開場白是「我已經 50 歲了」，惹得大家一陣笑聲。<\/font><\/p>\n<p><font size=\"3\">她簡短陳述了自己求道的經過，聽起來經歷過不少波折，嘗試過不同的共修團體。她大概從母親節那一天就來報到了，一開始聽不懂東北講的話，也看不懂東北寫的書，更懷疑走路能產生什麼功效。但她持續地聽、持續地看、持續地走，突然間一切都壑然開朗了。<\/font><\/p>\n<p><font size=\"3\">她起身發言的目的不是發問，而是感謝，她坐下前補充了一句話，「以後我不會再去○○了。」大家又是一陣掌聲，主持人笑說，這裡有好幾位同修都是從○○那邊過來的。東北似乎有些感慨，「希望○○不要覺得我們一直在拉他的人。」我隱約覺得，即使如佛教這般慈悲，也難免出現門戶之見。<\/font><\/p>\n<p><font size=\"3\">修行固然無法脫離現實，甚至要順著現實，但終究要超脫現實。家人的支持是很重要的，Peggy 對修行一事向來不感興趣，她常會引用一位同事講的，「沒有自信的人才需要宗教」，我並不反對這句話，但也不贊成。<br/>\n<br/>\n我也會引用我的同修講的，「在天堂享樂的有享不完的樂，在地獄吃苦的有吃不完的苦，兩種人都不容易覺知到修行的需要」，就類似「上智與下愚不移」一樣，我覺得 Peggy 的那位同事只不過還沒享盡天人之福罷了。於是，我問東北，<\/font><\/p>\n<p><font size=\"3\">「<font face=\"標楷體\">我身邊有一些很親近的人，完全無法接受修行、證道這樣的事情，該怎麼說服他們？<\/font>」<\/font><\/p>\n<p><font size=\"3\">東北對我的問題幾乎都是立即反應，<br/>\n「<font face=\"標楷體\">不需要說服別人，只要管好自己就行了。度自己己經夠難了，不要想去度別人。事實上，等到你會飛的時候，只要願意，也能帶著身邊的人一起飛。<\/font>」<\/font><\/p>\n<p><font size=\"3\">一方面，我在提這個「說服」的問題時，還順便比眼神、比手勢，最後甚至向大家介紹了Peggy。另一方面，剛才中場休息期間，久會也鼓勵 Peggy 勇於表達自己的疑慮，就算是挑釁都沒關係。於是，Peggy 把我手中的麥克風奪了過去，頗有在 KTV 搶麥克風的味道。<\/font><\/p>\n<p><font size=\"3\">「<font face=\"標楷體\">我一直不覺得人生的真相（如果有的話）有什麼吸引力。這麼多年來，每次我看到老公對著南懷瑾、奧修，或是你的書，感動到流淚，真是覺得不可思議。如果你告訴我，這家餐廳很棒，我可以親自去嚐嚐看，然後，我可以認同或不認同你的感覺。但我對那些試圖描述人生真相的書完全沒有感覺，沒有認同也沒有不認同，就是沒有感覺，我無法體會為什麼有人會為這種事情著迷。<\/font>」<\/font><\/p>\n<p><font size=\"3\">東北對 Peggy 的疑慮顯然非常重視，他甚至鄭重其事地說，「讓我同你講幾句話」，我猜東北的意思是說，大部分的時候，他的話是講給在場所有的人聽，但此時此刻，這些話只講給Peggy 一個人聽。<\/font><\/p>\n<p><font size=\"3\">「<font face=\"標楷體\">你的話裡面出現了好多個『我』，『我』是誰呢？從哪兒來？到哪兒去呢？如果不知道前面、後面，這中間是不清楚的，難道你不想了解清楚嗎？<\/font>」<\/font><\/p>\n<p><font size=\"3\">顯然，這個打不動 Peggy。<\/font><\/p>\n<p><font size=\"3\">「<font face=\"標楷體\">你為『我』付出了一輩子，你所有的努力都建立在『我』上面，但你卻不知道『我』是什麼，你等於把房子建構在一個不可知的基礎上面，這樣不是很危險嗎？<\/font>」<\/font><\/p>\n<p><font size=\"3\">這個還是打不動 Peggy。<\/font><\/p>\n<p><font size=\"3\">其實，打不動的不只 Peggy 一個人。剛才那位女教官也帶了一個朋友，他們都是荒野協會的義工，很能領略大自然的美，她覺得人生的重點就是把握當下，認真生活，這不就夠了嗎？需要問那麼多形而上的問題嗎？知道怎麼樣？不知道又怎麼樣？<\/font><\/p>\n<p><font size=\"3\">Peggy 面對東北強烈的質問（在我聽來是棒喝了），通常是保持沈默，但這位女教官就不同了，面對東北一直追問她「我是誰？」，她實在忍不住了，<\/font><\/p>\n<p><font size=\"3\">「<font face=\"標楷體\">我承認我不知道我是誰，但請問師父，那你呢？你覺得你是誰？<\/font>」<\/font><\/p>\n<p><font size=\"3\">東北原本激動的情緒終於緩和下來了，或者說，他恨鐵不成鋼的熱忱似乎終於被這個問句澆熄了。說實在地，一方面我擔心 Peggy 會不會有受辱的感覺，另一方面我也訝異，這樣的場合不是應該很平靜嗎？怎麼會出現唇槍舌劍呢？<\/font><\/p>\n<p><font size=\"3\">熟悉我的人都曉得我很容易閃神、陷入自己的內心世界。我沒聽到東北怎麼回應那位女教官，但我覺得他應該會這麼說：本來就沒有一個我，我只是希望你們自己去發現。<\/font><\/p>\n<p><font size=\"3\">Peggy 本來就對哲學不感興趣，今天她會請假來這兒，純粹是為了陪我。後來我問 Peggy 會不會生東北的氣？她說一點也不，只覺得東北不了解她的問題而已；她反而笑說，「東北大概會覺得我不可救藥吧！」。我了解我的老婆，她可愛的地方不在這兒，就算東北聽懂了她的問題，恐怕也很難改變什麼。<\/font><\/p>\n<p><font size=\"3\">我聽見有個人問東北，<br/>\n「<font face=\"標楷體\">有好多現實問題絆著我，無法專心求道，該怎麼辦？<\/font>」<\/font><\/p>\n<p><font size=\"3\">東北顯得老大不耐煩，<br/>\n「<font face=\"標楷體\">我只能告訴你桌上有哪些菜可以吃，要吃或不吃，你得自己作決定。<\/font>」<\/font><\/p>\n<p><font size=\"3\">這和「我是誰」的問題不是很像嗎？一個人能不能升起對人生真相的好奇心，或能不能維持這份好奇心，旁人能夠協助的似乎不多。<\/font><\/p>", "comments": [{"name": "寶路", "date": "2007-11-23 06:24:49", "url": "", "text": "你這篇文章上有好多我認識的人名 包括師父..<br />\n很有趣<br />\n偶然發現你寫的<br />\n真的有趣<br />\n不過 看來妳的看法似乎很合師父說的法要呢", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2007-11-24 14:18:55", "url": "", "text": "說來慚愧，與東北老師在牯嶺街小劇場第一次見面的紀錄還沒寫完...結尾是早就想好的，但我卻一直走不到結尾，不妨藉這個機會交待一下吧：<br />\n<br />\n東北師父就像老子一樣，你可能會錯過他而不自知，因為他看起來太平凡了<br />\n<br />\n我何其有幸能接觸到東北師父，然而我卻這樣讓他從我生命中暫時離開了，我是個混蛋，從很多方面來看都是混蛋<br />\n<br />\n老實說，我對成佛這件事的熱情消失了，而我也準備像蔡康永說的，當熱情消失的時候，不要強求，就面對他的消失吧－－雖然，我還記得，也永遠會記<br />\n得，要好好的走路", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "jj", "date": "2008-03-13 13:35:27", "url": "", "text": "經由友人的轉介，連上你的網站，<br />\n看見你於November 24, 2007 10:18 PM 的回應，<br />\n一陣鼻酸。<br />\n<br />\n我們有一群人，一直依著東北老師的教導而行，<br />\n固定聚會、結伴同行，<br />\n你文中的那位教官，也都還留在這團體裡，<br />\n老師對志心求道者，或即便是感興趣者，<br />\n都是敞開的。<br />\n<br />\n若還有些熱情，歡迎與我們聯繫......<br />\n只要您願意，沒甚麼事情事會錯過的，<br />\n只待機緣成熟。<br />\n<br />\n仁杰<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2008-03-14 05:55:58", "url": "", "text": "仁杰兄：<br />\n<br />\n謝謝你伸出雙手<br />\n<br />\n剛剛才發現，你們新成立了”如是靜心中心”，這樣一來，我會更容易知道你們的近況，並隨時與你們連絡，但那將會是在我持續走路一段時間以後的<br />\n事了，畢竟，對於一個賴床賴了快 40 年，始終在計畫起床後要做什麼的人來說，重點是趕快起床，其他的事，還是等起床後再說吧", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "4398166", "title": "東北　第一次接觸 (part 2)", "date": "2006-06-02 13:58:00", "cat": "3966439", "private": false, "html": "<p><font size=\"3\">當我在 7-11 前面等 Peggy 時，我覺察到一把無明火正在燃燒。東北說過，「貪瞋癡等習氣時時現前，並於現前時速度快的驚人」。為什麼我明明已覺察到心中的憤怒，也知道憤怒無益，憤怒仍然沒有平息呢？<\/font><\/p>\n<p><font size=\"3\">於是我的頭腦開始思考了。我的憤怒來自預期的落空，我預期什麼呢？我預期 Peggy 和我在 14:00 以前會到達米悠咖啡館。我的憤怒來自於對預期目標的阻撓&hellip;不速之客、大雨、遺失的傘、插撥的電話、紅燈、遍尋不到停車位、迷路。<\/font><\/p>\n<p><font size=\"3\">我想著，人的喜樂似乎都以預期為基礎，預期被滿足（或超乎預期）就快樂，預期落空就痛苦。那麼，可不可以不要期待任何事情，或者，可不可以降低自己期待的標準，讓期待容易被滿足呢？<br/>\n<br/>\n我隨即又想，如果一再降低期待的標準，我的生活品質會不會也跟著降低，人家吃山珍海味，我只能粗茶淡飯，這種阿 Q 式的快樂真的是我要的嗎，我要讓兒女跟著一起阿 Q 嗎？<\/font><\/p>\n<p><font size=\"3\">想著想著，我和 Peggy 終於走進米悠咖啡館了，裏面大約只坐了 20 人。主持人看到我和 Peggy 是新面孔，特別領著我們往前面坐，和東北坐得近一點。<\/font><\/p>\n<p><font size=\"3\">看到東北的一瞬間，我有些無以名之的失望，他不是已經成道了嗎？為什麼他的面貌和穿著一點都不像釋迦牟尼佛呢？他的年紀看起來大約 50 歲左右，穿著 polo 衫、運動鞋。這樣的打扮實在無法聯想到一個修行有成的人啊，一點也不特別啊。<br/>\n<br/>\n（我不曉得成道的人應該是什麼樣子，但我的潛意識可能期待看到袈裟或頭頂放光吧？）<\/font><\/p>\n<p><font size=\"3\">倒是坐在東北身邊的弟子讓我精神一振，她看到我顯然也很訝異。這次東北來台灣，活動從母親節開始一連 12 天，今天已是第 10 天，她可能早就放棄了，一定沒想到我會突然出現。她比著打電話的手勢，我看著她的嘴形變化，意思是「怎麼沒打電話給我？」，我學她張著嘴但不發出聲音，「我有打，但是打不通」，她點了點頭。<\/font><\/p>\n<p><font size=\"3\">她就是促成我來此的推手，上次和她見面是在「法鼓文化」，當時我去求職面試，沒想到職缺正是她自己的位置，她就要離開「法鼓文化」了，她在找自己的接班人。<\/font><\/p>\n<p><font size=\"3\">更沒想到，我們的話題從竟從職場轉為道場，談起修行的事情來了，最後，她給了我一份東北的簡介，順便寫下她的手機號碼，我離去時她對我說，「你已經做了許多準備，所以你能聽懂我說的話」。<br/>\n<br/>\n我回想這一生求道的歷程，總是一個人踽踽獨行，她脫口而出的一句話是一種鼓勵，她決心跟隨東北證道是另一種鼓勵，我開始思考身邊有許多同修的可能，開始嚮往成為門徒的可能。<\/font><\/p>\n<p><font size=\"3\">因為她，我才會在這裏和東北見面。<\/font><\/p>\n<p><font size=\"3\">今天下午的活動是「與師父自由交談」，主持人邀請在座的同修開始發問。第一位發問的是位中年男士，西裝革履，手上拿著筆記本，記得密密麻麻。<\/font><\/p>\n<p><font face=\"標楷體\" size=\"3\">我們活在夢中嗎？如果是的話，在夢中修行能夠醒來嗎？<br/>\n<br/>\n老子寫了哪些書？什麼時候寫的？<\/font><\/p>\n<p><font size=\"3\">其他人似乎還沒準備好要發問，於是他又接連問了一些問題，在我聽來都未觸及修行的核心，一些是在累積頭腦的知識，一些是在清談，我並不太在意東北怎麼回答，我不是能夠一心二用的人，我想著待會兒要問他什麼問題。<\/font><\/p>\n<p><font size=\"3\">場面實在有些冷，人已經夠少了，在場的人也不踴躍發言，是不是該問的問題在前幾天都問完了？我觀望了好一會兒，應該不致於搶了別人的機會，我舉手發問了。<\/font><\/p>", "comments": []}, {"id": "4332855", "title": "詹宏志　意外的旅行者", "date": "2006-05-28 02:16:00", "cat": "3966439", "private": false, "html": "<p><font size=\"3\">建中有個「與大師對談」的演講活動，邀請各領域大師級的人物為建中學生演講，希望開闊學生的視野。這個講座曾邀請過曾志朗、錢復（這裡只列出我有印象的），95.5.26 邀請了詹宏志，我被指派到校門口迎接他，並帶他到會場。<\/font><\/p>\n<p><font size=\"3\">詹宏志是個知名度很高的出版人，但我對他的人和作品都很陌生。大約是 2004 年初的的國際書展吧，當年書展第一次開放由民間出版業者主辦，主辦單位是城邦集團。有些人認為城邦集團破壞了國際書展好不容易建立起來的價值與特色，將書展的主角從出版商換成了社會大眾，原本著眼國際文化交流的書展變成了媚俗的大賣場。<\/font><\/p>\n<p><font size=\"3\">我參加了那年書展的研討會，名為「數位滙流高峰論壇」，開場的主講者是大英百科全書的總編輯 Dale Hoiberg，這樣的安排當然和大英與遠流的結盟有關。王榮文和詹宏志都在台下聆聽演講，王榮文是引言人，不免要上台講幾句話，而詹宏志似乎刻意保持低調，從頭到尾擺著樸克臉，不發一語，我把那張樸克臉解讀成自大，那是我第一次見到詹宏志。我沒想到會有第二次，更沒想到那張樸克臉也有笑開的時候。<\/font><\/p>\n<p><font size=\"3\">詹宏志在建中的講題是「Have Knowledge, Will Travel.（知識帶你走到最遠的地方）」，他說以前看過一個西部片，片名是「Have Guns, Will Travel.」，以前西部牛仔四處旅行，靠的是一把槍，現代人要四處旅行，得靠知識。這不僅是一種虛擬的比喻，比喻書本讓我們四處神遊，這也發生在實體的旅行。他回憶 1989 年參加德國法蘭克福書展時，晚上回到旅館，發現電視正播放著侯孝賢的《戀戀風塵》，人的作品往往比自己旅行到更遠的地方，甚至，人往往被自己的作品帶到世界各地去旅行。<\/font><\/p>\n<p><font size=\"3\">《戀戀風塵》被翻譯成德文是一種啟發，或許西方世界對於中文世界的創作還沒有那麼迫切的需求，但只是遲早的問題。在台灣，許多人用悲觀的角度看全球化，擔心中國大陸以1/10的成本取得同樣優秀的人力資源，但詹宏志卻鼓勵建中的學生換個角度看事情，當國界逐漸消失的時候，競爭者固然增加了，但舞台也同時變大了。當我們擔心中國大陸過來搶飯碗的同時，我們是不是有勇氣把舞台延伸到美國，爭取比台灣更好的待遇。<\/font><\/p>\n<p><font size=\"3\">詹宏志出生在南投，原本是個貧窮的鄉下人，怎麼也想不到有一天會變成一年領100張登機證的空中飛人，這個意外到底是怎麼發生的？<\/font><\/p>\n<p><font size=\"3\">或許因為對高中生演講，尤其是對既將邁向大學之門的應屆畢業生演講，詹宏志花了很長的時間回顧自己的大學時代。<\/font><\/p>\n<p><font size=\"3\">考上台大經濟系之後，由於家境不好，詹宏志對於各種打工機會十分關心，家教自然不在話下。比較特別的是，有一次救國團招募編輯營的工作人員，詹宏志並不清楚工作性質，但既然學長推薦，又有錢可賺，也就答應下來。<\/font><\/p>\n<p><font size=\"3\">所謂編輯營，基本上就像救國團在寒暑假所舉辦的各種自強活動一樣，但參加這個營隊的學員都是各高中校刊社的主編，課程內容在學習如何編好一份刊物。<\/font><\/p>\n<p><font size=\"3\">除了照料高中小老弟們的生活起居之外，詹宏志還被分派到海報設計的工作。詹宏志不但不覺得累，反而覺得是無比的福氣，怎麼說呢？在他小時候，顏料是一種奢侈品，每次作畫都只能抹上一點點淡淡的色彩，想不到現在卻有各種美工材料讓他任意揮霍。於是，詹宏志把這個營隊的例行工作變成了自己的創作實驗。<\/font><\/p>\n<p><font size=\"3\">詹宏志的美工實驗吸引了瘂弦的注意。後來，瘂弦負責籌辦一場國際性的文學盛會，大會邀請的都是文壇巨擘，甚至包括諾貝爾文學獎得主川端康成。瘂弦問詹宏志願不願意擔任大會的美術設計，詹宏志答應了，之後他就窩在圓山飯店玩創意，瘂弦幫他向台大請了一個月的公假。<\/font><\/p>\n<p><font size=\"3\">那場文學盛宴結束後，詹宏志就到幼獅文藝兼差，當美術編輯了，薪水比家教還好。有一次，某位重要作家心血來潮，畫了幾幅畫，希望刊登在幼獅文藝，讓主編頗感為難，畢竟這是以文字為主的刊物。他試探性地詢問詹宏志有什麼看法，這位美編回答，一般是先有文字，然後幫文字配插畫；那麼，何不顛倒過來，幫這些畫配上文字？<br/>\n<br/>\n主編眼睛一亮，誰出的點子誰來做，問詹宏志可有意願？詹宏志答應了，而且，當他把作品交給主編的時候，主編大為讚歎，「你想當美編還是文編？」，於是，詹宏志變成了文字編輯。<\/font><\/p>\n<p><font size=\"3\">詹宏志從台大經濟系畢業之後，為了學以致用，他加入工商時報，後來又輾轉到了中國時報。當時報禁尚未解除，中國時報財力雄厚，亟思擴張海外事業。有一天，中國時報的發行人以年紀老邁為由，請詹宏志務必答應他的一項請求，什麼請求呢？到美國辦報紙。<\/font><\/p>\n<p><font size=\"3\">詹宏志就這樣到了紐約，開始以國際觀點看台灣事務。在紐約，詹宏志說他每天都在悔恨中度日。因為，報紙每天的截稿時間是 12 點，不允許他作充分的求證與思考，每天交完稿、下了班，走在回家的路上總會搥胸頓足...要是多給我 2 小時，我可以寫得更好。等到隔天見到報紙，悔恨更深...如果能多給我幾天收集資料的話...於是，詹宏志揮別了新聞業，回到台灣，回到書籍的出版工作。<\/font><\/p>\n<p><font size=\"3\">「與大師對談」是個 100 分鐘的演講，再扣掉學生遲到的時間，詹宏志意外而精彩的人生回顧被迫在離開紐約後戛然停止。他匆匆跳到最後一張投影片，上面寫著：<\/font><\/p>\n<ul>\n    <li><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"3\"><font color=\"#993300\">無窮盡的學習<\/font><\/font> <\/li>\n    <li><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"3\"><font color=\"#993300\">有知識的人走得遠<\/font><\/font> <\/li>\n    <li><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"3\"><font color=\"#993300\">勇敢的走到陌生之地<\/font><\/font> <\/li>\n    <li><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"3\"><font color=\"#993300\">勇敢的人走得遠<\/font><\/font> <\/li>\n    <li><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"3\"><font color=\"#993300\">世界很大，所以舞台很大<\/font><\/font> <\/li>\n    <li><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"3\"><font color=\"#993300\"><font face=\"Times New Roman\">Boys, be ambitious…<\/font><\/font><\/font> <\/li>\n<\/ul>\n<p><font size=\"3\">詹宏志就以「Boys, be ambitious!」結束了他在建中的演講。主持人照慣例要學生把握難得的機會，踴躍發問。但即使主持人三催四請，累積了近 1 分鐘的空白，還是沒有半個學生舉手發問。我這個帶位者兼攝影師實在忍不住了，我提了一個問題，也是這場演講唯一的問題：<\/font><\/p>\n<p><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"3\">你怎麼有這樣的勇氣，走進那麼多陌生的領域？<\/font><\/p>\n<p><font size=\"3\">或許因為詹宏志還沒有完全從回顧的情緒中走出來，或許因為他想強調自己的平凡，他又舉了一些剛到美國語言不通的糗事，以及第一次與外國人洽談版權交換時的菜鳥心情。但他並沒有忘記我的問題，而他的回答也令我永難忘記：<\/font><\/p>\n<p><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#993300\" size=\"3\">我是個鄉下來的孩子，打從我到台北的第一天開始，我就一直硬著頭皮做事，反正我是鄉下土包子嘛。我想，人的勇氣，大概是源自他開始承認自己的無知吧。<\/font><\/p>\n<p><font size=\"3\">終於，主持人宣布演講到此結束，大家鼓掌感謝講師，講師也笑著答禮，然後在主持人的陪同下離開會場。<\/font><\/p>\n<p><font size=\"3\">Ps.<br/>\n我不常迎接有個專屬司機的貴賓，直到詹宏志下車前，我對他的印象始終是國際書展上那張自大的樸克臉。下車的人確實是詹宏志沒錯，我認得他那招牌的清湯掛麵頭，但是，他怎麼笑著跑過來跟我握手？<\/font><\/p>\n<p><font size=\"3\">看他笑，我也放輕鬆了。一路上我們自在的交談，他講話時一直靠過來，讓我感到很不習慣，那樣的談話距離通常是留給哥兒們的，他的親切讓我大出意外，會不會是因為建中的光環？不過，聽完他的演講之後，我寧願相信他的親切是發自內心。<\/font><\/p>\n<p><font size=\"3\">詹宏志一直強調自己的人生充滿意外，是個意外的旅行者，這深深打動了我的心。對一個認真活在當下的人而言，雖然不強求未來，未來反而會自動展開，這個自動展開的道路就被旅行者謙稱為意外。<\/font><\/p>", "comments": [{"name": "lungchin", "date": "2006-12-25 06:50:17", "url": "http://www.wretch.cc/blog/lungchin", "text": "著實令人感動與啟發<br />\n謹轉錄貴文至在下的部落格<br />\n歡迎分享指教<br />\n敬祝　耶誕快樂<br />\n<br />\n謝隆欽　敬上<br />\nhttp://www.wretch.cc/blog/lungchin<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "bruceverse", "date": "2006-12-25 08:04:41", "url": "", "text": "謝謝您的肯定，這篇文章應該比他的作者還高興吧", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "popo", "date": "2007-01-02 05:24:58", "url": "", "text": "帶出的不僅是詹宏志先生的人生旅程，<br />\n也看得出詹先生給你的ㄧ個藍圖，讓你<br />\n更能坦然自在的走向未知的旅程，對我<br />\n而言，這篇文章是你和詹先生共同給我<br />\n的ㄧ個啟發，謝謝你的文章！", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "卡謬", "date": "2007-01-02 16:39:54", "url": "http://tw.myblog.yahoo.com/elton-blog", "text": "詹宏志也是我的偶像，與他的事業版圖完全無關。<br />\n<br />\n是他的文章，以及在趨勢、出版、網路科技領域的獨到見解<br />\n<br />\n而且充滿人文色彩的文字與演說。<br />\n<br />\n可惜他寫的書實在太少，空白了十年了吧!?<br />\n<br />\n最近不就才出一本&quot;人生一瞬&quot;<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "豆吉", "date": "2009-09-10 06:46:34", "url": "", "text": "你好，谢谢你的文章。詹先生是我的偶像，你的文字让我再了解他多一<br />\n点。<br />\n我曾有幸和他有一面之缘，他的亲切，谦和及知识实在是让我动容。<br />\n<br />\n我希望有生之年，可修得他的谦卑及求知的欲望。", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "4290384", "title": "東北　第一次接觸 (part 1)", "date": "2006-05-24 14:14:00", "cat": "3966439", "private": false, "html": "<p><font size=\"3\">95.5.23，週二下午我請了半天假，Peggy 也配合請了半天。中午 12:00 的時候，我還有一些公事沒處理完。這時候來了一位訪客，我的公務被中斷，而且我知道這一中斷會到下午13:00，沒關係，東北的活動 14:00 才開始。待會兒吃飯快一點就好了。<\/font><\/p>\n<p><font size=\"3\">13:00，訪客走了，雨卻來了。我猶豫著未完成的公務要不要授權給其他人代勞，最後還是決定自己處理，完成後的時間是13:15。關上辦公室的窗戶，我看見外頭的雨勢越來越大，真巧，我的雨傘剛好不見了，其實那本來不是我的雨傘，當初不曉得是誰忘了拿走，留在我的辦公室也有幾個月了，我也借用了好幾回，幾乎都把它當成自己的雨傘了，怎麼就偏偏在這個時候不見了呢？<\/font><\/p>\n<p><font size=\"3\">關上門，我在走廊上邊走邊看手機，有個未接電話，回不回呢？利用走路的時間夠了吧？接通後，對方要傳真一份資料給我，13:20 了，收不收呢？雨勢正大。「你現在就傳嗎？」好吧，做事不要拖個尾巴，我走回辦公室，等著傳真機吐出我要的資料，13:25了。<\/font><\/p>\n<p><font size=\"3\">現在沒有人能阻擋我了吧？只是雨還真大，我不怕淋雨，但我的隨身碟怕。我用身體護著包包（別人是用包包護著頭），在雨中跑一段，在車棚下走一段。終於，穿好了雨衣，發動了摩托車，往牯嶺街移動。<\/font><\/p>\n<p><font size=\"3\">沿路經過林家乾麵，要不要順便吃中餐呢？可是還要脫雨衣耶？不如到米悠咖啡廳附近，停好車之後再找吃的？最後你猜怎麼樣？我的摩托車轉了180度，還是在林家乾麵停下來了。客人不算多，我邊等著老闆煮麵邊東張西望，看到有個牌子寫著，營業時間：6:00-13:30，總算讓我碰到一個不錯的運氣，現在時間幾乎剛好 13:30。<\/font><\/p>\n<p><font size=\"3\">吃飽就有精神了，遇事不順的氣也消了。只是雨還是一樣大，雨衣的袖子不分裡外都是溼的，穿的時候還有些寒意。摩托車再次起程了，等了幾個漫長的紅錄燈，皮鞋也等成了雨鞋。其實，從校門口走過來，只要 5 分鐘，但我的雨傘不見了，而且，我之前答應過 Peggy ，要到捷運站接她，不過，被大雨這麼一攪和，我決定不去捷運站接她了，這麼大的雨騎摩托車怎麼接？手機在震動，我曉得是 Peggy 打來的，每次他都有本事在我最不方便接聽電話的時候打電話來，這次豈會例外？<\/font><\/p>\n<p><font size=\"3\">我在米悠咖啡館四週的小巷子轉了好幾圈，就是沒有停車位，時間還夠，但雨怎麼下成這樣，我只好在狹窄的巷子裏違規停車。下了車還得頂著安全帽，穿著雨衣行走，「唉，你最好值得」，我實在無法平息遇事不順遂的挫折感以及衍生出的憤慨。<\/font><\/p>\n<p><font size=\"3\">從牯嶺街走到南海路口，在東北住宿的教師會館對面有個 7-11 便利商店，我停了下來，把安全帽和雨衣脫掉，我一面望著溼淋淋的褲腳和鞋子，一面撥電話給 Peggy。「雨太大，我沒辦法去接你了，我們約在 7-11」。不曉得等了多久，離 14:00 只剩不到 10 分鐘。「你在哪裏？」「等捷運，往中正紀念堂。」「記得走 2 號出口。」我們彼此都沒什麼耐性多講一句話。<\/font><\/p>\n<p><font size=\"3\">終於 14:00 了，新店線和南勢角線的車子那麼多，從火車站到中正紀念堂只要兩站，也該到了吧。人沒到，電話又來了，「到底是幾號出口？」「不是跟你講 2 號嗎？沒有看到南門市場嗎？」「沒有沒有沒有&hellip;」我氣到頂點，反而呆住了（也許因為氣昏頭，所以現在已不復記憶當時講了什麼氣話）。Peggy 比較清醒，我聽到電話那頭說，「請問南海路怎麼走？」「喔，有一段路喔&hellip;」天哪，你是走到哪裏去了？<\/font><\/p>\n<p><font size=\"3\">才隔一會兒，電話響了。「你自己去吧，我還要走好久才會到。」我真的很不願意遲到，怕會錯過什麼，但我畢竟會遲到；而且，話從 Peggy 口中先說出來，我也有些心軟，我又呆了一會兒，「我會等你！」這項決定是兼顧了理性與感性，但經由氣憤的口中講出來的話，聽起來只剩下獸性。<\/font><\/p>\n<p><font size=\"3\">又過了 10 分鐘吧，我已經不在乎到底現在幾點了，但我有些好奇，事情還能怎麼糟下去，我又撥了電話，「你在哪裏？」「重慶南路」「過頭了啦！往回走」「怎麼往回走？」「難道你不是走南海路過來的嗎？你到底在哪裏！？」&hellip;「在你斜對面啦！」於是，我看到斜對面一個熟悉的身影，撐著雨傘，慢慢走向我&hellip;<\/font><\/p>\n<p><font size=\"3\">我的氣沒有消，不曉得怎麼消，接到 Peggy 之後還是碎碎唸了幾句，然後就循著冷戰的標準模式，我像個嚮導一樣遠遠地走在前面，讓 Peggy 在後面遠遠地跟，中間大概有一條牯嶺街那麼寬吧。<\/font><\/p>\n<p><font size=\"3\">前往米悠咖啡廳的階梯上，我心裏夾雜著氣憤與愧疚，「!#$%<\/font><font size=\"3\">^&amp;*()....這是一場修行座談應該有的開場嗎！」。<\/font><\/p>\n<p><font size=\"3\">ps.<br/>\n當我回憶昨天的場景，寫到這兒的時候，我心裡想的是：「魔鬼啊，如果這算是你要阻擋我和東北見面，你幾乎成功了。」<br/>\n<\/font><\/p>", "comments": []}, {"id": "4196376", "title": "self similar", "date": "2006-05-16 06:32:00", "cat": "2185624", "private": false, "html": "<p><font size=\"3\">如果一個心念的生滅就是一生，肉身的一生即可經歷無數次的輪迴，心念的生滅和肉身的生滅是自相似（self-similar）。心內眾生和外在眾生是自相似。須彌山或許是自我的比喻，也有可能須彌山和自我是自相似。<\/font><\/p>\n<p><font size=\"3\">人生充滿了自相似，不論以哪一個尺度來觀察，都會看見類似的胚騰（pattern），這是「啟發」或「共鳴」能夠發生的重要關鍵，你的觀察尺度或領域雖然不同於我，但當你提出你發現的胚騰時，那個胚騰極可能在我的觀察尺度或領域中也可以見到。<\/font><\/p>\n<p><font size=\"3\">因此，隨便一個尺度的觀察經驗都有無比的價值，因為他和其他尺度是相似的，解決了一個尺度的問題，也就解決了所有尺度的問題。<br/>\n<br/>\n（在不同尺度下或許有各自的特殊解，但應該存在一個通解，通解才能解決任意尺度的問題，戲論法或對治法是特殊解，般若觀照是通解）<\/font><\/p>\n<p><font size=\"3\">從修身齊家到治國平天下，也反應出自相似的特性。<br/>\n<br/>\nps.&nbsp;<br/>\n自相似（self-similar）是碎形數學的重要主題，最常見的例子就是 Cantor set 和 von Koch curve(snowflake)。<\/font><\/p>", "comments": []}, {"id": "3778728", "title": "知足", "date": "2006-04-08 07:35:00", "cat": "2185624", "private": false, "html": "<font size=\"3\">腳是離頭最遠的部位，也是最卑下的部位。知足意謂著遠離頭腦，從最卑微的地方開始修行。<\/font>", "comments": []}, {"id": "3693928", "title": "痛哭", "date": "2006-03-31 07:16:00", "cat": "2354773", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" src=\"\" data-lost=\"94/1065715264.jpg\" alt=\"\"/>\n<p>想到觀世音菩薩尋聲救苦，想到 Vladimir Martynov 的 Come in，再回想起昨天晚上放任展賦哭了好久，覺得自已真是罪惡深重。<\/p>\n<\/font><\/p>\n<p><font size=\"3\">我一直相信老天爺會回應我們的請求，即使拒絕也是一種回應，你可以說那是一種反向的引導，或者說是當頭棒喝，重要的是我們要先請求。這請求就是發願，發願得深，回應也深；這請求就是敲門，只要誠心敲門，觀世音菩薩必然會說：請進。<\/font><\/p>\n<p><font size=\"3\">兒子剛滿月不久，他使盡力氣哭泣，不就是對爸爸媽媽的誠心請求嗎？如果爸媽夠慈愛，就絕捨不得聽兒子一直哭，總會尋聲救苦。如果爸媽夠理智，就曉得不應該不作任何回應；因為，辜負兒子誠心的請求，等於是在壓抑他對於發願的信心、對於父母的信心，久而久之，他將成為懷疑論者，對任何事物不再有信心。<\/font><\/p>\n<p><font size=\"3\">東北居士在《無上祕法的神變（觀世音菩薩普門品）》中強調，觀世音菩薩是我們每一個人內在修持的境界，東北居士如此描述觀世音菩薩：<\/font><\/p>\n<p><font face=\"標楷體\" size=\"3\">我犯錯時，她不厭棄我。我懶時，她耐心地等待我。我不信時，她以事實來開導我。<\/font><\/p>\n<p><font size=\"3\">我們的靈性的起源，就像是我們靈性的父母，也就像是觀世音菩薩，當她聽見我們心靈的哭泣，聽見我們的請求，聽見我們的敲門，她怎麼會不伸出援手呢？重點是，我們是不是有了目標，是不是真的有達成的企圖心。<\/font><\/p>\n<p><font size=\"3\">佛陀經歷過各種不究竟的修行方式，苦行大概是最後一種吧，為此他差點死去，還好牧羊女路過而救了他。佛陀恢復元氣之後，坐在菩提樹下觀照內在世界，終於大徹大悟。他在證道之前的誓願有多深呢？他在菩提樹下發願，若不悟道，誓不起此座。這就是破釜沈舟的決心，像新生兒為飢餓所苦而發出的痛哭聲。<\/font><\/p>\n<p><font size=\"3\">孩子啊，願爸爸媽媽的一切所作所為，不致於讓你喪失了對痛哭的信心。<\/font><\/p>", "comments": [{"name": "Wife", "date": "2006-04-01 12:32:59", "url": "", "text": "Oh, my God, how can you wirte such a good article?", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "3420933", "title": "取名字", "date": "2006-03-01 01:03:00", "cat": "2354773", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" src=\"\" data-lost=\"94/1065715259.jpg\" alt=\"\"/>\n<p align=\"left\">姊姊的名字是<u>靜微<\/u>，典故出自禮記：易教也，絜靜精微。爸比對易經的認識其實非常粗淺，但據說易經在闡述「簡易、變易、不易」的哲理，或許因為喜歡數學，爸比很喜歡以簡馭繁或以不變應萬變，再加上易經帶有占卜的神祕色彩，也很合爸比的口味。<br/>\n<br/>\n絜靜精微也很有意思。絜是潔淨，沒有雜質，代表事情看得很透徹。靜是不動，以靜制動，以不變應萬變。精是精華，從各種定理中萃取出不證自明的公理，掌握公理，再應用邏輯方法，就可推演出所有複雜的定理。微是無微不至，意思是易經的道理適用每個角落。<br/>\n<br/>\n爸比這麼喜歡以典故來取名字，也就顧不得姓名學對於筆劃或五行的要求，還好<u>靜微<\/u>的總筆劃是吉的，再加上爸比的堅持與報戶口的效率，姊姊的名字很快就塵埃落定。&nbsp;<br/>\n<br/>\n幫你取名字可就沒那麼順利了。<br/>\n<br/>\n一開始爸比仍然想要找典故。最早是詩經：詩教也，溫柔敦厚。但湊不出好聽的名字。&nbsp;<br/>\n<br/>\n姜子牙願者上鈎的態度爸比很喜歡，凡事不強求，該是自己的跑不了。爸比想把牙改為芽，從種子到發芽代表成長，頗有動感。但媽咪覺得不好聽，爸比就把子芽拿來自己用，當成筆名了。&nbsp;<br/>\n<br/>\n幫你取名字的事情擱了很久，到一月中，學校放寒假，離預產期只剩一個多月，媽咪又一直有早產的跡象，爸比才又開始花心思想名字。大概這陣子對前途感到茫茫，需要悲劇來洗滌靈魂，覺得太史公的遭遇頗為合適，花了大約一週的時間翻閱楚漢爭霸的相關記錄，也看了太史公的報任安書。但腦海就是浮不出半個名字。<br/>\n<br/>\n後來轉往老莊，選擇性增加許多，例如「忘荃」，希望你不要被工具所奴役，要作工具的主人。從荃的發音又聯想到全，奧修非常推崇完全的概念，只有看得全面才會健康（wholesome），不會偏於一隅或一時。事實上，「全」和「一」的意思是相通的，於是，爸比希望你的名字中有個全或一，例如，守一、抱一、敬一、守全、抱全、敬全&hellip;&nbsp;<br/>\n<br/>\n不過，民間的習俗不希望近親之間的名字出現重疊，甚至音同字不同也要盡量避免，你的舅舅叫「一軒」，有個表哥叫「阿全」，因此，一和全都只得作罷。&nbsp;<br/>\n<br/>\n老子中有「上善若水」，若水也曾被考慮，可惜諧音近於「落水」，而且，若水這個名字較為女性化，阿公覺得男生的名字應該陽剛一點。&nbsp;<br/>\n<br/>\n老子翻完了，接著翻陶淵明集和唐詩三百首，你的名字仍然沒有進展。取名字會花這麼久的時間，筆劃是最大的關鍵，爸比在網路上找了兩三個姓名占卜的小程式，看看他們怎麼評斷每一個候選的名字，這麼一來，幾乎每個名字都有瑕疵。<br/>\n<br/>\n你在媽咪子宮的活動空間越來越小，爸比取名字的時間也越來越少，爸比決定將最後的賭注擺在莊子，不曉得是讀莊子的時間太長，還是取名字的時間太長，莊子的味道變了。<br/>\n<br/>\n惠子笑莊子大而無用的聲音在爸比心中逐漸發酵，爸比竟然認同惠子了。愛好清談、愛好作夢，自比為「天之君子」的爸比，怎麼不是大而無用呢？這輩子都顧不好了，還想下輩子。自己的家人都顧不好了，還空談教育理念。<br/>\n<br/>\n爸比想起台灣話稱農夫為「做事人」，真是貼切，農夫是少談多做的行動派，人生道理有什麼好談的呢，做點實際的事吧，從綠色的秧苗到金黃色的稻穀，這才是實際的，養活自己又養活別人，這才是成就。農夫成了爸比的偶像，爸比成了自卑的老人。<br/>\n<br/>\n你出生之後，醫院裏有很多瑣事：換尿片、唱搖籃曲、接水給媽咪坐浴、換藥，以及不停的洗手（爸比有點潔癖）。思想在這兒派不上什麼用場，爸比決定多行動，少空想，省得一事無成，卻遇到另一個極端的問題：不想就行動，會花更多的時間作修改，爸比感覺自己像個無頭蒼蠅，急於行動卻缺少效率和品質。&nbsp;<br/>\n<br/>\n終於，爸比放棄了以典故為主的路線，改以筆劃為主來取名字，爸比找了好幾種吉祥的組合，邀請長輩們一起給意見。二姨婆說，選擇太多了，先挑個幾組再來投票。爸比選了：則行、則安、則福&hellip;阿媽說，則這個字的台語發音怪怪的，福這個字又俗俗的。&nbsp;<br/>\n<br/>\n爸比索性不再想名字的事了，乾脆交給第三者，一個連爸比也不認識的人，一個算命師。幾天後，他送來五個名字。阿媽頗為讚歎，天格地格人格總格...不論什麼格統統都吉。<br/>\n<br/>\n爺爺挑了「展賦」，和媽咪想的一樣。（爸比一開始比較喜歡「峪慶」，一方面老子推崇山谷空虛的精神，另一方面奧修主張我們要經常保持慶祝的心情，人生是值得慶祝的，但爸比終究沒有把想法講出來。）<br/>\n<br/>\n你就叫<u>展賦<\/u>吧，展現天賦是人生最好的路。&nbsp;<\/p>\n<\/font><\/p>", "comments": [{"name": "Vivian", "date": "2006-03-18 14:43:29", "url": "", "text": "啟台 :<br />\n<br />\n看完這篇 &quot;取名字&quot;,<br />\n只能直呼  太曲折啦~~~~~~~~<br />\n<br />\n還好是個 happy ending,<br />\n&quot;展賦&quot; 確實是個好名字, <br />\n待25年後 &quot;大展天賦&quot;,<br />\nㄚ公ㄚ媽北鼻瑪迷阿姨叔叔.........就全靠他了.", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "劉瑀", "date": "2008-08-18 09:25:14", "url": "http://tw.myblog.yahoo.com/lululu6666666666-lululu6666666666", "text": "展賦...除了筆劃多,不容易寫得好(構圖上的融合性不好)之外...本來也沒啥缺點<br />\n但是  <br />\n姓朱ㄟ...朱展賦...前兩字的發音都是ㄓ開頭...北平人都會覺得拗口吧(何況他生在台灣...小心他以後人緣不好怪你ㄛ...)", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "Jeff", "date": "2008-10-23 08:34:39", "url": "", "text": "用google search查報導資料赫然發現, 我是另個同名同姓.<br />\n祝底迪身體健康開心長大.", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "3430374", "title": "誕生", "date": "2006-02-29 11:32:00", "cat": "2354773", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"3/1252191998.jpg\"/> \n<p>你誕生的那一天是情人節。<br/>\n<font size=\"3\"><br/>\n一大清早，爸比被客廳傳來的呻吟聲驚醒，原來是媽咪又在宮縮了。這次是真的吧？雖然昨天夜裡，你像個放羊的孩子讓我們虛驚一場，但今天媽咪好像痛得更厲害了，媽咪一邊哭，一邊記錄子宮每次開始收縮的時刻。看看那張寫著一長串數字的紙條，再看看掛在媽咪臉上的兩行淚水，「我們去醫院吧。」<br/>\n<\/font><font size=\"3\"><br/>\n所有該帶的東西媽咪都已經準備妥當，爸比只負責扶著媽咪出門；事實上，大部分的行李早就已經放在車上了，是昨天放的。回想昨天去長庚的時候，值班的護士說只開 1.5 公分，要我們在附近走一走，沒想到這一走，我們就走回家裏補眠了。<br/>\n<\/font><font size=\"3\"><br/>\n如果不塞車，飈到長庚的路程大約是 30 分鐘，現在天才剛亮，還不到塞車的時候，但媽咪叮嚀爸比開慢一點。之後，媽咪就不說話了，閤起眼睛彷彿睡著了一般，但每隔一會兒就緊蹙著眉頭深呼吸。等車子一下市民大道，媽咪再也忍不住了，車身每晃動一下，就像一根針扎著子宮，爸比不得不趕緊把車子停在路邊。就這樣，每次陣痛一來，我們就停車，一路上走走停停的，好不容易挨到了長庚。<br/>\n<\/font><font size=\"3\"><br/>\n看著媽咪一路上吃了這麼多苦頭，爸比當然自信滿滿，沒想到護士小姐卻說，還是 1.5 公分，「啊？怎麼會呢？」我們實在不願再白走一趟，才剛剛想要求情，護士小姐看見媽咪的大名，立刻決定收留我們。她帶著一點責備的語氣說，「羅良明醫生昨天等了妳一天！」隨即轉頭跟其他護士小姐介紹媽咪，「就是她啦！就是這位媽咪，走了一天才走回來！」<br/>\n<\/font><font size=\"3\"><br/>\n其實，從你跳進媽咪肚子裡，就一直有早產的跡象，大概因為媽咪百般呵護著你，在懷孕後期你長得太快了，我們反倒希望你早一點出來，免得變成巨嬰。羅良明醫生本來還預測你會提前兩週報到，沒想到現在距離 280 天的標準預產期只剩 3 天了，你還老神在在。<br/>\n<\/font><font size=\"3\"><br/>\n總之，醫院收留我們了。在爸比辦住院手續的同時，媽咪已經把大腸清乾淨，換好服裝，在床上等著和陣痛博鬥。<br/>\n<\/font><font size=\"3\"><br/>\n護士接二連三拿了幾張同意書給爸比簽，爸比只覺得自己一直在簽字，看看內容，大概就是生產或無痛分娩的種種意外或風險，爸比記不住那些醫學術語，也搞不懂那些法律條文，反正就是萬一發生不幸，敬請節哀順變，千萬別找醫院麻煩就對了。<br/>\n<\/font><font size=\"3\"><br/>\n爸比覺得自己是個割地賠款大將軍，真的有大將軍的派頭喔，爸比不到 1 分鐘就簽下了兩條命的生死書，爸比這輩子只有在媽咪生產時才這麼有決斷力。<br/>\n<\/font><font size=\"3\"><br/>\n「不是說一定要作無痛分娩啦，只是先準備好。」當爸比把同意書還給護士，她好心地安慰爸比，但聽在爸比的耳朵裡，意思是「不一定會把你賣掉啦，總要有人願意買呀！」<br/>\n<\/font><font size=\"3\"><br/>\n爸比帶著惶恐下樓買早餐，有些人在緊張的時候會嘴饞，有些人則是食不下厭，爸比屬於前者，大概是希望靠吃東西轉移注意力。<br/>\n<\/font><font size=\"3\"><br/>\n怎麼也沒想到，等爸比回待產室，媽咪竟然戴著氧氣罩，「他們怕寶寶氧氣不夠…還有，無痛分娩已經打了。」什麼！在爸比吃早餐的片刻，「輕舟已過萬重山」了嗎？不是說看看情況，不一定要打無痛分娩嗎？<br/>\n<\/font><font size=\"3\"><br/>\n然而，「人在屋簷下，不得不低頭」，此刻除了信任，信任羅良明的醫學專業與臨床經驗，無助的爸比想不到其他好辦法。\n<p align=\"center\"><img loading=\"lazy\" height=\"375\" alt=\"\" src=\"\" data-lost=\"44/1198284304.jpg\" width=\"500\"/><\/p>\n<p align=\"left\"><font size=\"3\">姊姊也是羅良明接生的，這是爸比和媽咪願意再次忍受長途跋涉，跨過新店溪，在市民大道上颷車的原因。<br/>\n<\/font><font size=\"3\"><br/>\n姊姊誕生的情況應該算緊急的，雖然我們的心情比較輕鬆。當時是凌晨三點左右，寂靜無聲，爸比沒來由地驚醒，身旁的媽咪不曉得已經坐在床頭多久，「我破水了。」<br/>\n<\/font><font size=\"3\"><br/>\n於是，爸比起身燒米酒水，等著三瓶米酒煮成一瓶水，也等著媽咪坐月子前最後一次洗澡。我們從從容容地出門，媽咪一路上也很平靜，沒有強烈的陣痛。<br/>\n<\/font><font size=\"3\"><br/>\n到了醫院，因為第一次生產沒有經驗，媽咪的大腸沒有清乾淨，所以爸比拿著便盆，在待產室和厠所來回跑了好幾趟，為了維護媽咪的清新形象，長庚護校實習生的援手被爸比一律謝絕，老天如果有鼻子，一定會頒個榮譽徽章給爸比吧。<br/>\n<\/font><font size=\"3\"><br/>\n生姊姊的情況是破水，需要打催生針，趕在 24 小時內生出來。不曉得催生是否會增加痛楚，一向堅強的媽咪奮鬥了老半天，最後還是要爸比在投降書上簽字，決定無痛分娩。不過，無痛分娩幾乎沒有效果，宮縮還是一樣地痛，護士解釋說，「針打得太晚了。」照她的講法，有相當的疼痛來自胎頭下降產生的壓迫，而非宮縮本身。不管原因是什麼，無痛分娩針八成是白打了。<br/>\n<\/font><font size=\"3\"><br/>\n你的情況和姊姊剛好相反，無痛分娩的效果太好了，媽咪的膀胱睡得不省人事，需要護士們專業的導尿協助，這次換爸比被實習生趕出待產室。<br/>\n<\/font><font size=\"3\"><br/>\n待產期間，雖然醫師囑咐媽咪好好睡一下，但護士們大約半小時就來觀察宮縮的記錄，偶爾還要內診子宮頸的開口大小，入睡並不容易。何況，隔壁還會不時傳來淒慘的哀嚎聲，「好痛啊！我不要生了啦！」<\/font><\/p>\n<\/font><\/font>\n\n<p><font size=\"3\">通常，露頭（有時露髮會更貼切一點）是產婦開始驚聲尖叫或放聲大哭的時刻，一堆護士在旁連哄帶騙，要產婦跟著子宮收縮時一起用力。護士不但嘴巴大聲疾呼，手臂也幫著推擠肚子裏的寶寶，一般要露出十元銅板大小才會推進產房。他們的動作和聲音可粗魯的，原來幫忙的臉不一定顯現溫柔。<\/font><\/p>\n<p><font size=\"3\">爸比還記得姊姊露頭的畫面，那是第一次看見她，雖然只看到頭頂，內心還是頗為激動，但四周山雨欲來的氣勢不斷高漲，實在沒有時間品味這點浪漫。時刻一到，護士們急著把媽咪推進產房，爸比手忙腳亂地穿上消過毒的手術衣，一進產房剛好聽到姊姊的哭聲，爸比錯過了母女倆切斷臍帶的時刻。<\/font><\/p>\n<p><font size=\"3\">羅良明將姊姊交給爸比捧著，她不再是隆起的肚子，也不再是超音波照片，而是一個摸得到、聽得見，還長得有點像爸比的小生命。姊姊才剛剛哭完，兩個眼珠子轉呀轉的，小手小腳晃呀晃的，這一轉一晃搞得爸比也跟著哭了。整個手術室好像只有爸比和姊姊兩個人，爸比的感官對外暫停營業，除了姊姊，爸比什麼也看不到，什麼也聽不見。<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" height=\"359\" alt=\"\" src=\"\" data-lost=\"3/1252191994.jpg\" width=\"500\"/><\/p>\n<p><font size=\"3\">你要聽實話還是謊話？<br/>\n<\/font><font size=\"3\"><br/>\n老實說，爸比對你沒那麼激情，爸比甚至沒有進產房。當時爸比正在收拾行李，準備移往恢復室，這件工作上次是阿嬤負責，但這次我們沒讓阿嬤跟來，因為怕她看到媽咪陣痛的樣子會心疼。<br/>\n<\/font><font size=\"3\"><br/>\n當爸比聽見遠方傳來嬰兒的哭聲時，爸比停下手邊的工作仔細聽了一會兒，嘴角應該有一些微笑吧。媽咪真的是效率專家，現在爸比想進產房也來不及了。媽咪後來告訴爸比，還好待產時聽怕了隔壁的哭喊聲，「我告訴自己，絕對不要像她痛那麼久。」<br/>\n<\/font><font size=\"3\"><br/>\n一會兒，我們終於在恢復室團圓了，你光著身子依偎在媽咪胸前，臉上似乎驚魂未定，紫青的臉色一直漫延到全身。讓爸比看看：額頭的皺紋比爺爺還深，嘴唇比爸比還厚，捲捲的頭髮還沾著媽咪的血，「嗯，好個英俊的…外　星　人。」<br/>\n<\/font><font size=\"3\"><br/>\n在恢復室裡，許多都是第一次：拍第一張照片、吸第一口母奶、蓋第一次腳印，惟獨和媽咪分離是第二次，你就要被送到嬰兒室了。一路上，你在保溫箱裏不哭也不鬧，四肢柔柔地擺動，像被春風吹動的花朵。<br/>\n<\/font><font size=\"3\"><br/>\n通過嬰兒室的兩道門之後，護士將保溫箱打開，把你從頭到尾仔細打量，針對你身上的瑕疵指指點點，「背上有一些紅疹，可能寶寶皮膚太嫩，要把胎脂擦掉時引起的，不用緊張…」爸比的腦海不由自主又浮現了簽署同意書的畫面，我是在交接貨品嗎？<br/>\n<\/font><font size=\"3\"><br/>\n很難說不是，事實上爸比還真的拿到一張收據──探嬰卡。護士熟練地向爸比說明母嬰同室的規定，並介紹各種新生兒篩檢，但爸比沒聽進多少，爸比一直回頭看嬰兒房…<br/>\n<\/font><font size=\"3\"><br/>\n是你嗎？怎麼哭得這麼傷心？我們這一生將經歷多少次分離呢？<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" height=\"321\" alt=\"\" src=\"\" data-lost=\"44/1198284308.jpg\" width=\"450\"/><\/p>\n<\/font><\/font>", "comments": [{"name": "蘭", "date": "2006-03-02 04:17:45", "url": "", "text": "恭喜啟台把鼻:<br />\n每一個新生命的誕生總是令人充滿著喜悅和驚喜!<br />\n看完你的隨筆日記,彷彿感受到為人父的柔軟和堅強.<br />\n寶寶雖然還很小,但從照片上已可看出他英挺俊俏的模樣,<br />\n想必長大後必有不少美眉敗倒在西裝褲下吧!<br />\n<br />\n生命中甜蜜的負荷是這麼地令人甘之如飴,<br />\n在我們這些單身貴族的眼中,<br />\n這真是遙不可及的成就啊!<br />\n<br />\n祝福你的寶貝健康平安<br />\n        全 家 喜 樂 幸 福.<br />", "reply": "", "reply_date": "", "hidden": false, "spam": true}, {"name": "粉紅色的麻糬", "date": "2006-03-02 04:24:32", "url": "", "text": "hi..北鼻..認識你爸爸已經快四年囉...你知道你老爸就是又很感性<br />\n又很理性的人..你老爸可能會邊讓你聽古典音樂又邊講很多數學<br />\n的故事給你聽...相信你會頭好壯壯聰明長大喔！你老爸寫....<br />\n「嗯，好個英俊的…外星人。」麻糬阿姨笑了...其實你老爸也是<br />\n很風趣幽默的人...相信你們會變成很好的partner的！乖乖長大<br />\n喔！", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "吳淑芬", "date": "2006-03-02 04:35:03", "url": "", "text": "啟台：<br />\n<br />\n   您個性多感，文思又如此細膩，可以有計畫的寫作耶。<br />\n   <br />\n   年前，看商週一期報導--「家庭主夫」，我很尊敬文章中的爸<br />\n   爸，我覺得誰賺錢並不重要，互相尊重愉快共處，才是生活美<br />\n   滿的關鍵。當然，但說真的，社會賦予男性太多的傳統價值<br />\n   壓力，放不下，也是不快樂的。<br />\n<br />\n   anyway，最少，您給人的感受總是溫暖的！--祝福您！<br />\n<br />\n                                                          吳淑芬 2006.3.2", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "Vivian", "date": "2006-03-02 04:37:47", "url": "", "text": "給努力當個好把鼻的把鼻,<br />\n<br />\nㄧ個新生命的開始,<br />\n是多麼的美麗 !<br />\n多麼令人期待呀 !!<br />\n<br />\n<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "葉俊克", "date": "2006-03-02 05:18:01", "url": "", "text": "台哥：<br />\n恭喜你了！從初中相識迄今將近1/4個世紀了。西子灣畔的把酒<br />\n夜談，彷彿都還是不久前發生之事，而如今你我二人都已成為<br />\n兩個孩子的爹了。<br />\n有空多聯絡吧！", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "", "date": "2006-03-02 05:45:47", "url": "", "text": "啟台：<br />\n　　你竟然再度當了爸爸了！我覺得我根本是外星人，竟然完<br />\n全不知道......<br />\n<br />\n       收了你二篇文章，每次看完都有一些「感覺」，早知道你的<br />\n文筆很好，但不知道這麼溫馨，有一種耐人咀嚼的「閒話風」<br />\n與「簡單味」。<br />\n　　恭禧你再度當爸爸了，希望這次你可以好好地、用心地當<br />\n爸爸。<br />\n　　　　　　　　　　　　　　　李金徽95.3.2<br />", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "davidsu1225", "date": "2006-03-02 17:27:08", "url": "", "text": "啟台兄：<br />\n              真是高興又有同伴了，雙肩扛著甜蜜的負擔，不過相信<br />\n你會稱職許多，也替baby高興，一出生就獲得這麼多叔叔伯伯<br />\n阿姨的祝福！<br />\n              恭喜再度當老爸，看著他俊秀的臉龐，真遺憾未生女<br />\n兒。有著兼具詩人浪漫情懷與數學家之邏輯理性個性的把鼻，<br />\n相信他會越來越感到驕傲！<br />\n              祝福他逐步成長與茁壯，亦祝福您闔家快樂、順心健<br />\n康！", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "sophia", "date": "2006-03-04 02:59:10", "url": "http://spaces.msn.com/ccysophia/", "text": "嗨～<br />\n<br />\n恭喜！恭喜再度當爸爸了！你的文章寫的好生動喔，我覺得看<br />\n了之後好像身歷其境一樣。<br />\n<br />\n父因子而貴，祝福闔家平安健康快樂！", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "素賢", "date": "2006-03-05 04:45:52", "url": "", "text": "嗨！可愛的白鼻！<br />\n      能當您把鼻的兒子，可真是前世修來的福氣喔！，阿姨仔細<br />\n看著您那俊秀的外星人面貌，未來絕對是少女殺手，您的阿爸<br />\n不是您的對手，您可要睜大眼睛看清楚啊！不能太早淪陷喔。<br />\n      您家的阿爸是文武雙全的才子，您可要狠ㄧ點能挖空智庫盡<br />\n量挖，想起阿爸如同大將軍般把您簽署割地賠款，嚇得您趕快<br />\n爬出來，這股狠招您可要好好學學啊！阿姨祝您快快長大，要<br />\n比阿爸更傑出喔！<br />\n素賢阿姨", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "大仔", "date": "2006-03-06 02:00:39", "url": "", "text": "啟台兄<br />\n妳的描述就像是我也當是把把了<br />\n先恭喜再次為人父的喜事臨門<br />\n再來可要把把你開始努力工作<br />\n細心呵護的將北鼻培養成長<br />\n有機會多聊聊吧<br />\n期待與妳空中對話<br />\n大仔", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "3278136", "title": "信望愛", "date": "2006-01-12 08:16:00", "cat": "2185624", "private": false, "html": "<p><font size=\"3\">歌林多前書第13章被世人引用得很多，即使不是基督徒也常聽到「信望愛」三個字或是「愛的真諦」這首歌：<\/font><\/p>\n<p><font face=\"標楷體\" size=\"3\">愛是恆久忍耐、又有恩慈。愛是不嫉妒。愛是不自誇。不張狂。不作害羞的事。不求自己的益處。不輕易發怒。不計算人的惡。不喜歡不義。只喜歡真理。凡事包容。凡事相信。凡事盼望。凡事忍耐。愛是永不止息。<\/font><\/p>\n<p><font size=\"3\">我一直看不懂這首歌詞，它像一堆口號：要忍耐、要恩慈、不嫉妒...等等，我不反對這些，但我不明白這些跟愛有什麼關係，尤其不懂什麼叫做害羞的事，為什麼愛要排斥害羞的事（難道少女懷春是一種罪惡）。<\/font><\/p>\n<p><font size=\"3\">直到看了聖經的英文翻譯，我才恍然大悟，「信望愛」或「愛的真諦」不是在談 <font face=\"Times New Roman\">love<\/font>，而是談 <font face=\"Times New Roman\">charity<\/font>。<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">Though I speak with the tongues of men and of angels, and have not charity, I am become as sounding brass, or a tinkling cymbal.<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">And though I have the gift of prophecy, and understand all mysteries, and all knowledge; and though I have all faith, so that I could remove mountains, and have not charity, I am nothing.<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">And though I bestow all my goods to feed the poor, and though I give my body to be burned, and have not charity, it profiteth me nothing.<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil;<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">Rejoiceth not in iniquity, but rejoiceth in the truth;<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">Beareth all things, believeth all things, hopeth all things, endureth all things.<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">Charity never faileth: but whether there be prophecies, they shall fail; whether there be tongues, they shall cease; whether there be knowledge, it shall vanish away.<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">For we know in part, and we prophesy in part.<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">But when that which is perfect is come, then that which is in part shall be done away.<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">When I was a child, I spake as a child, I understood as a child, I thought as a child: but when I became a man, I put away childish things.<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">For now we see through a glass, darkly; but then face to face: now I know in part; but then shall I know even as also I am known.<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">And now abideth faith, hope, charity, these three; but the greatest of these is charity.<\/font><\/p>\n<p><font size=\"3\">我對這段經文的看法是：想要找回本來的自己，<font face=\"Times New Roman\">faith, hope, charity<\/font> 是不可能錯過的三條路。<\/font><\/p>\n<p><font size=\"3\"><font face=\"Times New Roman\">faith：<br/>\n<\/font>對某個理念的信仰（雖然無法以邏輯證明該理念正確）；或者，對某個人的信任（雖然無法保證這個人的行為是否如預期發展，其諾言是否會實現）。<\/font><\/p>\n<p><font size=\"3\"><font face=\"Times New Roman\">hope：<br/>\n<\/font>期待某件事情（好的事情）的來臨──也就是夢想或願景吧。<\/font><\/p>\n<p><font size=\"3\"><font face=\"Times New Roman\">charity：<\/font><br/>\n無條件幫助他人。而且，重要的是內在的心意，而非外在的行為──何以見得？<\/font><\/p>\n<p><font face=\"Times New Roman\" size=\"4\">And though I bestow all my goods to feed the poor, and though I give my body to be burned, and have not charity, it profiteth me nothing.<\/font><\/p>\n<p><font size=\"3\">這樣說來，<font face=\"Times New Roman\">charity<\/font> 不正是佛所強調的不著相（人相、我相、眾生相、壽者相）佈施嗎？<\/font><\/p>\n<p><font size=\"3\">總而言之，我對歌林多前書第 13 章的理解是：我們要保持信念、希望與佈施，其中最不能放棄的是佈施。<\/font><\/p>", "comments": []}, {"id": "3421994", "title": "月亮上的男人　Man on the Moon", "date": "2006-01-01 09:01:00", "cat": "3966258", "private": false, "html": "<p style=\"FONT-FAMILY:標楷體;\" align=\"center\"><font color=\"#993300\" size=\"4\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051006.jpg\" width=\"450\" height=\"339\">\n<p style=\"FONT-FAMILY:標楷體;\"><font color=\"#993300\" size=\"4\">故事<\/font>&nbsp;<\/p><\/font>\n<p><font size=\"3\">Andy Kaufman 從小就熱愛歌舞表演，登上 Carnegie Hall 的舞台是他最大的心願。一開始他在 pub 駐唱，他喜歡動物、童年、聖誕老人等溫馨的主題，喜歡和現場觀眾即時互動（例如帶動唱），但成人世界的笑點卻常以尖酸刻簿或幸災樂禍為基礎，一般觀眾則習慣作為旁觀者，並不熱衷成為表演的一部分。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">於是，Andy 被 pub 老闆解雇了，這次挫折讓 Andy 重新修正他的表演方式和主題。後來他以模彷貓王而成名，在經紀人 George Shapiro 的協助之下，進入 ABC 電視台演出喜劇《計程車（Taxi）》，他所主演的外國移民 Latka Gravas，成為家喻戶曉的喜劇人物。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">然而對 Andy 而言，扮演 Latka 卻是一種折磨，一方面 Andy 的理想是歌舞表演，而非戲劇表演，另一方面，他認為「計程車」的劇情陳腔爛調，缺乏創意。於是他透過各種作弄觀眾的機會求取平衡；例如，故意弄亂電視畫面讓觀眾誤以為電視機故障、在舞台上從頭到尾只是朗誦《大亨小傳（The G<br>reat Gatsby）》的全文，甚至化身為流氓歌星 Tony Clifton，言行舉止十分粗俗無禮。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">在媒體報導 Tony Clifton 大鬧 ABC 電視台的時候，人們曾短暫地相信 Tony 是真有其人，但大家隨即曉得 Tony 是 Andy 假扮的。或許因為觀眾太喜愛 Andy，或許因為他們曉得 Tony 只是虛構的，他們竟樂於欣賞 Tony 的粗俗演出，甚至還邀請 Tony 登台作秀。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">當大家逐漸厭倦 Tony 之後，Andy 公開挑釁全國的女性和他比賽摔角，並以「世界男女混合摔角冠軍」自居。Andy 變得和 Tony 一樣粗暴，不一樣的是，大家對 Tony 一笑置之，對 Andy 卻認真起來。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">Andy 不斷升高男性與女性、南方佬與北方佬之間的衝突，並與真正的世界男子摔角冠軍 Jerry Lawler 比賽，結果 Andy 扭傷脖子當場昏迷。後來，他與 Lawler 一起接受電視專訪，雙方原本要和解，但 Andy 卻不斷口出三字經，還對 Lawler 潑咖啡。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">觀眾終於再也無法忍受 Andy，ABC 電視台在進行民調之後將《計程車》停播，Andy 喪失了舞台。不僅如此，他長期參與的靜心社區也不顧 Andy 的解釋，堅持要他離開。過了不久，他通知親友自己罹患肺癌，由於 Andy 從不抽煙，大家懷疑這是不是 Andy 的另一場表演…<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font color=\"#993300\" size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">感想<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">看了《月亮上的男人（Man on the Moon）》這部電影，片名是最初也是最後的疑惑，疑惑出現的時間最早，消散的時間卻最晚。太空人 Neil Armstrong 於 1969 年成為史上第一個在月球漫步的人（Man on the Moon）。Andy Kaufman 既然不曾到過月球，稱他為月亮上的男人自然是一種比喻，其意義何在？<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">電影固然以 Andy 的表演為主軸，卻不時穿插 Andy 從事「靜心（meditation）」的片段，對照他在舞台上的胡鬧，這些靜心的畫面看來有些荒謬。尤其 Andy 剛出道時，有一次請教師父：<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">Is there a secret to being funny？<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">師父回答：<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">Yes, silence!<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">對於不曾接觸過「奧修（Osho）」的人，很可能會認為這個奇裝異服的印度大鬍子只是電影的一個笑話。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">但從 Andy 每次演出「計程車」之前要靜心 90 分鐘，被逐出靜心社區時的緊張神情，甚至最後到東方（菲律賓）治療癌症，Andy 似乎把靜心和表演的重要性等量齊觀。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">這麼一位重視心靈成長，關懷動物的素食主義者，為什麼在舞台上會如此尖酸刻薄、蠻橫無禮，甚至分化人群（男與女、南方佬與北方佬），製造對立呢？這是靜心社區要求 Andy 離開的理由，而 Andy 只為自己作了簡短的辯護：<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">I just think of the world as an illusion, and we shouldn’t take ourselves so seriously.<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">以唱歌跳舞來讚美生命一直是 Andy 的心願，但市場要的是低俗的笑話，他能怎麼辦？他只好以 Tony 的身份唱歌，以摔角選手的身份跳舞；而且，既然讚美缺乏市場，Andy 就改賣髒話。但 Andy 改變的不是目標，而是策略。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">&nbsp;<\/font><font size=\"3\">他不像阿彌陀經從正面下手，肯定極樂世界的價值；而是像金剛經從反面下手，它說這個不對、那個也不對，就是不說哪一個才對。他化身為他反對的形象，也就是說，越多人討厭唱歌的 Tony 和摔角的 Andy，靜心的 Andy 就越高興。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">他吹起一個一個虛幻的泡泡，將舞台從攝影棚、演藝廳不斷往外延伸到家庭、社會，最後佔據整個地球，Andy 彷彿大聲疾呼著：不要相信肉眼，要用心感覺。讓人憐惜的是，這種當頭棒喝的演出就像飛蛾撲火，只有殉道才能成功。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">終於，Andy 在電影的最後兩場表演（一場彷彿在夢裡、另一場則在葬禮），回歸到童年的表演方式，雖然傳遞著相同的訊息，卻因為 Andy 之死而產生截然不同的感動，領悟為何總是來得這麼遲？&nbsp;<\/font>&nbsp;<\/p>\n<div align=\"center\"><div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/roKZ1cN_N50\" allowfullscreen loading=\"lazy\"><\/iframe><\/div><\/div>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"4\">In this friendly, friendly world<br>With each day so full of joy,<br>Why should any heart be lonely?<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"4\">In this friendly, friendly world<br>With each night so full of dreams,<br>Why should any heart be afraid?<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"4\">The world is such a wonderful place to wander through,<br>When you&#39;ve got someone you love to wander along with you.<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"4\">With the sky so full of stars,<br>And the river so full of songs,<br>Every heart should be so thankful,<br>Thankful for this friendly, friendly world.<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">回顧 Andy 的童年，若不是父親的提醒，他還陶醉在自己的理想世界，與眾生不相往來。當他拉起妹妹的手，帶著他一起歌唱，Andy 就從阿羅漢轉入了菩薩道。難怪 Andy Kaufman 被稱為「Man on the Moon」，他就像從月球回望地球的太空人，當他看見當局者迷的芸芸眾生時，他的選擇是伸出雙手，而非獨善其身。<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">如同《駭客任務（The Matrix）》和《楚門的世界（The Truman Show）》這兩部電影，《月亮上的男人》也在追問<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">「什麼才是真的？怎麼曉得人生不是一場夢？」<\/font><\/p>\n<p style=\"FONT-FAMILY:Times New Roman;\"><font size=\"3\">但《駭客》和《楚門》只是簡單的寓言故事，不像《月亮》有著豐富的事實脈絡。我曾想要為《駭客》或《楚門》寫故事簡介和感想，但在看過《月亮》之後，我覺得《駭客》和《楚門》只是《月亮》在哲學面的投影，既然有真實的故事，似乎用不著虛構的寓言了。<\/font><\/p>", "comments": []}, {"id": "3421953", "title": "詩", "date": "2006-01-01 08:45:00", "cat": "3966263", "private": false, "html": "<p><font size=\"3\">讀詩很類似數學解題。一個負責任的詩人不會，或者，至少不應該讓詩像一個脫韁的野馬恣意奔馳，它應該像一個精心設計的密碼，期待有耐性又有緣份的讀者加以解碼。<\/font><\/p>\n<p><font size=\"3\">詩更像數學之處在於抽象，抽象豐富了它的適用範圍。同一首詩，不同的人會因不同的生活體驗而有不同的解讀；同理，即便是同一個人，也可能隨著人生的歷練而有不同的解讀；甚至，這些不同的解讀可能全都不同於作者的原始體會。這種現象也可能出現在音樂，卻很難出現在散文或小說，其中的關鍵就是抽象性。<\/font><\/p>\n<p><font size=\"3\">就像大部分讀詩或聽音樂的人一樣，我也曾問過自己，我的體會真的是作者想表達的嗎？詩作為一個抒發情感的工具，當然要以服務人為目的，而不是要人來屈就它。我們既已活在充滿枷鎖的社會，又何必再拿「作者的原意真的是如此嗎？」來綁住自己。對讀者來說，真正重要的是，這首詩是否像針一樣扎到我？<\/font><\/p>\n<p><font size=\"3\">因此，如果讀者的解讀剛好吻合作者的設計，讀者無需多一點驕傲；如果讀者的解讀完全扭曲了作者的本意，讀者也不需多一點慚愧。讀者是否了解作者一點都不重要，事實上，從一首詩扎了一個人開始，那首詩就被讀者「馴服」了。（喜歡「小王子」的人必然知道我的心裡正想著狐狸。）<\/font><\/p>", "comments": []}, {"id": "11828378", "title": "妳不曉得雞皮不能吃太多嗎？", "date": "2005-08-16 19:23:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835389.jpg\"/>\n<p>姐姐超級無敵（這是她的慣用字）喜歡吃肥滋滋肉肉，尤其是雞皮、豬腳和魚皮。基於健康的考量（雞皮含太多抗生素），我們通常會限制她一次不能吃太多。對於這樣的要求，雖然她似懂非懂倒也挺配合的（只是偶爾會抱怨為什麼都只能吃那麼少）。<br/>\n<br/>\n有一天ㄚ公因做了心導管手術而住院，爸爸和我去醫院探完病回來，她好奇的問我：<br/>\n<br/>\n「<font color=\"#ffcc99\">ㄚ公為什麼要住在醫院不能回來？<\/font>」<br/>\n<br/>\n「<font color=\"#800080\">因為他的心臟開刀所以要在醫院休息，等好一點再回家。<\/font>」<br/>\n<br/>\n「<font color=\"#ffcc99\">ㄡ，ㄚ公怎麼那麼可憐&hellip;&hellip;那ㄚ公為什麼要開刀啊？<\/font>」<br/>\n<br/>\n這時，我想，機會教育來了&hellip;<br/>\n<br/>\n「<font color=\"#800080\">嗯～ㄚ公可能是因為雞皮吃太多，血都塞住沒辦法流過去，所以才要開刀。<\/font>」&nbsp;<br/>\n<br/>\n看她聽得聚精會神，我乾脆一不做二不休&hellip;<br/>\n<br/>\n「<font color=\"#800080\">像妳ㄚ，有時候雞皮吃太多，我就會叫妳不要再吃，就是怕這樣啊。<\/font>」<br/>\n<br/>\n「<font color=\"#ffcc99\">ㄏㄡ，因為我還很小不懂事喔？<\/font>」<br/>\n<br/>\n「<font color=\"#800080\">對啊。<\/font>」<br/>\n<br/>\n「<font color=\"#ffcc99\">所以把拔媽媽說的話小朋友都要聽哦？<\/font>」<br/>\n<br/>\n經過這個事件後，有一天吃飯時，剛好桌上有一盤雞肉，我順手撕了一片雞皮給她，她語帶驚訝的問我：<br/>\n<br/>\n「<font color=\"#ffcc99\">妳不曉得雞皮不能吃太多嗎？難道妳忘記ㄚ公的血都塞住沒辦法流過去了嗎？<\/font>」<br/>\n<br/>\n2005.8.16<\/p>\n<\/font><\/p>", "comments": []}, {"id": "5174590", "title": "如果我哭出來被壞人聽到...", "date": "2005-08-06 09:27:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\">&nbsp;<img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"3/1252191975.jpg\"/>\n<p>還記得那天是國民黨黨主席選舉的日子，也是颱風來臨的前一晚&hellip;&hellip;&hellip;<br/>\n<br/>\n待在家裏一整天，臨傍晚時，因心繫黃石市場裏的花枝羹麵，便央求把拔載我們過去吃<br/>\n<br/>\n「不好吧，颱風不是要來了嗎？」<br/>\n<br/>\n「外面雖然風大可是一點雨也沒有，而且氣象報告不是說明天才會登陸嗎?」只要「想吃什麼」的念頭閃過腦海，說什麼我也會全力以赴<br/>\n<br/>\n把拔看了看外面&hellip;風平浪靜&hellip;「嗯， 好吧！」<br/>\n<br/>\n「YA！」 我跟姐姐互瞄了一眼，真是太棒了<br/>\n<br/>\n一家四口（加肚裏娃娃）就這樣出發了&hellip;&hellip;&hellip;<br/>\n<br/>\n用完餐後，因不甘心就這樣回家，「我們去對面逛逛吧」我提議<br/>\n<br/>\n「好」 姐姐回答得比誰都大聲 (這年紀的她常會說「我不要回家，回家不高興」) 母女倆手牽手，一起走進對面商店，把拔跟在我們的屁股後面<br/>\n<br/>\n店裏正在播放國民黨黨主席選舉的開票實況，出於好奇，我和把拔停了下來，盯著螢幕看，約莫兩分鐘後&hellip;&hellip;<br/>\n<br/>\n「微微ㄌㄟ？」 當我轉身時，沒看到姐姐，我回頭問把拔<br/>\n<br/>\n「可能跑到裡面了吧」把拔向左比了比，我順著他的手勢往裡面走。<br/>\n<br/>\n<font size=\"5\"><strong>沒看到人！<\/strong><\/font><br/>\n<br/>\n我心一驚，馬上沿著樓梯上去，「一定在樓上&hellip;」我自言自語<br/>\n<br/>\n<font size=\"5\"><strong>沒看到人！<\/strong><\/font><br/>\n<br/>\n我急急忙忙的下樓&hellip;&hellip;「裡面，樓上都沒有，怎麼辦？會跑到哪裏去了？」<br/>\n<br/>\n二話不說，我立刻往外走。颱風天，街道上冷冷清清。此時，我的腦袋一片空白，頓失方寸。<br/>\n<br/>\n「別急，我們再找找，一定在附近」把拔比較冷靜<br/>\n<br/>\n問了老闆，問過路人，「有沒有看見一個四歲小孩，穿著 xx 顏色上衣，xx 顏色的褲子剛剛還在這裏？」，「沒有，沒看到」是唯一回答&hellip;<br/>\n<br/>\n「一定是被帶走了，她不會自己跑出去的」姐姐是個乖乖牌，很少有脫軌演出，我的心理愈來愈毛「早知道待在家就好，颱風天還出來幹嘛」我不斷自責<br/>\n<br/>\n「妳先不要慌，站在原地，我去找就好」怎麼可能，我怎麼可能站在原地等？？微微，我心頭的一塊肉， 妳到底在哪裡？？？？？<br/>\n<br/>\n「我們分開找，我找左邊，你找右邊&hellip;」老天爺，求求你不要再跟我開玩笑了，我不斷自言自語「拜託，拜託，沒事沒事」就像個無頭鬼似的我不知道要往哪找，就這樣毫無目標地一遍一遍不停的來回的走<br/>\n<br/>\n把拔回來了，一個人，手是空的，我們的心又往下沈&hellip;<br/>\n<br/>\n<font size=\"5\"><strong>還是沒看到<br/>\n<\/strong><\/font><br/>\n有一攤賣衣服的小姐注意到我們，走過來問「妳們在找小孩嗎？」我聽到高興了一下「妳有看到嗎？」「沒有，小孩多大？」「四歲」我又把穿著打扮描述了一番<br/>\n<br/>\n「妳要不要在這裡等，萬一她走回來又會找不到人」對哦，我怎麼沒想到<br/>\n<br/>\n「妳大著肚子不要再走來走去了，留在這裏等，我去找」把拔比較鎮靜，可是從他的表情，你可以感覺到他也開始害怕了<br/>\n<br/>\n在等待的這段時間裏，我的腦海不斷浮現失蹤兒的畫面&hellip;平常不求神拜佛的我，此時也不斷的唸起「阿彌陀佛&hellip;&hellip;」<br/>\n<br/>\n「微微，媽媽的微微，妳在哪裡？」 一想到她一個人無助的在街上遊走，再想到颱風就要來了，我的心好酸&hellip;<br/>\n<br/>\n遠遠的，我好像看到把拔&hellip;那是把拔嗎？微微，手上抱的是微微？沒錯！<br/>\n<br/>\n<font size=\"5\"><strong>我看到了，我看到了，我看到我的微微了<\/strong><\/font><br/>\n<br/>\n把拔手裏抱著的姐姐，驚魂未定，臉上沒有表情也沒有淚痕&hellip;&hellip;<br/>\n<br/>\n「微微，把拔找到妳了，我好高興&hellip;」 我摟著她，親了又親抱了又抱，感謝老天爺！<br/>\n<br/>\nP.S.&nbsp;<br/>\n事後，我問她當時的狀況，她告訴我，<font color=\"#ff99cc\"><\/font><font color=\"#ffcc99\">「我看不到把拔媽媽，就想說你們可能走出去了，我就跑到我們停車的地方去找，結果都沒看到我們的車子，我以為車子被拖吊了，就想說去找你們啊，後來我走了很久的時候，有一個賣水果的阿姨發現了，她就叫我坐在旁邊的小椅子上看卡通等你們來找我」<br/>\n<\/font><br/>\n<font color=\"#800080\">「那妳為什麼那麼勇敢都沒有哭哭？」<br/>\n<\/font><br/>\n<font color=\"#ffcc99\">「我有忍耐ㄚ，因為如果我哭出來被壞人聽到他就會把我抓走，我以後就會看不到把拔媽媽了呀！」<\/font><br/>\n<br/>\n2005.8.6<br/>\n<font size=\"3\"><br/>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"93/1400835277.jpg\"/><\/p>\n<p>======================================<br/>\n爸比的補充：<br/>\n<br/>\n那個賣場就像迷宮一樣，不能說店面小，實在是貨品太多了，就像一般主題樂園將「排隊廣場」用繩索區隔成彎彎曲曲的路徑，只不過那個賣場用以隔開路徑的不是繩索，而是貨品，貨品差不多堆到爸比的肚子那麼高，當妳繞到貨品的另一邊時，爸比就看不到妳了&hellip;<br/>\n<br/>\n那時妳還不滿 4 歲，躲貓貓的遊戲剛剛才要退燒，爸比以為妳故意躲起來了，樓上樓下來回跑了好幾次，爸比不願相信或不敢承認妳已經不在這個賣場了，一旦離開這個賣場，外頭有如茫茫大海，怎麼可能找得到&hellip;<br/>\n<br/>\n爸比把所有妳可能藏身的地方都找遍了，我聽得出自己叫喚「阿微」的聲音不住顫抖，我想起以前有隻剛出生的貓咪孤伶伶地窩在我們車底下，牠的臍帶還連在肚子上，眼睛還睜不開，只能有氣無力地喵啊喵啊地叫喚母親，爸比現在才知道那種聲音是那麼無助，那麼悲傷&hellip;<br/>\n<br/>\n後來爸比再看到媽咪時，爸比故意裝得很鎮定，因為媽咪的眼淚已經流出來了，臉上盡是絕望和責備的表情&hellip;<br/>\n<br/>\n爸比只好面對你失蹤的事實了，但爸比六神無主，根本不曉得從何找起，眼前是大海啊，怎麼找？<br/>\n<font size=\"3\"><br/>\n於是爸比隨便挑了一條路開始往前走，心裡頭一團混亂，根本不期望能在這條路上看到妳，但爸比並沒絕望多少時間，大概只走了 30 公尺左右，爸比就看見妳了，妳正坐小椅子上看卡通，妳看到爸比時的表情是呆滯的，把妳抱在懷裡時表情還是呆滯的，賣水果的阿姨不曉得會不會懷疑這個爸比是不是真的？<br/>\n<br/>\n甚至於後來妳見到媽咪時，妳還是笑不出來<br/>\n<br/>\n爸比相信媽咪一定很後悔，會什麼我們老是要跟妳開那個玩笑－－每次我們騎摩托車出去的時候，妳總是最後一個上車，擠在爸比和媽咪中間，我們總愛跟妳開個小玩笑，故意跟妳揮手說再見，摩托車蠢蠢欲動，一副要拋棄妳的樣子，然後妳就會發出嗯嗯啊啊的哀求聲，抓住媽咪的手，要我們等妳<br/>\n<br/>\n有過這種幾乎失去妳的經驗之後，爸比和媽咪一點也不覺得這種玩笑有什麼好笑了<br/>\n<br/>\np.s.<br/>\n之後，爸比每次看見協尋失蹤兒童的消息，總會想起那個沒有風雨的颱風前夕，想起<a href=\"#/album/38\" target=\"_blank\">黃品源的白鷺鷥&hellip;<br/>\n<\/a><br/>\n<\/font><font face=\"標楷體\" size=\"4\">我好像那隻失去愛情的白鷺鷥<br/>\n後悔沒說出那句話<br/>\n一直惦茫霧中飛過來飛過去<br/>\n這嘛沒伊<br/>\n蝦嘛沒伊<br/>\n唔知伊甘有和我有同款的滋味<\/font><\/p>\n<\/font><\/p>\n<\/font><\/p>", "comments": [{"name": "玉山", "date": "2006-08-06 07:18:43", "url": "", "text": "此篇文章，的確值得完整追溯並保存下來．．．<br />\n畢竟，文中所描述之自責．悔恨．恐懼經歷，沒人會願意再來<br />\n一次！父母椎心．瘋狂的心路歷程，更是任誰都難以招架！<br />\n（何況，當時是有孕在身，極度的．．．身心俱疲的孕婦啊）<br />\n<br />\n此情此景，我在昨晚的夢境也經歷了一回（故，今日看來，感<br />\n受又特別深刻）僅僅是虛夢一場，過程卻猶如真實一般．．．<br />\n<br />\n醒來之後，只想”謝天謝地，一切，只是一場夢”！<br />\n深深覺得，現狀真令人滿足啊．．．", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "3778747", "title": "Come in", "date": "2005-04-08 07:42:00", "cat": "2185624", "private": false, "html": "<p align=\"center\"><font size=\"4\" face=\"Times New Roman\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051113.jpg\">\n<p align=\"left\">One ancient hermit said to his disciples:<br><br>&nbsp;&quot;Strive to enter the inner cell of your soul and there you will behold the heavenly cell. Both are one: you enter them by the same door. The staircase to Heaven is inside you: it exists seceretly in your heart.&quot;<br><br>And it is true:<br><br>Our whole life is but an attempt to find this miraculous entrance.<br>All our deeds are but a timid knocking on this mysterious door.<br>All our hopes are to hear, one day, perhaps, a voice that would respond:<br><br>&quot;Come in!&quot;<br><br>For it is said:&nbsp;<br><br>&quot;Knock and you will be let in.&quot;<br><br>-Vladimir Martynov<br>Tranlated from Russian by Elisabeth Konovalova<br><br>ps.<br><br><a href=\"#/album/42\" target=\"_blank\">Come in<\/a> 是從台北愛樂聽到的，之後我打電話給愛樂電台（生平第一次 call in），問到了曲名（Come in）<span style=\"FONT-FAMILY:新細明體;FONT-SIZE:12pt;\">、<\/span>作曲家（Vladimir Martynov）與演奏者（Gidon Kremer），接著跑了好幾家唱片行，再等了好幾個禮拜，Come in 終於飄洋過海，回到了它的家...我的心...<\/p><\/font>", "comments": []}, {"id": "3421980", "title": "哭與笑", "date": "2005-03-01 08:58:00", "cat": "2354773", "private": false, "html": "<p align=\"center\"><font face=\"標楷體\" size=\"4\"><img loading=\"lazy\" src=\"\" data-lost=\"93/1400835375.jpg\" alt=\"\"/>\n<p align=\"left\">不看你的容貌<br/>\n看你的心情<br/>\n我緊蹙的眉頭最怕看見你<br/>\n毫不保留的笑<\/p>\n<\/font><\/p>\n<p><font face=\"標楷體\" size=\"4\">不問你的心情<br/>\n問你的容貌<br/>\n我張開的雙手最愛碰到你<br/>\n撒嬌的哭鬧<\/font><\/p>\n<p>2003.10.23 板橋<\/p>\n<p align=\"left\"><font size=\"3\">ps.<br/>\n有一次下班回岳母家，還沒進門，就聽見老婆和剛滿兩歲的女兒演著第 n 場的「不要哭了」，阿公阿媽阿姨舅舅在一旁憋著笑。<br/>\n<br/>\n我一邊換上拖鞋，一邊和女兒四目交接，看著她委屈的眼神，以及哭泣前夕微微顫抖的鼻子和嘴唇，明知道沒什麼大不了，我還是假裝很捨不得，把她抱起來問「誰欺負我們啦？」，就聽見女兒在耳邊嚎啕大哭，以及阿媽在一旁直嚷著「你看看，有夠撒嬌！」。<br/>\n<br/>\n我輕拍女兒的背，嘴裡哄著「阿爸嘸甘阿爸嘸甘阿爸嘸甘&hellip;&hellip;」，原來，小孩連哭聲都會讓人感到幸福。<\/font><\/p>", "comments": []}], "albums": [{"id": "166", "name": "2010.03.27 台北", "desc": "", "cat": "12", "order": 0, "count": 34, "updated": "2010-03-29 05:41:25", "locked": true, "hidden": false, "cover": "img/166/thumbs/t1096493715.jpg", "photos": [], "media": []}, {"id": "165", "name": "2010.03.07 準園", "desc": "", "cat": "12", "order": 1, "count": 110, "updated": "2010-03-29 05:33:50", "locked": true, "hidden": false, "cover": "img/165/thumbs/t1624182557.jpg", "photos": [], "media": []}, {"id": "164", "name": "2010.02.15 娘家", "desc": "", "cat": "12", "order": 2, "count": 128, "updated": "2010-03-29 05:33:50", "locked": true, "hidden": false, "cover": "img/164/thumbs/t1198580339.jpg", "photos": [], "media": []}, {"id": "163", "name": "2010.02.14 過年", "desc": "", "cat": "12", "order": 3, "count": 87, "updated": "2010-03-29 05:33:50", "locked": true, "hidden": false, "cover": "img/163/thumbs/t1990758957.jpg", "photos": [], "media": []}, {"id": "162", "name": "2010.01.02 home", "desc": "", "cat": "12", "order": 4, "count": 34, "updated": "2010-03-29 05:33:50", "locked": true, "hidden": false, "cover": "img/162/thumbs/t1293058146.jpg", "photos": [], "media": []}, {"id": "161", "name": "2009.12.13 中正紀念堂", "desc": "", "cat": "9", "order": 5, "count": 67, "updated": "2010-03-29 05:33:50", "locked": true, "hidden": false, "cover": "img/161/thumbs/t1542364814.jpg", "photos": [], "media": []}, {"id": "160", "name": "女兒的日記2009", "desc": "", "cat": "4", "order": 6, "count": 12, "updated": "2010-03-29 05:33:50", "locked": true, "hidden": false, "cover": "", "photos": [], "media": []}, {"id": "159", "name": "2009.11.28 草嶺古道", "desc": "", "cat": "9", "order": 7, "count": 69, "updated": "2010-03-29 05:33:50", "locked": true, "hidden": false, "cover": "img/159/thumbs/
