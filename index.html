<script id="data" type="application/json">{"info": {"id": "bruceverse", "name": "忘言居", "desc": "天地有大美而不言", "nickname": "行呀行", "visitors": "33279", "full": false, "intro": "天地有大美而不言，但我是如此藐小。藐小的我期盼保存美的經驗，希望有朝一日能夠像翻閱相簿一樣，重新體會心頭一熱的感覺。也期盼藉由文字傳遞美的經驗，尋找共鳴。", "topic": "Family", "friends": ["hhhouse", "samvsjean", "youngeel"]}, "cats": {"11846491": {"name": "微微的日記", "order": 1}, "9658339": {"name": "媽咪的心肝", "order": 2}, "2354773": {"name": "爸比的寶貝", "order": 3}, "3966263": {"name": "books", "order": 9}, "3966258": {"name": "art", "order": 10}, "3966439": {"name": "people", "order": 13}, "2185624": {"name": "belief", "order": 20}}, "posts": [{"id": "13994647", "title": "幸福週報  顧健康  大自然療法值得一試", "date": "2013-05-17 22:33:00", "cat": "11846491", "private": false, "html": "<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">現在的孩子都被寵慣了，禁不起一點打擊，往往一點小小的病痛就能讓全家好像世界末日來臨般的大呼小叫。為什麼現代的孩子什麼考驗也承受不住呢？<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">透過記者朱靜微努力的訪問及調查，本報終於發現了原因。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">根據討論結果，我們認為現代小孩承受不住病痛的原因就於他們‘太嬌生慣養了’了。現在的家庭，只要小寶貝一生病，哪怕只是輕微的感冒、流鼻水，父母都搶著要帶小孩去看醫生，好像巴不得孩子天天都生病似的。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">有沒有解決的方法呢？<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">當然有！只要常常帶小孩到戶外去活動活動，和大自然親密接觸，所有的疾病都會消除。這是記者朱靜微親身經歷的有效經驗。假日要帶您的孩子出去玩玩其實並不難，正所謂‘天下無難事，只怕有心人’，只要下定決心，再困難的事情都可以辦得到。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">為了你家的心肝寶貝，請做出明智的選擇吧！如果您有任何的疑問，都歡迎打電話到本報查詢。<span>1234-1234<\/span>洽朱小姐<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">101.11.28<\/span><span style=\"font-size:20.0pt;font-family:標楷體;\">出刊<\/span><span style=\"font-size:20.0pt;font-family:標楷體;\"><\/span><\/p>", "comments": []}, {"id": "13994643", "title": "幸福週報  偏心父母影響大", "date": "2013-05-17 22:18:00", "cat": "11846491", "private": false, "html": "<p class=\"MsoNormal\"><span style=\"font-family:標楷體;font-size:20pt;line-height:1.22;\">最近，經常發生家裡的小孩相處不融洽的事情，導致家庭經常出現火爆場面，往往是弄得大家都不開心，不說話。<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20pt;font-family:標楷體;\">為了解決這個問題，本報特派出記者朱靜微來調查訪問這件事情。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20pt;font-family:標楷體;\">透過了各種管道，朱靜微發現原來小孩之間不融洽的原因就在於孩子認為爸媽‘偏心’。雖然絕大多數的父母都自稱自己‘絕對公平，毫不袒護’，但很顯然，這些話只是哄騙小孩子用的罷了。專門針對小孩幸福問題的幸福日報對此感到非常不滿，嚴重要求偏心的父母盡快改正，才能和孩子打成一片，讓孩子對你敞開心門。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20pt;font-family:標楷體;\">許多父母抱怨‘我的孩子愛計較’，請這些父母先想一想，孩子為什麼喜歡抱怨？是不是受到了自己影響？這些問題十分值得去思考、討論。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20pt;font-family:標楷體;\">←<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20pt;font-family:標楷體;\">許多孩子渴望擁有一個幸福的家庭。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20pt;font-family:標楷體;\">101.11.14<\/span><span style=\"font-size:20pt;font-family:標楷體;\">出刊<\/span><span style=\"font-size:20.0pt;\nfont-family:標楷體;\"><\/span><\/p>", "comments": []}, {"id": "13994642", "title": "幸福週報  悲慘父母的責任", "date": "2013-05-17 22:15:00", "cat": "11846491", "private": false, "html": "<p class=\"MsoNormal\"><span style=\"font-family:標楷體;font-size:20pt;line-height:1.22;\">最近的家庭，總是把孩子往安親班、補習班送，父母一心只想節省自己的時間，卻忽略了孩子的心裡感受。為什麼絕大多數的小朋友都討厭上安親班或補習班呢？爸爸媽媽們有沒有想過這個問題？<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">現在，即使媽媽不用上班，留在家裡當個全職媽媽，卻仍然把孩子送往補習班。自己明明就有時間陪伴小孩，為什麼還要強迫小孩到他不喜歡的地方去呢？這樣子固然可以節省自己的時間，但是您將會無法瞭解孩子的內心世界。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">如果爸爸媽媽願意多花一點時間在您的寶貝身<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">上，孩子就會坦承的向你說出他的內心世界。為何小寶貝不喜歡上補習班呢？因為補習班總是一直寫功課，寫完功課就做評量，永遠沒有結束的一天。年紀小小的孩子們，每天這樣關在一個密閉空間，不停的寫寫寫，這是正常孩子該做的事嗎？<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">&nbsp;<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">爸爸媽媽，請試著回想您們的童年，就知道為什麼了。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:20.0pt;font-family:標楷體;\">101<\/span><span style=\"font-size:20.0pt;font-family:標楷體;\">年<span>11<\/span>月<span>20<\/span>日出刊<span><\/span><\/span><\/p>", "comments": []}, {"id": "13994641", "title": "樂隊比賽", "date": "2013-05-17 22:08:00", "cat": "11846491", "private": false, "html": "<p class=\"MsoNormal\"><span style=\"font-size:16.0pt;font-family:KaiTi;\">&nbsp; &nbsp;&nbsp;<\/span><span style=\"font-size:16.0pt;\nfont-family:KaiTi;\">今天我們樂隊要去比賽全國音樂大賽了哦！我雖然不能上台比賽，但是我可是工作人員，我要跟著黎君老師一起去比賽的現場，去幫忙搬樂器啦、拿手風琴之類的。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:16.0pt;font-family:KaiTi;\">&nbsp;&nbsp;&nbsp; <\/span><span style=\"font-size:16.0pt;\nfont-family:KaiTi;\">一大早，我氣喘吁吁的衝進教室，呼！又要遲到了。我匆忙的交完功課，我今天只帶了一個袋子和口風琴，沒有帶書包。我才剛來而已，就馬上跟同學們「ㄙㄟ鼓敗」，有很多同學都覺得奇怪，我要去哪裡？可是只有其他樂隊的人知道。抵達春暉館之後，我看到大家都打扮得漂漂亮亮，穿得好正式哦！我也有點想穿團服耶<span>......<\/span>接下來，黎君老師就像往常一樣的開始練習比賽團，我有很認真的聽哦！比賽團練了很久，然後就有班級準備進來春暉館看我們表演囉！如果其他人提供的消息屬實，今天可愛的蕭聰宇會來看表演耶！哎呦，人家好害羞呦！果然，蕭聰宇他們班真的來了。我小鹿亂撞了一會兒，就開始很認真的看表演。真好看！表演完後，不能再拖延時間了，我們開始猛搬樂器，不一會兒工夫就搬完了全部的樂器。我們下樓去吃午餐，這是我第一次在樂隊吃飯。午餐是炒飯，好香好好吃！我們全都吃得津津有味。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:16.0pt;font-family:KaiTi;\">&nbsp;&nbsp;&nbsp; <\/span><span style=\"font-size:16.0pt;\nfont-family:KaiTi;\">吃完了午餐，我們就坐上遊覽車，要去新竹體育館比賽。我坐在車上心裡七上八下的，雖然不是我表演，可是好緊張哦！車子開動以後，忽然響起了一陣非常熟悉的美妙音樂。仔細一聽，不就是我們苦練多時的「<span>Do Ra Mi<\/span>之歌」嗎？我們都很放鬆了，我乾脆還閉上眼睛好好的睡了一覺。醒來時，我們已經抵達新竹了，我們懷著忐忑不安的心情走下車，哎呀！好冷的風啊！那個風真是刺骨，直接吹進心坎裡。我們全都縮成一團坐在椅子上等待老師。黎君老師對我們說：「我希望你們把這次比賽當成另外一場表演，不要當成是比賽，不要有太大的壓力。」我們工作人員目送著比賽團員去檢錄，我心裡真是安心多了。我們在外頭等待了許久，才終於輪到我們進去準備區。我一進去，看到滿滿都是穿著「桃小兒樂」背心的工作人員，我知道桃小兒樂也是來參加比賽的隊伍，我當時就覺得這是一個勁敵，我的競爭意識非常強烈！終於輪到我們進場了！我吞了吞口水，緊張兮兮的走進現場。哇啊！好大、好大啊！我看到那個現場，起碼也有<span>495<\/span>立方公尺那麼大！不過人很少就是了。排在我們前面的新人國小，他們的樂器才剛剛撤走，我們的工作人員馬上像發瘋似的飛奔出去，短短幾秒鐘就把所有樂器就定位。我們的團員便馬上整齊的走到位置上，我心裡真是暗自稱讚「幹得好！」接著黎君老師也走了進來，我們這些候補人員便退到旁邊的椅子，準備觀賞好戲。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:16.0pt;font-family:KaiTi;\">&nbsp;&nbsp;&nbsp; <\/span><span style=\"font-size:16.0pt;\nfont-family:KaiTi;\">黎君老師先向大家敬了個禮，然後站上指揮台。我們全都屏息看著蹲在地上的許惟筑，她就開始演奏<span>Do Ra Mi<\/span>之歌的前奏。而當那個被稱之為「滿場亂跑的老鼠」的氣球吱吱叫著飛上天空時，我們全都強忍住笑意，安靜的看著。老師的手用力擺動，音樂就順著她的手勢滑了出來。這一段音樂我不知道聽過多少遍了，但是這次聽起來卻覺得特別意義重大。我的眉頭緊緊皺了起來，好恐怖啊！我們會不會演奏錯誤的音呢？好險，整首演奏完了也沒有出錯。大家開始變換位置，準備要進行美猴王組曲中的神猴大戰。時間滴答滴答的計時著，黎君老師的手用力一下！砰！我被那一聲震得差點掉下椅子，好驚人的一聲啊！然後所有人的表情都認真到了極點，好像要把黎君老師吃了似的拚命盯著她！當孫悟空終於被二郎神幹掉時，我覺得那彷彿是大大的鬆了一口氣，壓在心上的一塊大石頭終於放了下來。接著，孫悟空便開始誠心誠意的懺悔，我也更加緊張。朱婕寧吹的那一句真是美妙至極，我緊蹙的眉頭也慢慢舒展了。啊！真是讓人舒服的音樂啊。我安心得不得了。當敦煌壁畫出現時，我又有一種置身奇妙國度的感覺。那感覺好像<span>......<\/span>在一個雲端國度，從四方飄來悠悠的樂聲，環繞在自己身旁。在最後一句結束時，我似乎就要睡著了。然而，咚咚咚咚！棒挑火燄山的鼓聲猛然響起，把我從雲端遨遊的夢境硬生生拉了回來。我馬上聚精會神的看著孫悟空對戰牛魔王軍隊的大戰。堂鼓創造出一大堆的猴子軍隊，其他打擊樂器也先後加入。最後，口風琴也開始和手風琴大戰了！戰完，曾郁婷要嗦囉了！她吹得真棒，毫不含糊。嗦囉了兩次，手風琴加入，造成了多層次的感覺。然後，那隻令人好笑的豬，「噗<span>----<\/span>」盡情的叫了一聲，然後開始走路。那笨拙的走路方式、搖搖晃晃的姿態，讓我們都感到好笑。馬林巴也在演奏豬，這隻豬成為了萬眾矚目的焦點。當鑼的那一聲猛然響起，細緻而緊湊的樂聲隨即衝出！牛魔王出現了！黎君老師開始指揮軍隊逃命，大家驚慌失措，腳步聲又急又大。那隻狀況外的豬在急促的聲音中努力的想要說話，但大家只聽到「苟<span>----<\/span>」的聲音。所有的聲音在黎君老師的指揮之下嘎然停止，豬八戒便趁此機會開始發言、走路，整首樂曲在輕輕的一聲和弦中結束。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:16.0pt;font-family:KaiTi;\">&nbsp;&nbsp;&nbsp; <\/span><span style=\"font-size:16.0pt;\nfont-family:KaiTi;\">黎君老師轉身優雅的鞠了個躬，我們迅速的退場、撤樂器，僅僅花了<span>21<\/span>秒！<span>(<\/span>厲害吧？<span>)<\/span>善後完畢後，我們先到車上放東西，便又趕回體育館。我們要去觀摩其他學校的樂曲！我們才剛到樓梯間，就隱約聽見樂聲。我覺得這個國小表演得很好耶！我們所看見的隊伍是士林國小，他們的演奏真是出眾，我很少見過。他們用全身來演奏，口風琴雖然是坐在椅子上，但是全身卻不停的動來動去，而手風琴因為站著，活動空間更大，所以身體擺動得更誇張。我們看著，都不免驚訝。而當士林國小演奏自選曲時，我們全都差點大聲喊叫出來，不約而同的看向黎君老師。原來，他們的自選曲是我們曾經演奏過的「多瑙河的漣漪」！哎呀，當我聽見第一聲時，心裡的震撼可真不小。有一種特殊的感覺。當他們演奏時，我在心裡輕輕唱著旋律。士林國小演奏完後，我們報以熱烈的掌聲。很快的，成績出爐<span>......<\/span>我們會是什麼成績呢？呃呃！我緊張的手心冒出了冷汗。「優等隊伍，士林國小、永安國小、崇德國小、新人國小<span>......<\/span>」一個一個公布優等隊伍，卻沒有我們莒光的名字。但是大家卻歡呼起來？我覺得很奇怪，便問許庭瑄怎麼回事？她說：「因為如果我們沒有優等，就表示我們是特優了！」特優我也知道，莒光樂隊向來都是拿特優的。果然，「特優第二名，莒光國小！特優第一名，桃園國小！」正在歡呼，慢著！桃園國小？不就是桃小嗎？可惡！難怪我會看桃小兒樂那麼不順眼！膽敢搶走我們特優第一名的位置<span>......<\/span>要你好看！<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:16.0pt;font-family:KaiTi;\">&nbsp;&nbsp;&nbsp; <\/span><span style=\"font-size:16.0pt;\nfont-family:KaiTi;\">回學校的途中真是無聊，才剛上車我就打起呵欠。乾脆睡覺算了！我閉上眼睛沉沉睡去。醒來時，已經到莒光了。我們領了好吃的餐盒，搬了一些樂器之後，就各自回家了。我們去吃了元氣家族麵食館，我卻特別沒有胃口。呵啊<span>~~<\/span>今天回家好好睡一覺吧。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:16.0pt;font-family:KaiTi;\">101.03.14<\/span><\/p>", "comments": []}, {"id": "13994640", "title": "小妹和蜂蜜蛋糕", "date": "2013-05-17 22:06:00", "cat": "11846491", "private": false, "html": "<p class=\"MsoNormal\"><span style=\"font-family:標楷體;\"><span style=\"font-size:18pt;\">今天啊，我和肥媽一起做蜂蜜蛋糕。肥光和肥爸出去了，跟「ㄏㄜˊㄕㄨˋㄏㄨㄚˊ」打桌球。我才不想打咧，我和肥媽做蛋糕。<\/span><\/span><span style=\"font-family:標楷體;font-size:18pt;\">我先過篩麵粉跟糖，好好玩哦！那個糖啊，我放在濾網上，輕輕一甩，哈！糖都過網了！要過兩次，我只花了不到一分鐘的時間。接下來換麵粉，我發現一次過全部的麵粉很不好玩，而且還滿累的，所以我就發明了另一種過篩的方法。<\/span><span style=\"font-family:標楷體;font-size:18pt;\">我把麵粉分批倒到濾網上，然後一批過完再換另一批。這樣就簡單又快多了，我很快就過完了麵粉。接下來我們就要打蛋白霜跟蛋黃糊，之前超累的，純手工打造。蛋白霜要發泡，所以鴨子知道後，就把他們家一組攪拌棒啦、打蛋器啦之類一大堆的東西全部送我們。好棒哦！這樣就不用累得半死打蛋白了。那機器的威力好大，蛋白都往外噴了！我做的累死了，這時候小妹來了！小妹小妹，她長得好肥好大隻哦！小妹也要吃我們做的蜂蜜蛋糕。可是肥光的同學居然要來，這樣蛋糕就只能吃一點點了！我給小妹拍了一大堆的照，準備要放到電腦當桌面。而且乾媽好厲害哦，她居然已經玩「糖果」<\/span><span style=\"font-family:標楷體;font-size:18pt;\">(<\/span><span style=\"font-family:標楷體;font-size:18pt;\">一個遊戲<span>)<\/span>玩到<span>167<\/span>關了！那關真的很欠揍，巧克力都一直跑出來！把空間都占滿了，看得我全身都起雞皮疙瘩了！我很開心，明天雖然是星期一，但是莒光放假。因為昨天<span>(<\/span>星期六<span>)<\/span>校慶，所以補假。這樣算是賺到了，因為校慶只有半天，等於多放了半天的假。真希望今天小妹可以住我們家，她講話的聲音真是太可愛了！而且她已經會爬了，爬的滿快的耶！今天我和乾媽給她抓週，她抓了我的青龍寶刀跟肥光的火車笛子。再加上她很愛雅米<span>(<\/span>我的某一個玩偶<span>)<\/span>，由此可看出，她將來一定會成為一個「武藝出眾的兒歌音樂家」！對了，小妹叫做劉恩伶。<\/span><\/p><br><span>&nbsp;<\/span><p class=\"MsoNormal\"><span style=\"font-family:標楷體;font-size:18pt;\"><br><\/span><\/p><br><span>&nbsp;<\/span><p class=\"MsoNormal\"><span style=\"font-family:標楷體;font-size:18pt;\"><br><\/span><\/p><br><span>&nbsp;<\/span><p class=\"MsoNormal\"><span style=\"font-family:標楷體;\"><span style=\"font-size:18pt;\"><br><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:18pt;font-family:標楷體;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <\/span><span style=\"font-size:18pt;\"><span style=\"font-family:標楷體;\">五年級<\/span><span><span style=\"font-family:標楷體;\">102/04/28<\/span><span><\/span><\/span><\/span><\/p>", "comments": []}, {"id": "13994606", "title": "酒桶山之旅", "date": "2013-05-17 17:41:00", "cat": "11846491", "private": false, "html": "<p class=\"MsoNormal\"><span style=\"font-size:14.0pt;font-family:標楷體;\">&nbsp; &nbsp;&nbsp;<\/span><span style=\"font-size:14.0pt;\nfont-family:標楷體;\">今天，我們全家人和住在台中的親戚一起去酒桶山玩。那裡有一大片的草地，還有餐廳可以吃飯，非常方便。到那裡之後，所有的小孩馬上就被草地吸引過去了，爭先恐後的向草地飛奔過去。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:14.0pt;font-family:標楷體;\">&nbsp;&nbsp;&nbsp; <\/span><span style=\"font-size:14.0pt;\nfont-family:標楷體;\">到了草地上，表弟拿出一顆足球，於是我就把爸爸也拉過來加入比賽。我們四個小孩一隊，爸爸自己一隊。不過他的勢力還真是不能小看，我們幾個人都沒辦法踢進他的球門呢！中場休息後，激烈的比賽再度展開。表弟擋在爸爸的面前不讓他踢球，我和弟弟趁機跑過去把球拐走。然後我使出猛力的一踢<span>--<\/span>砰！球直衝向球門，眼看就要進了！可是爸爸居然輕易的就擋下了這一致命的球，我們氣的搥胸頓足、懊惱不已。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:14.0pt;font-family:標楷體;\">&nbsp;&nbsp;&nbsp; <\/span><span style=\"font-size:14.0pt;\nfont-family:標楷體;\">踢了一個上午的球，我和弟妹們都餓壞了。於是我們三步併作兩步，飛快的跑到餐桌。哇！海鮮麵看起來真是好吃、好吃、真好吃！我只看了一眼就忍不住垂涎三尺。開動了！我一口接一口，完全停不下來。一口氣吃光了海鮮麵，我和弟弟忽然非常想要吹泡泡。我們跑去向媽媽哀求，終於買到了一罐泡泡水。弟弟一吹，漫天飛舞的泡泡閃爍著金屬的光澤，輕輕一吹就有好幾十個！表弟、表妹都躍躍欲試，於是我們便開始大吹特吹。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:14.0pt;font-family:標楷體;\">&nbsp;&nbsp;&nbsp; <\/span><span style=\"font-size:14.0pt;\nfont-family:標楷體;\">看看天色也暗了，我們準備回家。經過一棵樹下時，媽媽忽然發現這是一棵木棉樹，而且更棒的是，樹上還有好多軟軟的棉花呢！我們便開始慫恿爸爸幫我們把棉花打下來，於是爸爸就抓起掉在地上的果實，滿天亂打！一下子，彷彿下了一場棉花雨，我們全都一擁而上，搶著收集落下來的棉花。這些棉花白白軟軟的，雖然不像市面上賣的那麼乾淨，可是還真是超保暖的呢！<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:14.0pt;font-family:標楷體;\">&nbsp;&nbsp;&nbsp; <\/span><span style=\"font-size:14.0pt;\nfont-family:標楷體;\">終於要回家了，真希望下次還有機會能到酒桶山玩，也要撿更多的棉花。<span><\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:14.0pt;font-family:標楷體;\">102/2/10<\/span><\/p>", "comments": []}, {"id": "13931988", "title": "可以用自己的錢買嗎", "date": "2013-04-10 16:44:00", "cat": "9658339", "private": false, "html": "<br><span style=\"font-size:16px;\">昨晚, 看著凌亂的書房<\/span><br><span style=\"font-size:16px;\">我告訴姐弟倆;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">&quot; 如果發現有東西找不到,就是被我丟了,<\/span><br><span style=\"font-size:16px;\">只要是沒收好的東西被丟掉, 我就不會再花錢買, 而且也不能用點數換&quot;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">朱喵就問:&quot;那可以用自己的錢買嗎 &quot;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">我說; 可以<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">朱光馬上就說: 那我就可以用點數換錢, 然後再用自己的錢再去買囉.....<\/span><span style=\"font-size:16px;\"><br><span>2012.3.7<\/span><\/span>", "comments": []}, {"id": "13931977", "title": "燭光晚餐", "date": "2013-04-10 16:40:00", "cat": "9658339", "private": false, "html": "<span style=\"font-size:16px;\"><br>阿光今天學校辦兩天一夜夏令營<br>早上去苗栗玩, 晚上睡學校然後有燭光晚餐<br><br>之前報名的時候他說要過夜不敢,所以就沒登記<br><br>昨天下課後,打電話來公司說<br>因為明天學校沒人, 所以停課一天<br>但我只有休下午而且阿媽要去醫院送飯給小阿姨吃,<br>於是就跟他商量,明天還是去戶外教學<br>等我接了姐姐回來, 再去接他<br><br>&quot;可是...我也想吃燭光晚餐....&quot;<br><br>&quot;好啊...吃完我們再去接你...&quot;<br><br>&quot;阿~~我也想過夜....&quot;<br><br>&quot;可是.....我們星期六一早就要出去玩....學校老師有那麼早起嗎?? 而且...你不是會怕?&quot;<br><br>&quot;如果我連一天過夜都不敢.......那我以後那麼多天的夏令營就更別想參加了啦....&quot;<br>就這樣...他如願的, 也跟同學一起參加學校過夜的夏令營了<br><\/span><br><span>&nbsp;<\/span>2012.7.6", "comments": []}, {"id": "13854390", "title": "Do not stand at my grave and weep", "date": "2013-03-22 11:28:00", "cat": "0", "private": false, "html": "<br>Do not stand at my grave and weep,<br>I am not there; I do not sleep.<br>I am a thousand winds that blow,<br>I am the diamond glints on snow,<br>I am the sun on ripened grain,<br>I am the gentle autumn rain.<br>When you awaken in the morning’s hush<br>I am the swift uplifting rush<br>Of quiet birds in circling flight.<br>I am the soft starlight at night.<br>Do not stand at my grave and cry,<br>I am not there; I did not die.<br><br><br>http://en.wikipedia.org/wiki/Do_Not_Stand_at_My_Grave_and_Weep", "comments": []}, {"id": "13398491", "title": "有一個人的媽媽超殘忍的", "date": "2012-11-21 15:30:00", "cat": "9658339", "private": false, "html": "<br><span style=\"font-size:16px;\">十一個月開始, 我每天幫光光準備便當<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">下班到家後, 我總會問, &quot;今天的便當好吃嗎?&quot;<\/span><br><span style=\"font-size:16px;\">每天的回答千篇一律, 都是好好吃<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">我完全不知他是說真的, 還是有倒掉 (便當盒都是空的)<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">有一天, 我問, 班上有幾個人是媽媽幫忙準備午餐的<\/span><br><span style=\"font-size:16px;\">他回說一共 3 個<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">然後就接著說: &quot;有一個人的媽媽超殘忍的, 每天給xxx 帶麥當勞&quot;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">因為他知道吃麥當勞對身體不好, 也知道說殘忍會深得我心<\/span><br><span style=\"font-size:16px;\">就違背良心說出這樣的話...<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">類似的事件, 不勝枚舉<\/span>", "comments": []}, {"id": "13398113", "title": "蠍子也可能上課都不知道老師在講什麼了", "date": "2012-11-21 13:52:00", "cat": "9658339", "private": false, "html": "<span style=\"font-size:16px;\"><br>昨晚幫螢火蟲洗澡時, 他告訴我爬樹的事<br><br>&nbsp;我問他, &quot;樹那麼高,你怎麼爬得上去?&quot;<br><br>&nbsp;他回:&quot;是蠍子推我的屁股, 讓我爬上去的&quot;<br><br>&nbsp;我:&quot; 蠍子對你這麼好啊...&quot;<br><br>&nbsp;他; &quot;對啊...&quot;<br><br>&nbsp;我; &quot;他對其他小蟻也這麼好嗎? &quot;<br><br>&nbsp;他:&quot;應該是只有對我這麼好...&quot;<br><br>&nbsp;我: &quot; 那他明年離團,你一定很捨不得.... &quot;<br><br>&nbsp;他;&quot; 那是一定的啊...他如果離團, 我恐怕不知道要怎麼辦了...我恐怕不知道要玩什麼了....<br>&nbsp;蠍子也可能上課都不知道老師在講什麼了...&quot;<br><br>&nbsp;我:&quot;為什麼?&quot;<br><br>&nbsp;他:&quot; 因為他上課的時候有可能都在想我....&quot;<\/span>", "comments": []}, {"id": "13208007", "title": "果然是長輩", "date": "2012-06-25 17:06:00", "cat": "9658339", "private": false, "html": "<br><span style=\"font-size:16px;\">舅舅開著家裏的休旅車, 載著一家人往和平島海灘出發....<\/span><br><span style=\"font-size:16px;\">&nbsp;<\/span><br><span style=\"font-size:16px;\">因為和3個娃兒承諾可以玩到水, 車上小孩你一言我一句的,好不熱鬧...<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">微微: &quot; 如果舅舅騙人, 那他就要請我們吃冰再加玩一次電動...&quot;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">Bu-Bu: &quot;對對對, 好主意!&quot;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">光光; &quot; 而且還要讓我用指甲捏一下...&quot;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">微微; &quot; 不過, 我們車上有5個大人, 他們也可以一人請我們吃一枝冰棒..&quot;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">Bu-Bu :&quot;那我就有5枝冰可以吃了耶...&quot;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">阿公: &quot;ㄚ..我又不要吃冰...&quot; (最近阿公聽力有點問題...老是答非所問)<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">微微: &quot;你不要吃冰, 但是可以買給我們小孩吃啊....&quot;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">阿公: &quot; .哦.......我不吃冰可以買給你們吃啊......&quot;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">光光: &quot;對!對!對! 嗯~~阿公真聰明...果然是長輩.....&quot;&nbsp;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">101.06.24&nbsp;<\/span>", "comments": []}, {"id": "13204848", "title": "Greatest Love of All", "date": "2012-04-18 22:13:00", "cat": "3966258", "private": false, "html": "<span style=\"font-size:18px;font-family:標楷體;\">Greatest Love of All&nbsp;<\/span><span style=\"font-size:16px;\"><br><span style=\"font-size:12px;\"><span>(performed by&nbsp;<\/span>Whitney Houston)<\/span><\/span><br><br><br><span style=\"font-size:16px;\">I believe the children are our future&nbsp;<\/span><br><span style=\"font-size:16px;\"><\/span><span style=\"font-size:16px;\">Teach them well and let them lead the way&nbsp;<\/span><br><span style=\"font-size:16px;\">Show them all the beauty they possess inside&nbsp;<\/span><br><span style=\"font-size:16px;\">Give them a sense of pride to make it easier<\/span><br><span style=\"font-size:16px;\">Let the children&#39;s laughter remind us how we used to be&nbsp;<\/span><br><span style=\"font-size:16px;\">Everybody searching for a hero&nbsp;<\/span><br><span style=\"font-size:16px;\">People need someone to look up to&nbsp;<\/span><br><span style=\"font-size:16px;\">I never found anyone who fulfilled my needs&nbsp;<\/span><br><span style=\"font-size:16px;\">A lonely place to be&nbsp;<\/span><br><span style=\"font-size:16px;\">So I learned to depend on me&nbsp;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">I decided long ago, never to walk in anyone&#39;s shadow&nbsp;<\/span><br><span style=\"font-size:16px;\">If I fail, if I succeed&nbsp;<\/span><br><span style=\"font-size:16px;\">At least I live as I believe&nbsp;<\/span><br><span style=\"font-size:16px;\">No matter what they take from me&nbsp;<\/span><br><span style=\"font-size:16px;\">They can&#39;t take away my dignity&nbsp;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">Because the greatest love of all&nbsp;<\/span><br><span style=\"font-size:16px;\">Is happening to me&nbsp;<\/span><br><span style=\"font-size:16px;\">I found the greatest love of all&nbsp;<\/span><br><span style=\"font-size:16px;\">Inside of me&nbsp;<\/span><br><span style=\"font-size:16px;\">The greatest love of all&nbsp;<\/span><br><span style=\"font-size:16px;\">Is easy to achieve&nbsp;<\/span><br><span style=\"font-size:16px;\">Learning to love yourself&nbsp;<\/span><br><span style=\"font-size:16px;\">It is the greatest love of all&nbsp;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">I believe the children are our future<\/span><br><span style=\"font-size:16px;\">Teach them well and let them lead the way&nbsp;<\/span><br><span style=\"font-size:16px;\">Show them all the beauty they possess inside&nbsp;<\/span><br><span style=\"font-size:16px;\">Give them a sense of pride to make it easier&nbsp;<\/span><br><span style=\"font-size:16px;\">Let the children&#39;s laughter remind us how we used to be&nbsp;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">I decided long ago, never to walk in anyone&#39;s shadow&nbsp;<br><\/span><br><span style=\"font-size:16px;\">If I fail, if I succeed&nbsp;<\/span><br><span style=\"font-size:16px;\">At least I live as I believe&nbsp;<\/span><br><span style=\"font-size:16px;\">No matter what they take from me&nbsp;<\/span><br><span style=\"font-size:16px;\">They can&#39;t take away my dignity&nbsp;<\/span><br><span style=\"font-size:16px;\">Because the greatest love of all&nbsp;<\/span><br><span style=\"font-size:16px;\">Is happening to me&nbsp;<\/span><br><span style=\"font-size:16px;\">I found the greatest love of all&nbsp;<\/span><br><span style=\"font-size:16px;\">Inside of me&nbsp;<\/span><br><span style=\"font-size:16px;\">The greatest love of all&nbsp;<\/span><br><span style=\"font-size:16px;\">Is easy to achieve&nbsp;<\/span><br><span style=\"font-size:16px;\">Learning to love yourself&nbsp;<\/span><br><span style=\"font-size:16px;\">It is the greatest love of all&nbsp;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">And if by chance, that special place&nbsp;<\/span><br><span style=\"font-size:16px;\">That you&#39;ve been dreaming of&nbsp;<\/span><br><span style=\"font-size:16px;\">Leads you to a lonely place&nbsp;<\/span><br><span style=\"font-size:16px;\">Find your strength in love<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><span style=\"font-size:16px;\">我相信孩子是我們的未來<\/span><br><span style=\"font-size:16px;\">好好引導他們, 讓他們帶路<\/span><br><span style=\"font-size:16px;\">讓他們看見自己內在的美好<\/span><br><span style=\"font-size:16px;\">給他們榮譽感, 讓事情變得容易些<\/span><br><span style=\"font-size:16px;\">讓孩子的笑聲提醒我們自己也曾有過同樣的過去<\/span><br><span style=\"font-size:16px;\">每個人都在尋找英雄<\/span><br><span style=\"font-size:16px;\">尋找可以仰望的對象<\/span><br><span style=\"font-size:16px;\">但我從未找到任何人完全適合我<\/span><br><span style=\"font-size:16px;\">多麼寂寞啊<\/span><br><span style=\"font-size:16px;\">所以我學著靠自己<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">很久以前我就下定決心, 決不走在別人的陰影當中<\/span><br><span style=\"font-size:16px;\">不論成功或失敗<\/span><br><span style=\"font-size:16px;\">至少我照著自己所相信的而活著<\/span><br><span style=\"font-size:16px;\">不論他們從我身上奪走什麼<\/span><br><span style=\"font-size:16px;\">他們奪不走我對自己的尊敬<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">因為, 最偉大的愛<\/span><br><span style=\"font-size:16px;\">正出現在我身上<\/span><br><span style=\"font-size:16px;\">我發現最偉大的愛<\/span><br><span style=\"font-size:16px;\">就在自己心裡面<\/span><br><span style=\"font-size:16px;\">最偉大的愛<\/span><br><span style=\"font-size:16px;\">很容易就達到<\/span><br><span style=\"font-size:16px;\">學著愛自己<\/span><br><span style=\"font-size:16px;\">就是最偉大的愛<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">如果不巧,那個特別的地方<\/span><br><span style=\"font-size:16px;\">你一直夢想的地方<\/span><br><span style=\"font-size:16px;\">卻帶你到了一個寂寞的地方<\/span><br><span style=\"font-size:16px;\">力量要在愛裡尋找<\/span><\/span>", "comments": []}, {"id": "13202632", "title": "朱喵考進莒光樂隊了", "date": "2012-03-09 13:54:00", "cat": "9658339", "private": false, "html": "<br><span style=\"font-size:16px;\">朱喵考進莒光樂隊了!! &nbsp;這是我始料未及的!!<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">話說從頭:<\/span><br><span style=\"font-size:16px;\">在她4歲時的某一天,我們經過住家附近的 Yamaha,出於好奇,她要求進門去敲敲幾個鍵盤,之後, 轉身告訴我,她想學琴! 從此, 一晃眼, 就學了4 年琴<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">四年後的某一天晚上, 我們母女倆經過”鞋全家福”時, 聽到店家正在播放一首悠揚的鋼琴曲~~當下的我忍不住就告訴他: 這音樂真好聽!<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">沒想到,她竟異常激動的回答: 我聽了心情就變得很差…...<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">我一驚,問: 為什麼?<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">她說: 聽這種音樂會讓我想到練琴, 我討厭練琴 !! (她一個星期只花半小時的時間練琴)<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">我當下無言, 到家,找把拔討論, 把拔說:瓶頸突破就好了<\/span><br><span style=\"font-size:16px;\">(姐姐每次遇到瓶頸就退縮, 那段時間就特別的煎熬)<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">到了公司, 問了幾個有孩子學琴的同事後,都不約而同的”告誡”我說, 這是學琴必經的過程… 都已經練了4年, 學費也繳了不少.....這時候停掉很可惜,以後想彈就要重來…..<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">矛盾,掙扎….不斷的反問自己,我堅持讓孩子繼續學琴的原因是什麼? 人云亦云? 潛意識的優越感作祟? (雖然當初是她自己要求的) 還是, 有始有終?<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">想了兩晚,我決定找把拔談: 我們讓孩子學琴是為了讓他們能夠欣賞音樂的美,讓他們不安的情緒有個宣洩的出口,如果她都已經沒有辦法喜歡音樂,我們為什麼還要做這樣堅持?<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">把拔陷入兩難: 堅持到底,衝破難關 vs 自在開心的欣賞音樂<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">雖然不捨 (看著她兩隻手在琴鑑上飛颺, 做出停課還真的需要很大的決心), 我們還是讓她停課了<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">兩年來,她不曾碰過鋼琴 (因為佔空間, 我一度問把拔要不要把琴賣掉,把拔回說,琴在,她若想彈就還有機會,如果賣了,就永遠沒有希望了), &nbsp;這段時間, 我們也不曾要求她彈琴.....<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">事情開始有轉機是因為,在四年級下學期時, 學校發了一張樂隊招生的通知單<\/span><br><span style=\"font-size:16px;\">平常,他會夾在連絡簿裏讓我簽, 可這次,她卻親自拿來,但表現得不在乎的樣子<\/span><br><span style=\"font-size:16px;\">(我是他媽, 知道他有幾個好朋友在樂隊班,也知道她其實想試試)<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">我問: 想參加嗎?<\/span><br><span style=\"font-size:16px;\">她答: 還好<\/span><br><span style=\"font-size:16px;\">我:　要不要試試看?&nbsp;<\/span><br><span style=\"font-size:16px;\">(要考雙手聯彈+ 視奏和其他的, 據同學媽媽說,是有點難度的曲子,而且還分兩階段考試)<\/span><br><span style=\"font-size:16px;\">她:隨便　<\/span><br><span style=\"font-size:16px;\">我:　那我幫你報名囉<\/span><br><span style=\"font-size:16px;\">她:　隨便<\/span><br><span style=\"font-size:16px;\">我:　那你明天記得交報名表和拿樂譜回來練<\/span><br><span style=\"font-size:16px;\">她:　oh...<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">隔天,報名表交了,樂譜也拿了(由此證明,她是想參加的,不然,以她平日所為,是不會記得這件事的)<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">我: 那就請把拔來教妳彈了(以前都是把拔帶去上課的)<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">後來發現,父女倆都忘了怎麼彈了<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">我: 要不要請一個老師來家裏教, 我們盡力而為,一個禮拜一次,拼一個月試試看?<\/span><br><span style=\"font-size:16px;\">她(想了一下):　好<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">剛開始練習時很辛苦, 不斷的拼湊以前學過的東西,每天放學回家後, 她就開始自己練習….<\/span><br><span style=\"font-size:16px;\">看著她一天一點的小進步, 我和把拔除了讚嘆就是加油.. 讓我訝異的是,她竟能撐過這一整個月<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">一個月後, 某天放學回來,她開心的告訴我,通過第一階段的考試了!!<\/span><br><span style=\"font-size:16px;\">之後,經過幾個月學校的訓練,第二階段也通過了<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">現在,每當她看書看累了的時候, 心情不好的時候, 都會彈彈琴,有時叫她停都停不下來耶!<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">這真是一段奇妙的經歷~~<\/span><br>", "comments": []}, {"id": "13200867", "title": "姐姐帶我看牙醫", "date": "2012-02-07 13:22:00", "cat": "9658339", "private": false, "html": "<br><span style=\"font-size:18px;font-family:標楷體;\">媽咪:<\/span><br><span style=\"font-family:標楷體;font-size:18px;\">昨(2012.2.6)晚因老朱有研討會,晚歸<\/span><br><br><span style=\"font-size:18px;font-family:標楷體;\">光之拉牙醫掛7;00, 我來不及趕回去<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">靈機一動, 我就請朱喵拿健保卡帶光光去對面的長殷牙醫先看<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">錢我到了再給<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">結果<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">我7:15 抵達時<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">朱喵在沙發上看書 (很有經驗,還會自己帶本書備著)<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">朱光已經在補牙了<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">真是小幫手一個<\/span><br><span style=\"font-family:標楷體;font-size:18px;line-height:21px;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">----------<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">三阿姨<\/span><br><span style=\"font-family:標楷體;font-size:18px;\">朱喵已經是個小大人了,行事倒是沈穩.....<\/span><br><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">---------------<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">媽咪:<\/span><br><span style=\"font-family:標楷體;font-size:18px;\">那個畫面很好笑<\/span><br><br><span style=\"font-size:18px;font-family:標楷體;\">平常,朱光跟我去看牙都會撒嬌<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">我本來還怕搞不定<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">沒想到<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">比我還有辦法<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">光看完牙還笑咪咪出來咧<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><span>-------------<\/span><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">Bu bu 媽媽<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">能做的事越來越多了<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><span>-------------<\/span><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">三阿姨:&nbsp;<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">這就是幸福吧~<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">----------------<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">媽咪<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">是啊<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">看完牙回家就有熱騰騰的飯菜可吃<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">幸福啊...<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><span>-------------<\/span><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">三阿姨:<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">是屈服在姐姐的淫威之下吧......<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">他知道跟姐撒嬌可能會討一頓駡,不如堅強點~<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><span>--------------<\/span><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">媽咪:<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">他很會察言觀色的<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">昨晚看牙回來,又出去放燈籠<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">洗完澡,光就整個人賴在姐姐身上(熊抱)<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">我沒空講故事給他聽<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">姐姐就說, 那我來講好了<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">我樂得輕鬆,洗澡上網去了<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">早上朱喵還問光<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">你昨晚很快就睡著了歐......連把拔回來都不知道...<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><span>------------<\/span><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">媽咪:<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">其實朱喵很疼光光的<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">只是<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">有時候受到不公平的對待, 他會用最激烈的方式抵抗<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">(比如說,明明就是光光先動手或不講理,他用同樣方式還擊,<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">結果,在場的大人都指責他之類的....)<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">我現在比較不那麼偏袒光了<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">他應該有感受到.....<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">所以,那天在阿媽家哭的唏哩嘩啦 ,<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">打電話來跟我說時, 其實,我覺得很開心...<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">至少, 在他無助時,會想到我.........<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">看姐弟兩有些互動<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">真的還蠻好笑的 ~~<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">(前天,朱喵洗澡時,我在旁邊刷牙<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">他一時興起,說要唱歌給我聽....<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">唱著唱著....在門外面的玩車的光也跟著大聲唱起來<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">一問...又是喜羊羊的另一首歌.....)<\/span>", "comments": []}, {"id": "13200668", "title": "如果我有女兒", "date": "2012-02-04 14:26:00", "cat": "3966258", "private": false, "html": "<span style=\"font-size:16px;font-family:'times new roman';\">如果我有女兒<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">她會叫我B點, 而不是媽咪<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">因為她曉得<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">不管出了什麼事<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">總是可以找我<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\"><br><\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">我會在你的手背畫上太陽系<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">這樣子, 當你學到宇宙那一課時就可以說<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">喔, 我知道, 就跟我手背上畫的一樣<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\"><br><\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">你將會遇到, 人生對著你的臉狠狠一拳<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">等著你重新爬起來, 再給你的肚子狠狠一腳<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">但惟有窒息, 肺才曉得珍惜空氣<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\"><br><\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">有些心痛是無法用OK繃或詩歌治好的<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">所以, 我要確定你知道<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">當你發覺女超人不來的時候, 並不需要自己穿上披風<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">因為, 不論你把指頭張得多開<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">你的手一定還是太小, 接不住需要治療的每一個傷痛<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\"><br><\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">“還有,寶貝”我要告訴你, “不要把鼻子翹得老高<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">我曉得那一招, 我用過一百萬次了”<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">你這麼做不過是想聞聞看有沒有煙味, 好跟著味道找到失火的房子<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">找到那個在大火中失去一切的男生, 看看你能不能救他<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">或者趕在第一時間找到那位縱火的男生, 看看你能不能改變他<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\"><br><\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">但我知道你不會聽我的勸,<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">所以, 我會在身邊多準備一份巧克力和一雙雨鞋<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">因為, 沒有心痛是巧克力不能治好的<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">…好吧, 確實有一些心痛是巧克力不能治好的, 但這時候雨鞋可就派上用場了<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">因為, 雨水能洗掉所有東西, 只要你願意<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\"><br><\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">我要你透過船底的玻璃窗看世界<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">透過顯微鏡看宇宙, 那存在內心最細微處的宇宙<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">我的媽咪就是這麼教我的<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">她說, 會有那麼一天, 會有那麼一天<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\"><br><\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">當你張開雙手想抓住什麼, 卻弄得傷痕纍纍<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">當你走出電話亭準備起飛, 卻發現要拯救的人正踩著你的披風<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">當你的雨鞋滿是雨水, 眼看就要絕望地跪下<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">就是這一天, 你有最充分的理由說感謝<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">因為, 大海親吻陸地是世界上最美的事<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">不論它被陸地趕了多少次, 大海從不停止靠近<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\"><br><\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">不管下一分鐘將踩到多少地雷<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">要確定你的心平安降落在這個美妙有趣, 名叫生命的地方<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">是的, 我很天真<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">但我要你知道, 這世界是用糖做成的<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">它是那麼容易破碎, 但不要害怕伸出舌頭, 嘗嘗它的味道<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\"><br><\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">寶貝, 我會說<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">記得, 你的媽咪是個擔憂專家, 你的爸比是個戰鬥專家<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">而你, 有著一雙小手, 一對大眼睛, 總是不停地說, 我還要<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">記得, 好事來的時候總是接二連三, 壞事也一樣<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">當你把事情搞砸時, 一定要道歉<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">但永遠不要為你的雙眼拒絕停止發光而道歉<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">你的聲音雖小, 但永遠不要停止歌唱<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">當他們讓你心痛, 把戰爭和仇恨偷偷放在門口<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">在街頭發送傳單，要大家相信: 沒救了、完蛋了<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">告訴他們真應該去看一看<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\">你的媽咪<\/span><br><span style=\"font-size:16px;font-family:'times new roman';\"><br><\/span><br><span style=\"font-size:20px;\">Sarah Kay: If I should have a daughter ...<\/span><br><span style=\"font-size:16px;\"><span style=\"font-size:16px;\">If I should have a daughter, instead of Mom, she&#39;s gonna call me Point B, because that way she knows that no matter what happens, at least she can always find her way to me.<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">&nbsp;And I&#39;m going to paint solar systems on the backs of her hands, so she has to learn the entire universe before she can say, &quot;Oh, I know that like the back of my hand.&quot;&nbsp;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">And she&#39;s going to learn that this life will hit you hard in the face, wait for you to get back up just so it can kick you in the stomach. But getting the wind knocked out of you is the only way to remind your lungs how much they like the taste of air.<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">&nbsp;There is hurt here that cannot be fixed by Band-Aids or poetry. So the first time she realizes that Wonder Woman isn&#39;t coming, I&#39;ll make sure she knows she doesn&#39;t have to wear the cape all by herself. Because no matter how wide you stretch your fingers, your hands will always be too small to catch all the pain you want to heal. Believe me, I&#39;ve tried.<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">&quot;And, baby,&quot; I&#39;ll tell her, don&#39;t keep your nose up in the air like that. I know that trick; I&#39;ve done it a million times. You&#39;re just smelling for smoke so you can follow the trail back to a burning house, so you can find the boy who lost everything in the fire to see if you can save him. Or else find the boy who lit the fire in the first place, to see if you can change him.&quot;&nbsp;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">But I know she will anyway, so instead I&#39;ll always keep an extra supply of chocolate and rain boots nearby, because there is no heartbreak that chocolate can&#39;t fix. Okay, there&#39;s a few heartbreaks that chocolate can&#39;t fix. But that&#39;s what the rain boots are for. Because rain will wash away everything, if you let it.<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">&nbsp;I want her to look at the world through the underside of a glass-bottom boat, to look through a microscope at the galaxies that exist on the pinpoint of a human mind, because that&#39;s the way my mom taught me. That there&#39;ll be days like this. ♫ There&#39;ll be days like this, my momma said. ♫&nbsp;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">When you open your hands to catch and wind up with only blisters and bruises; when you step out of the phone booth and try to fly and the very people you want to save are the ones standing on your cape; when your boots will fill with rain, and you&#39;ll be up to your knees in disappointment. And those are the very days you have all the more reason to say thank you. Because there&#39;s nothing more beautiful than the way the ocean refuses to stop kissing the shoreline, no matter how many times it&#39;s swept away.&nbsp;<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">You will put the wind in windsome, lose some. You will put the star in starting over, and over. And no matter how many land mines erupt in a minute, be sure your mind lands on the beauty of this funny place called life. And yes, on a scale from one to over-trusting, I am pretty damn naive. But I want her to know that this world is made out of sugar. It can crumble so easily, but don&#39;t be afraid to stick your tongue out and taste it.<\/span><br><span style=\"font-size:16px;\"><br><\/span><br><span style=\"font-size:16px;\">&quot;Baby,&quot; I&#39;ll tell her, &quot;remember, your momma is a worrier, and your poppa is a warrior, and you are the girl with small hands and big eyes who never stops asking for more.&quot; Remember that good things come in threes and so do bad things. And always apologize when you&#39;ve done something wrong. But don&#39;t you ever apologize for the way your eyes refuse to stop shining. Your voice is small, but don&#39;t ever stop singing. And when they finally hand you heartache, when they slip war and hatred under your door and offer you handouts on street-corners of cynicism and defeat, you tell them that they really ought to meet your mother.<\/span><\/span>", "comments": []}, {"id": "13200525", "title": "心情日記", "date": "2012-02-02 13:42:00", "cat": "11846491", "private": false, "html": "<br><span style=\"font-size:18px;font-family:標楷體;\">早晨<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">太陽帶來滿滿的體力<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">早餐送我無限的活力<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">心情就像輕飄飄的氣球<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">緩緩飛上天空<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">體育課<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">認真的做仰臥起坐<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">聽到同學的加油打氣<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">心情就像灌滿氣的皮球<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">拼命的上下彈跳<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">英文課<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">聽老師講好難的英文<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">把腦子搞得亂七八糟<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">心情就像落單的燕子<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">擔心趕不上同伴<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">電腦課<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">完成老師要求的事情<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">可以玩遊戲了<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">心情就像瓶子裡的汽水<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">迫不急待想要衝到外面<\/span><br><span style=\"font-size:18px;font-family:標楷體;\"><br><\/span><br><span style=\"font-size:18px;font-family:標楷體;\">心情常常變化萬千<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">有時飛到一零一<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">有時掉到十八層地獄<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">不管開心或生氣<\/span><br><span style=\"font-size:18px;font-family:標楷體;\">都存入我的心情存摺裏<\/span>", "comments": []}, {"id": "13200524", "title": "綜合課", "date": "2012-02-02 13:40:00", "cat": "11846491", "private": false, "html": "<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:標楷體;\">今天上綜合課的時候<span>, <\/span>老師讓我們畫一個愛心。 然後在愛心裏面寫上十個生命中最重要的人。<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:標楷體;\">我們都不知道老師要做什麼<span>, <\/span>所以毫無戒心的把最愛的人名寫上去。\n結果<span>, <\/span>老師竟然說發生了一堆災難<span>, <\/span>我那九個最愛的人都不幸遇難。\n然後<span>,<\/span>請我們把名字劃掉<span>! <\/span>我愣住了<span>, <\/span>早知道就不要寫那麼愛的人嘛<span>!<\/span><\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:標楷體;\">我左右為難<span>, <\/span>猶豫不決<span>, <\/span>不知道究竟該劃掉誰。\n最後<span>, <\/span>我只得忍著心裡的痛<span>, <\/span>將親人的名字一個一個劃掉。 每劃掉一個人<span>, <\/span>都好像在割我的心<span>, <\/span>令我心如刀割<span>, <\/span>我越劃越想哭<span>, <\/span>最後快劃玩時<span>, <\/span>我覺得我已經徹底絕望了。<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:標楷體;\">這時候<span>, <\/span>老師又宣布了另一個新的災難。 我頓時感到晴天霹靂<span>, <\/span>掉進悲傷的深淵中。此時<span>, <\/span>我巴不得從世上消失的人是我而不是親人們。最後<span>, <\/span>我只剩下爸爸和媽媽<span>! <\/span>我完全無法決定該讓誰消失<span>! &nbsp;<\/span>最後<span>,<\/span>只剩下媽媽存活了。<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:標楷體;\">遊戲結束後<span>, <\/span>老師請我們發表心得。 輪到我時<span>, <\/span>我終於按捺不住的哭了起來。 其他同學也哭了。如果連劃名字都這麼困難<span>, <\/span>那如果是真的災難呢<span>?&nbsp; <\/span>那我豈不是要哭死了嗎？<\/span><\/p>\n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:標楷體;\">今天回家後<span>, <\/span>我緊緊的抱住我最親愛的爸比和媽咪<span>, <\/span>對著他們說<span>: ”<\/span>我愛你<span>,<\/span>有你真好<span>!”<\/span><\/span><\/p>", "comments": []}, {"id": "13198229", "title": "為什麼我不能一直待在荒野?", "date": "2011-12-28 12:54:00", "cat": "9658339", "private": false, "html": "<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\">100.12.26<\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\"> &nbsp;<\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\">今天早上上班遲到了<span lang=\"EN-US\">30<\/span>分鐘<span lang=\"EN-US\">....<br>\n<\/span>為什麼呢<span lang=\"EN-US\">?<br>\n<!--[if !supportLineBreakNewLine]--><br>\n<!--[endif]--><\/span><\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\">因為<span lang=\"EN-US\">...<\/span>光光在校門口跟我盧了<span lang=\"EN-US\">40<\/span>分鐘說<span lang=\"EN-US\">:<\/span><\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\"><span lang=\"EN-US\"><br>\n&quot;<\/span>為什麼一個禮拜只有兩天放假<span lang=\"EN-US\">? <\/span>為什麼我不能一直待在荒野<span lang=\"EN-US\">?<br>\n<\/span>為什麼星期天不能再多睡一個晚上<span lang=\"EN-US\">? <\/span>為什麼我一定要上學<span lang=\"EN-US\">?????&quot;<\/span><\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\"><span lang=\"EN-US\">(<\/span>星期六<span lang=\"EN-US\">/<\/span>日<span lang=\"EN-US\">,<\/span>荒野炫蜂團辦了一個兩天一夜的歡樂營<span lang=\"EN-US\">)<\/span><\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\"> &nbsp;<\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\">晚上<span lang=\"EN-US\">, <\/span>我一進家門時<span lang=\"EN-US\">,<\/span>光光就邊唱歌<span lang=\"EN-US\">,<\/span>邊跑過來和我抱抱<span lang=\"EN-US\"><\/span><\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\">抱完後就繼續唱歌<span lang=\"EN-US\"><\/span><\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\"> &nbsp;<\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\">我一直看著他笑<span lang=\"EN-US\"><\/span><\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\">他也笑<span lang=\"EN-US\"><\/span><\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\"> &nbsp;<\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\">我就問<span lang=\"EN-US\">: <\/span>你知道我在笑什麼嗎<span lang=\"EN-US\">?<\/span><\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\"> &nbsp;<\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\">他就說<span lang=\"EN-US\">; <\/span>知道<span lang=\"EN-US\">,<\/span>你在笑我<span lang=\"EN-US\">,<\/span>早上哭那麼傷心<span lang=\"EN-US\">,<\/span>現在又唱得那麼開心<span lang=\"EN-US\">...<\/span><\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\"> &nbsp;<\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\">真拿他沒輒<span lang=\"EN-US\">~~<\/span><\/span><\/p> \n\n<p class=\"MsoNormal\"><span style=\"font-size:18px;font-family:細明體;\"> &nbsp;<\/span><\/p>", "comments": []}, {"id": "12783704", "title": "我應該是長得比較像姐姐才對吧", "date": "2009-07-14 16:48:00", "cat": "9658339", "private": false, "html": "{###_bruceverse/146/1269649664.jpg_###}\n\n<p><font size=\"3\">舉凡看過光光的人都會對他和姐姐「長得像」不斷的發出讚嘆聲。對此，姐弟倆也習以為常。有一天，我休假在家，打算帶光光去附近公園溜溜，經過二樓時，正巧遇到瑜珈老師；於是，一段對話於焉展開。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ccffcc\">阿嗯好。<\/font>」光光是個有禮貌的孩子，每次打招呼都會用上中氣。<br/>\n<br/>\n「好乖，今天不用上學ㄡ？」這是光光最近常觸碰到的「敏感」話題。<br/>\n<br/>\n「<font color=\"#800080\">我們還沒上學啦，要帶他出去走走。<\/font>」我趕緊補充說明。<br/>\n<br/>\n「這麼好ㄡ，媽媽帶你出去玩ㄡ。」話鋒一轉，「他跟把拔長得比較像呵，女兒像妳」<br/>\n<br/>\n「<font color=\"#800080\">是啊，很多人都這麼說。<\/font>」怕光光無聊，我邊說邊下樓，跟伯母道別後，話題也就這樣結束。<\/font><\/p>\n<p><font size=\"3\">走了幾步樓梯，光光若有所思的，突然蹦出一句話：<br/>\n<br/>\n「<font color=\"#ccffcc\">不對吧，我應該是長得比較像姐姐才對吧！<\/font>」<br/>\n<br/>\n2009.03.04<\/font><\/p>", "comments": [{"name": "", "date": "2011-12-15 17:27:53", "url": "", "text": "哇勛僯伃吴剈<br />\n<br />\n9sonba堅持<br />\n打破市場價格`讓你享受最價廉春藥<br />\n<br />\n不要等了-快來<br />\nhttp://gg59high.com", "reply": "", "reply_date": "", "hidden": false, "spam": true}]}, {"id": "12783699", "title": "沒有啦，我只是要從另外一邊上來啊", "date": "2009-07-14 16:46:00", "cat": "9658339", "private": false, "html": "{###_bruceverse/143/1559451928.jpg_###}\n\n<font size=\"3\">光光很好動，你要他安靜下來是不太可能的事。<br/>\n<br/>\n把鼻和我都不想處罰他，除了因為這是他的本性外，最主要原因是…「根本沒用」 (他不怕痛)。<br/>\n<br/>\nfor example，吃飯時到處跑，要他坐下好好吃，不准離開位置，他會乖乖坐好，然後做鬼臉，手不斷揮舞 (好像在跳舞) 逗到你忍不住笑出來。然後，他會跟著你笑，接下來，他會忘記， 然後就從椅子上下來。你問他，忘記媽媽剛剛說什麼了嗎？他會不疾不徐，告訴你：「沒有啦，我只是要從另外一邊上來啊。」接著， 繞個彎，從椅子另一邊爬上來坐好。<br/>\n<br/>\n諸如此類的事，層出不窮，至今仍苦無對策。<br/>\n<br/>\n2009.03.04<\/font>", "comments": []}, {"id": "12783696", "title": "這樣我就安心了", "date": "2009-07-14 16:43:00", "cat": "9658339", "private": false, "html": "{###_bruceverse/145/1285099451.jpg_###}\n\n\n<font size=\"3\">光光星期一到星期五在阿嬤家的時候，只要是晴天，通常阿公阿嬤會帶去公園溜溜。有一天回家，他突然告訴我：<br/>\n<br/>\n「<font color=\"#ccffcc\">阿嬤今天帶我去公園的時候，我有跟一個別人的哥哥玩滾球，然後有一個騎腳踏車的哥哥也來加入我們，阿嬤就說：『好可惜，我們都沒有帶腳踏車來公園，回去跟媽媽講，把你紅色的車車帶來阿嬤家。』<\/font>」 <br/>\n<br/>\n於是，「孝順」的把拔，就在「天這麼黑，雨這麼大」的夜晚，將他的車送到阿嬤家。為了騎乘方便，阿嬤建議把腳踏車鎖在舅舅的停車場，於是乎，辛苦的老爸在暴雨的夜晚裏又把它扛到車庫去。 第二天，光光念茲在茲，心繫車車。阿嬤抝不過他苦苦哀求，便交代舅舅騎車載他去看一眼。回來後，他開心的跟阿嬤敘述看車經過，然後，下了一個結論：<br/>\n<br/>\n「<font color=\"#ccffcc\">這樣我就安心了。<\/font>」<br/>\n<br/>\n2009.03.04<\/font>", "comments": []}, {"id": "12783692", "title": "因為我『長大』就要去上學，就沒辦法跟你相親相愛啊！", "date": "2009-07-14 16:35:00", "cat": "9658339", "private": false, "html": "{###_bruceverse/146/1269649659.jpg_###}\n\n\n<font size=\"3\">賦閒在家，看著光光肥嘟嘟的兩頰，我忍不住抱過來親了又親。<br/>\n<br/>\n「<font color=\"#800080\">光，你以後長大還會不會和我『相親相愛』啊？<\/font>」我深情的望著他，心想，「巧言令色」的他肯定會給我一個我想要的答案。<br/>\n<br/>\n「<font color=\"#ccffcc\">嗯，應該是不會啦。<\/font>」他一脈深情的回望我。<br/>\n<br/>\n「<font color=\"#800080\">為什麼？我這麼的愛你…<\/font>」如同晴天霹靂般，這不像我「親愛」的光光會說的話啊。<br/>\n<br/>\n「<font color=\"#ccffcc\">因為我『長大』就要去上學，就沒辦法跟你相親相愛啊！<\/font>」原來，他是有邏輯的。<br/>\n<br/>\n「<font color=\"#800080\">可是，你不是說，三歲不要上，四歲不要上，五歲還是不要上學嗎？<\/font>」我把他三歲時的話複誦給他聽。<br/>\n<br/>\n「<font color=\"#ccffcc\">ㄚ可是我長大就是要上學，只有把拔可以和妳在家相親相愛啊。<\/font>」<br/>\n<br/>\n2009.03.04<\/font>", "comments": []}, {"id": "12444021", "title": "一個家如果聽不到小孩講的好笑的話和他們的笑聲", "date": "2008-10-24 21:11:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" src=\"\" data-lost=\"93/1400835424.jpg\" alt=\"\"/>\n<p>這年紀的姐姐喜歡玩「假裝」的遊戲──假裝她是老師、我是同學；或者，假裝她是妹妹，假裝光光是哥哥、妹妹或姐姐…百玩不厭。<\/p>\n<\/font>\n<p><font size=\"3\">最近這幾天我休年假，心情輕鬆下我也樂得陪著一起玩。剛把帳蓬球屋搬出來就定位，她馬上跑了過來。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">媽媽，妳今天可以跟我玩『假裝』的遊戲嗎？<\/font>」這簡單！我二話不說馬上就答應了。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">好，那妳就假裝是我鄰居<\/font>」嗯，沒問題（只要不是再玩老師／學生的遊戲就好）。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">那弟弟就是妳的小孩…<\/font>」連弟弟也有角色要扮演，接下來呢？<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">妳先等我把床鋪好，小孩放好再開始好嗎？<\/font>」她喜歡把她的花花被鋪在球屋裡當「她小孩」的床墊，再放上枕頭和棉被。<\/font><\/p>\n<p><font size=\"3\">經過一番整理後…約莫五分鐘…<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">媽媽，可以開始了…<\/font>」她興奮得對著我說。<\/font><\/p>\n<p><font size=\"3\">……嗯…開始？怎麼開始呢？…我想了一下，既然我是「鄰居」，那麼……<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" src=\"\" data-lost=\"93/1400835425.jpg\" alt=\"\"/><\/p>\n<\/font>\n<p><font size=\"3\">「<font color=\"#800080\">弟弟，來…叫阿姨…<\/font>」 光光已經很習慣這樣的遊戲，對於他所扮演的「角色」，也都能輕鬆以對。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ccffcc\">阿姨好。<\/font>」故做可愛是他擅長的把戲之一。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">洪太太，妳的兒子長得真是可愛又有禮貌，我看了很喜歡。<\/font>」這樣的對話…好像有點超齡了。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">ㄡ，我是朱太太啦 …不過妳也可以叫我洪小姐。<\/font>」（我花了一番功夫跟她解釋兩者的差別）<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">ㄡ，不好意思…朱太太… 妳的兒子長得真是可愛，我看了很喜歡。<\/font>」再重覆一遍。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">謝謝妳的讚美。妳剛搬來呀？妳有幾個孩子啊？<\/font>」看到帳篷裏有躺著 4 個娃娃，我忍不住問。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">我有四個孩子，現在又懷孕了，應該快要生了吧…<\/font>」回答得很認真。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">四個？這麼多？妳不覺得孩子有時候很煩人？<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">是啊，有時候真的會覺得煩，可是一個家如果聽不到小孩講的好笑的話和他們的笑聲，就有點太無聊了，所以雖然煩，我還是決定多生幾個…我真的很喜歡小孩。<\/font>」<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" src=\"\" data-lost=\"93/1400835427.jpg\" alt=\"\"/><\/p>\n<\/font>\n<p><font size=\"3\">「<font color=\"#800080\">那妳先生呢？<\/font>」 我好奇了，她要怎麼編下去咧…<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">在美國……<\/font>」回答得倒很輕鬆。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">美國？…他的職業是什麼呀？<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">他呀……是一個生意人。<\/font>」真能掰。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">做什麼生意啊？<\/font>」我更好奇了。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">開10元商店啊。<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">10元商店這麼好賺啊？可以養這麼多小孩？<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">也沒有賺很多啦，他的錢就剛好夠養這些孩子和買這幢房子。<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">妳們這房子幾樓啊？<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">12樓。<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">都是你們家的啊？<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">嗯…我們家的錢就剛好夠買這些…<\/font>」OOps! 還真是個「小康」之家啊。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">那你老公很少回來ㄡ？<\/font>」不禁令人為她擔心。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">嗯，大概一個月回來一次吧。<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">ㄏㄡ…那你們當初怎麼認識的？<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">我那時候就是想要有一個小孩，然後就遇到我老公，就跟他結婚了…<\/font>」這未免也太隨便了點....<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">那妳愛他嗎？<\/font>」真懷疑這樣的感情基礎會不會太薄弱了。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">愛啊。<\/font>」不假思索的回答。<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" src=\"\" data-lost=\"93/1400835422.jpg\" alt=\"\"/><\/p>\n<\/font>\n<p><font size=\"3\">換個話題吧…<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">已經很晚了，妳要不要帶孩子到我們家吃飯？一個人帶四個孩子又懷孕，實在很辛苦，我剛好有煮飯，一起過來吃，補一補身子吧。<\/font>」這樣的劇情，讓我不知不覺中，用字遣詞也「大人」化了。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">好啊，真是打擾了。<\/font>」這樣的回答，好像也蠻搭的…<\/font><\/p>\n<p><font size=\"3\">端出我剛剛煮的飯菜～～<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">朱太太，妳煮的東西真的好好吃哦～<\/font>」什麼時候嘴巴這麼甜呀。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">真的嗎？我女兒都不愛吃我煮的東西，每次辛辛苦苦弄了一桌菜，她還是不喜歡吃，真不知道怎麼辦好…<\/font>」我藉機抱怨了一下。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">那妳就都煮她愛吃的就好了呀。<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">可是她就是愛吃那些炸的啦，不營養的東西，還喜歡喝珍珠奶茶，糖果之類的，通通都是對身體不好的東西啦…如果妳是我該怎麼辦好？<\/font>」把球丟給她接。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">嗯....那真的很傷腦筋，我也不知道怎麼辦才好……<\/font>」她對著我報以羞赧的微笑。<\/font><\/p>\n<p align=\"left\"><font size=\"3\">一番沉默之後，重新出發。<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" src=\"\" data-lost=\"93/1400835428.jpg\" alt=\"\"/><\/p>\n<\/font>\n<p><font size=\"3\">「<font color=\"#ffcc99\">我吃飽了，要回家了…謝謝妳的招待<\/font>」。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">不客氣，有空要常來我家吃飯ㄡ，懷孕的人要多多補充營養，小孩才會健康…<\/font>」這樣的對話會不會太「成人」了。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">好啊，沒問題。再見囉。<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">再見。<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">啊，對了，妳明天還要上班，妳兒子要不要乾脆住在我們家，等妳下班後再來接？<\/font>」以為已經演完了，豈知還有下集……<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">可是妳已經懷孕了，還有四個小孩要顧，會不會太麻煩了？<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">沒關係，我很喜歡小孩， 而且你們家展賦很乖很可愛，不會麻煩啦。<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">ㄡ，這樣啊，那就謝謝囉。<\/font>」既然這麼熱情，我就不便再堅持了。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">不客氣，來…展賦，跟媽媽說 Bye-Bye<\/font>」說完，順手牽起&quot;我兒子&quot;的手。<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" src=\"\" data-lost=\"93/1400835429.jpg\" alt=\"\"/><\/p>\n<\/font>\n<p><font size=\"3\">這時的光光也馬上融入劇情…「<font color=\"#ccffcc\">媽媽 Bye-Bye。<\/font>」之後，我們母子倆依循慣例，抱一抱，親一親。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">朱太太，那我們先走了ㄡ<\/font>」。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#800080\">要生的時候別忘了通知我哦，老公不在身邊要小心一點ㄋㄟ。<\/font>」越來越覺得我好像是跟同齡的人在對話….<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">ㄡ，沒問題，妳人真好。<\/font>」就這樣…我的「鄰居」帶著我的「兒子」回家去了。<\/font><\/p>\n<p><font size=\"3\">結束了嗎？當然不！<\/font><\/p>\n<p><font size=\"3\">姐弟倆在房間裏又對話了好一陣子後，只聽見姐姐急促的喊著弟弟…<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">展賦，我…我…我的肚子好痛…ㄡ…好痛…<\/font>」在餐廳的我聽了一陣心慌…是怎麼了？ 吃壞肚子了嗎？？？？<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">我可能是快要生了…請你趕快去找妳媽媽……送我去醫院…ㄡ…好痛ㄡ……<\/font>」<\/font><\/p>\n<p><font size=\"3\">我心一驚……還要再演下去啊……<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" src=\"\" data-lost=\"93/1400835430.jpg\" alt=\"\"/><\/p>\n<p>2008.09.29<\/p>\n<\/font>", "comments": [{"name": "camel", "date": "2008-11-02 17:34:05", "url": "", "text": "哈哈哈    真是太可愛了", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "流月無聲", "date": "2008-12-12 14:15:34", "url": "http://blog.sina.com.tw/endiana/", "text": "昀桀大婚你怎麼沒來啊<br />\n你最近好嗎？", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "12306572", "title": "那我就不疼妳了喲", "date": "2008-08-05 13:34:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" src=\"\" data-lost=\"94/1065715303.jpg\" alt=\"\"/>\n<p>這幾天 Bu-Bu 姐姐幼稚園放暑假，「住ㄚ嬤家」就是想當然爾的行程之一囉。<\/p>\n<\/font>\n<p><font size=\"3\">為了要看卡通，Bu-Bu 用囫圇吞棗的超快速度解決晚餐。吞下最後一口後，飛也似的衝到客廳沙發，準備好好享用她的卡通影片。<\/font><\/p>\n<p><font size=\"3\">「喂，Bu-Bu，妳沒有吃乾淨，不可以看電視ㄡ！」ㄚ嬤對著客廳喊。<\/font><\/p>\n<p><font size=\"3\">此時，愛管閒事的光光上場了。<\/font><\/p>\n<p><font size=\"3\">「哦，沒吃完啊，那我幫她吃完。」說完，就拿起 Bu-Bu 的碗開始扒；Bu-Bu 見狀，趕快跑了過來，「<font color=\"#ffcc99\">ㄟ，我生病，你不可以用我的湯匙啦<\/font>」。<\/font><\/p>\n<p><font size=\"3\">解決了晚餐，Bu-Bu 到客廳坐定位，正準備開始看卡通時，光光為盡地主之誼， 尾隨姐姐後面，殷勤的把水奉上（飯後要漱口嘛）。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ccffcc\">Bu-Bu 喝水吧。<\/font>」<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ffcc99\">我不要！<\/font>」因為好不容易可以開始看電視，又被打擾，口氣有點兇，有點不耐煩。<\/font><\/p>\n<p><font size=\"3\">「<font color=\"#ccffcc\">ㄡ，妳不要喝ㄡ…那我就不疼妳了喲。<\/font>」小子還蠻懂進退的嘛。<br/>\n<br/>\n2008.7.29<\/font><\/p>", "comments": [{"name": "", "date": "2008-08-05 09:56:53", "url": "", "text": "照片選得真好!", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "小憶", "date": "2008-08-07 10:17:17", "url": "", "text": "ㄎㄎ<br />\n真是口愛的小子", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "12286302", "title": "千江有水千江月", "date": "2008-07-25 13:50:00", "cat": "3966263", "private": false, "html": "<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777058844.jpg\"/><\/p>\n<p><font size=\"3\">故事的主軸是貞觀與大信的愛情，但蕭麗紅在這個主軸上鑲嵌了許多美麗的寶石。每一段閩南語的對白，每一件發生在親人身上的小插曲，那才是小說最美的部分。故事主軸變成了衣架子，看似重要卻不重要，如同渡河的船一樣，到了彼岸，就可將其捨棄。<\/font><\/p>\n<p><font size=\"3\">這是我五個月以前第一次讀《千江有水千江月》的感覺，這幾天為了完成寫到一半的讀後感，全書翻過來翻過去地跳讀，時而瀏覽時而精讀，差不多又看了一遍。經過這樣的反芻，五個月前感覺唯美的部分依然唯美，但最初以為徒具形式的故事主軸卻漸漸嚼出了味道。<\/font><\/p>\n<p><font size=\"3\">和許多人一樣，我原本也覺得貞觀與大信的愛情結束得有些草率。但《千江有水千江月》單單靠著記錄了「阿嬤所用的語言」以及「阿嬤那個時代的生活」就足以不朽，所以，我一點都不在意這個愛情故事的「敗筆」，更何況貞觀與大信之間的魚雁往返確實見證了一段純純的愛──等信的焦慮、收信的喜悅，信中不時流露的嫉妒與試探，是多少初戀男女的共同經驗。貞觀佇立在大信家的樓下「站崗」，仰望窗戶放出的光亮，想像心上人此時此刻在做些什麼，這不也是許多初戀男女曾經做過的傻事。<\/font><\/p>\n<p><font size=\"3\">一旦我們習慣了重口味的「慾望城市」，貞觀與大信的愛情就成了小孩子玩家家酒──還沒有肌膚之親，還沒有表白，還沒有承諾，竟然就結束了嗎？竟然就可以為伊消得人憔悴嗎？但如果我們願意暫時離開此時此地，讓思緒飄回自己情竇初開的年紀，也許我們會從中瞥見貞觀或大信的身影，然後感謝上天曾讓我們走過一段不知男女之事，卻有男女之情的年紀，感謝上天沒讓我們成為愛情的跳級生，沒讓我們錯過愛情最初的型態。<\/font><\/p>\n<p><font size=\"3\">蕭麗紅在後記中說：<\/font><\/p>\n<p><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"4\">不論世潮如何，人們似乎在找回自己精神的源頭與出處後，才能真正快活。<\/font><\/p>\n<p><font size=\"3\">他的本意或許只是血脈的源頭，文化的源頭；然而，若用以指稱愛情型態的源頭，這番話同樣發人深省。<\/font><\/p>\n<p><font size=\"3\">另外，如果我們願意再讀一遍《千江有水千江月》，或許會發現貞觀與大信的戀情結束得並不真的那麼草率。<\/font><\/p>\n<p><font size=\"3\">首先，小說採用第一人稱觀點（雖然蕭麗紅提到貞觀時用「她」而不用「我」，但整部小說其實是採貞觀的角度在看事情，而非全知觀點）。在這樣的限制下，無法清楚交待大信那一邊的事情是合理的，問題是，蕭麗紅為什麼不作交待？<\/font><\/p>\n<p><font size=\"3\">或許，我們會因為蕭麗紅（或大信）丟給我們一個悶葫蘆而覺得不舒服，然後怪他太草率太敷衍。但換個角度想想，無疾而終確實是愛情畫上句點的一種方式，而且還經常看見。<\/font><\/p>\n<p><font size=\"3\">更重要的是，像這樣子缺少明確解釋的分手凸顯了貞觀（蕭麗紅）對死亡的態度。首先，人如陶瓷瓦罐──易碎（愛情又何嘗不是）。其次，重點不是愛情（生命）是如何結束的，重點是如何看待愛情（生命）的結束。<\/font><\/p>\n<p><font size=\"3\">蠶死了，蛾卻活了。蠶的作繭自縛是老掉牙卻充滿新意的隱喻。死的可以是生命、是愛情，也可以是痛苦。<\/font><\/p>\n\n<font size=\"3\">Ps.<br/>\n1. <font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"4\">千江有水千江月，萬里無雲萬里天：<\/font><br/>\n全世界的河流都一樣，只要有水就能見月；全世界的天空都一樣，只要無雲就能見天。<\/font>\n<p><font size=\"3\">2. 摘錄一段美麗的譬喻 (P.314)：<br/>\n<br/>\n<\/font><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"4\">…小時候，她還去看人鑿井，鐵樁撞至最深處，甘美的水會湧冒出來。心同地理；一地只有一池水，一顆心也只能有一口井，有些地形不當，或是鑿井的人欠通靈，則幾年幾月過去，空池也只是空池。大信是鑿她心中深井的人，除了大信，她永遠只是死水一池，枯井一窟。<\/font><\/p>\n<p><font size=\"3\">3. 摘錄一段深刻的領悟 (P.319)：<br/>\n<br/>\n<\/font><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"4\">晨光中，貞觀終於回到故鄉來。故鄉有愛她的人，她愛的人；人們為什麼要去流浪呢？異鄉、外地所可能扎痛人心的創口，都必須在回得故里之後，才能醫治，才能平復…<\/font><\/p>\n<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777058845.jpg\"/><\/p>", "comments": [{"name": "Sapina", "date": "2008-10-20 05:18:12", "url": "", "text": "這本書是我高中時期與死黨最喜歡的一本書,當時感動落淚的情懷可依舊未忘,<br />\n你的分享讓我再度喚醒當時的記憶,有時間真該找出該書再次重溫,<br />\n也許隨著年歲閱歷的增長,另有一番滋味吧！", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "12278875", "title": "我的資優班", "date": "2008-07-21 12:25:00", "cat": "3966263", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777058843.jpg\"/><\/font><\/p>\n<p><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"4\">幽默和創意，自信和分享。<\/font><\/p>\n<p><font size=\"3\">這是游森棚教授對資優的親身體驗，充份表現數學家的精確度和抽象能力。然而，這「四維」的普遍性一點都不像資優生的專利。事實上，資優生之所以成就出眾，關鍵在於比別人更早立定（合乎天賦的）志向，而且比別人更努力，這也就是游教授在《我的資優班》書末所提出的第二項結論：<\/font><\/p>\n<p><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"4\">看清楚自己的最愛，就努力去追。真的很努力，而且樂在其中。<\/font><\/p>\n<p><font size=\"3\">《我的資優班》是建中資優班的真實故事。這樣特別的故事，不應該只停留在我們對於明星的偷窺慾或好奇心的滿足，而應該激發一些鬥志或企圖心：「彼可取而代也」、「大丈夫當如此也」、「舜何人也，予何人也，有為者亦若是」。<\/font><\/p>\n<p><font size=\"3\">《我的資優班》表面上是一則一則小故事，但每則小故事都傳遞一個教育理念，整本書幾乎涵蓋了高中教育最核心的議題，可以引導我們思考，進而為這個階段的孩子建立明確的教育目標：<\/font><\/p>\n<p><font size=\"3\"><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ccffcc\" size=\"4\">不要管排名：<\/font><br/>\n比排名更重要的是：有沒有學到東西？有沒有成長、進步？有沒有從學習本身得到樂趣？<\/font><\/p>\n<p><font size=\"3\"><font color=\"#ccffcc\"><font face=\"&#x006a19;&#x006977;&#x009ad4;\" size=\"4\">不要補習：<\/font><br/>\n<\/font>補習的機會成本驚人：<br/>\n1. 喪失獨立整理、歸納、建立知識結構的能力。<br/>\n2. 錯過與教科書對話的機會，教科書含有真正的思想精華。<\/font><\/p>\n<p><font size=\"3\"><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ccffcc\" size=\"4\">不要留一手：<\/font><br/>\n分享的好處多多：<br/>\n1. 教學相長，讓自己的了解或體會更深刻、更紮實。<br/>\n2. 互惠。<br/>\n3. 建立友情。<\/font><\/p>\n<p><font size=\"3\"><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ccffcc\" size=\"4\">閱讀<\/font><br/>\n開個書單吧。<\/font><\/p>\n<p><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ccffcc\" size=\"4\">英文<\/font><\/p>\n<p><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ccffcc\" size=\"4\">健康<\/font><\/p>\n<p><font size=\"3\"><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ccffcc\" size=\"4\">面對損失<\/font><br/>\n不放手可能失去更多。<\/font><\/p>\n<p><font size=\"3\"><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ccffcc\" size=\"4\">面對挫折<\/font><br/>\n1. 謀事在人，成事在天。<br/>\n2. 知音的安慰（父母與師長的另一件重要工作）。<\/font><\/p>\n<p><font size=\"3\"><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ccffcc\" size=\"4\">面對壓力<br/>\n<\/font>游教授在許多不同的故事都提到壓力的釋放與資優生的反骨，我稍作一些整合與歸納（也夾帶一些自己的詮釋）。<\/font><\/p>\n<p><font size=\"3\">舒解壓力可求助於運動、社團、漫畫、電玩、搞怪（反抗權威、顛覆傳統、標新立異）…只要驅動這些行為的因素來自趣味，即具有舒解壓力的功效。父母師長不但不應該限制某些看似旁門左道的低級趣味，甚至可以把某些舒解壓力的「藥方」作為獎品，只要留意孩子沒有沈迷或上癮即可。<\/font><\/p>\n<p><font size=\"3\">萬一孩子迷失了，父母應該將孩子的行為解釋為不曉得（或忘記了）生命中有更重要的事情，再設法從岔題切回主題。不要直接剝奪那些「小趣味」，而應該以「大趣味」取代之（所謂的大趣味是指真正的領悟、蛻變與獨立）。因此，父母師長應該給高中生適度的放縱與搞怪空間，偶爾讓他們瘋狂一下。<\/font><\/p>\n<p><br/>\n<font size=\"3\"><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ccffcc\" size=\"4\">面對愛情<\/font><br/>\n尊重對方，不要讓愛情變成遊戲。<\/font><\/p>\n<p><font size=\"3\"><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#0000ff\" size=\"4\"><font color=\"#ccffcc\">團隊合作<\/font><br/>\n<\/font>參加合唱比賽、話劇比賽等團體競賽。<\/font><\/p>\n<p><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ccffcc\" size=\"4\">感恩惜福<\/font><\/p>\n<p><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ccffcc\" size=\"4\">同理心<\/font><\/p>\n<p><font size=\"3\">最後，也是最重要的：<\/font><\/p>\n<p><font size=\"3\"><font face=\"&#x006a19;&#x006977;&#x009ad4;\" color=\"#ff0000\" size=\"5\"><font color=\"#ffcc99\">幽默<\/font><br/>\n<\/font><br/>\n======<br/>\n有自信的人說起話來就有感染力，但有些話可能並不那麼恰當，聽的人要有判斷力，不能照單全收；不過，四平八穩的言論通常缺少感染力，讓人聽不進去。因此，我還是寧可讀一本夾雜著趣味和陷阱的書──吃魚時記得把魚刺剔掉就好了。<\/font><\/p>\n<p><font size=\"3\">我並不是暗示《我的資優班》暗藏陷阱，嚴格說起來我心裡只有兩個遺憾，其一是對愛情與健康這兩個議題的著墨較輕，其二是對幽默的詮釋採用了較為「資優」的風格，例如，「聰明的學生都很有幽默感」這樣的句子不免弱化了幽默的必要性及普遍性。<\/font><\/p>\n<p><font size=\"3\">幽默是找到樂趣並感染給別人的能力，所有小孩都是天生的幽默大師，當我們說純真喪失，最重要的就是幽默感的喪失。如果童年真的教了我們什麼，那就是趣味主義或幽默感。只有趣味能讓人變得資優（屬於他那個天賦領域的資優），苦行只會讓人變得庸俗。<\/font><\/p>\n<p><font size=\"3\">事情是多面向的，有幽默感的人總能從趣味的角度看事情。失敗者以為奮鬥很苦，但成功的人總能在奮鬥中找到趣味，苦修走不遠，樂活才走得遠。<\/font><\/p>\n<p><font size=\"3\">進入大學之前的教育都應該是消極的、保護的，細心呵護孩子與生俱來的每一項好的品質（例如幽默感）。當孩子感受不到學習的趣味時，父母或老師應該思考，是時候未到呢，或是擺錯位置。如果是時候未到，應該採取適當的引導方式（誘之以利，用外在的獎品作為火種，等待內在動機的燃燒），而不是強迫或填鴨；但如果是擺錯位置，就應該趁早放棄，試探別的領域。<\/font><\/p>\n<p><font size=\"3\">最後，我想提一件很重要，但沒有在《我的資優班》提到的事情，我希望那不是跟聰明才智一樣屬於天賦難以改變的品質，而是像感恩惜福的心一樣可以培養出來的。<\/font><\/p>\n<p><font size=\"3\">我懷疑，有些人（包含我自己）即使放在正確的位置也不見得能將天賦充份發揮，原因是缺少一些管理方法，那就是「許願」和「紀律」。許願就是訂出功課表，紀律就是照表操課。真正讓我們遠遠落後資優生的原因，不是我們比較笨，也不是我們比較沒有熱情，而是我們讓日子過得太隨便。<\/font><\/p>", "comments": [{"name": "新的", "date": "2008-08-01 03:30:16", "url": "http://www.wretch.cc/blog/neohappiness", "text": "Dear Bruce:<br />\n<br />\n不知道你看過葛拉威爾(Malcolm Gladwell)的決斷兩秒鐘(Blink)的書嗎?<br />\n它的理論是透過人生經驗的積累, 人們往往能在兩秒間做出正確的判斷.<br />\n<br />\n看到你這篇文章, 我深感認同:<br />\n<br />\n1)我一直認為年輕人最重要的功課莫過於清楚自己想做什麼　<br />\nhttp://www.wretch.cc/blog/neohappiness/6728021<br />\n2)另外回應你的”不要留一手”我也同意”施比受更幸福”　<br />\nhttp://www.wretch.cc/blog/neohappiness/6488998<br />\n<br />\n很高興逛到你的部落格,　有空我會常來", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "", "date": "2008-08-01 10:24:07", "url": "", "text": "新的：<br />\n<br />\n謝謝你的回應與肯定<br />\n<br />\n這篇其實是以書摘為主，游教授寫得非常好，所以我想節省一點將來重讀這本書的時間<br />\n<br />\n當然，寫下書摘與評論也有推薦給大家看的意思，事實上，我幾乎只做推薦的事，不做杯葛的事<br />\n<br />\n你的部落格也很有趣，有空我也會常去逛逛", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "greendog", "date": "2008-08-17 10:08:02", "url": "", "text": "看清楚自己的最愛，就努力去追。真的很努力，而且樂在其中。<br />\n<br />\n做到這點就很好了", "reply": "", "reply_date": "", "hidden": false, "spam": false}, {"name": "greendog", "date": "2008-08-17 10:13:42", "url": "", "text": "&quot;許願就是訂出功課表，紀律就是照表操課。真正讓我們遠遠落後資優生的原因，不是我們比較笨，也不是我們比較沒有熱情，而是我們讓日子過得太隨<br />\n便。&quot;   說的很好<br />\n<br />\n如果以往沒有想定。就從現在開始許願。", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "12266157", "title": "讓我們一起努力，不亂發脾氣好不好？", "date": "2008-07-14 14:05:00", "cat": "9658339", "private": false, "html": "<p align=\"center\"><font size=\"3\"><img loading=\"lazy\" src=\"\" data-lost=\"3/1252191999.jpg\" alt=\"\"/>\n<p>微微：<\/p>\n<\/font>\n<p><font size=\"3\">媽媽要跟妳說對不起。<\/font><\/p>\n<p><font size=\"3\">昨天晚上，妳陪著我去剪頭髮，一路上，我們有說有笑，唱著歌回來。妳也陪我走好久好久的路。後來，妳告訴我，腳好痠，想坐下來休息&hellip;「坐在這裏」妳比了比一家商店櫥窗的空地。可是，已經要九點了。你才剛從新竹玩回來，沒睡午覺，也沒洗澡，明天還要上學&hellip;我說，「我們走慢一點就好了啦」，於是，我放慢腳步，讓妳不覺得累。<\/font><\/p>\n<p><font size=\"3\">走了幾步，妳停下來，不走了，站著等我&hellip;我繼續慢慢的走，我走得很慢很慢（媽媽是個急性子的人，要我慢慢做某件事，是很不容易的事，可是為了要讓妳趕上，我提醒自己「再慢一點，再慢一點」）希望妳休息後，可以很快就趕上我&hellip;<\/font><\/p>\n<p><font size=\"3\">「馬麻&hellip;&hellip;馬麻&hellip;」妳越喊越大聲，越喊越生氣。<br/>\n我回頭看看妳，「不遠嘛&hellip;」我心裏想，於是我繼續走&hellip;因為很累，我不想多說話，放慢腳步走，我以為妳知道我的用心。<\/font><\/p>\n<p><font size=\"3\">後來，你把薄外套拖在地上，走到我前面，我知道妳是故意氣我的。妳成功了，媽媽是個壞脾氣的人。我真的好生氣，好生氣&hellip;氣我這樣慢慢走等妳，你還不高興，氣我女兒動不動就亂發脾氣&hellip;於是我要妳回家後罰跪，因為很生氣，我還拿了尺狠狠得打了妳三下，還警告妳「下次再動不動生氣，我會把尺打到斷掉」。我很兇很兇，兇到我都不認識自己了。我看到妳眼睛裏泛著淚光，我知道妳很想哭，可是妳忍住了。<\/font><\/p>\n<p><font size=\"3\">打了妳，媽媽很難過也很捨不得。我好氣自己&hellip;如果我可以告訴妳，妳先休息，我會慢慢走，到前面等妳&hellip;如果我可以在妳喊我時，回頭告訴妳，我會等妳，不用怕&hellip;這些事都不會發生了。為什麼我要「以為」妳知道我在做什麼&hellip;為什麼我要對我這麼愛的人發這麼大的脾氣？<\/font><\/p>\n<p><font size=\"3\">我的乖微微，媽媽寫這封信是要告訴妳，我真的很愛妳。<\/font><\/p>\n<p><font size=\"3\">讓我們一起努力，不亂發脾氣好不好？<\/font><\/p>\n<p><font size=\"3\">愛妳的媽媽<br/>\n2008.07.14<br/>\n<br/>\n<p align=\"center\"><img loading=\"lazy\" src=\"\" data-lost=\"3/1252192000.jpg\" alt=\"\"/><\/p>\n<\/font>", "comments": []}, {"id": "12219631", "title": "Leader of the Band", "date": "2008-06-19 12:07:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><font size=\"4\" face=\"Times New Roman\"><font size=\"5\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777058836.jpg\"/>\n<p>Leader of the Band<br/>\n<\/p>\n<font size=\"3\"><a href=\"http://tw.youtube.com/watch?v=cy3GHCy49Dw\" target=\"_blank\">(peformed by Dan Fogelberg)<\/a><\/font><br/>\n<br/>\n<font size=\"4\">An only child, alone and wild<br/>\nA cabinet maker&#39;s son<br/>\nHis hands were meant for different work<br/>\nAnd his heart was known to none<br/>\nHe left his home and went his lone<br/>\nAnd solitary way<br/>\nAnd he gave to me a gift I know<br/>\nI never can repay<br/>\n<br/>\nA quiet man of music<br/>\nDenied a simpler fate<br/>\nHe tried to be a soldier once<br/>\nBut his music wouldn&#39;t wait<br/>\nHe earned his love through discipline<br/>\nA thundering velvet hand<br/>\nHis gentle means of sculpting souls<br/>\nTook me years to understand.<\/font><\/font>\n<p>The leader of the band is tired<br/>\nAnd his eyes are growing old<br/>\nBut his blood runs through my instrument<br/>\nAnd his song is in my soul <br/>\nMy life has been a poor attempt<br/>\nTo imitate the man<br/>\nI&#39;m just a living legacy<br/>\nTo the leader of the band.<\/p>\n<p>My brothers&#39; lives were different<br/>\nFor they heard another call<br/>\nOne went to Chicago<br/>\nAnd the other to St. Paul<br/>\nAnd I&#39;m in Colorado<br/>\nWhen I&#39;m not in some hotel<br/>\nLiving out this life I&#39;ve chose<br/>\nAnd come to know so well.<\/p>\n<p>I thank you for the music<br/>\nAnd your stories of the road<br/>\nI thank you for the freedom<br/>\nWhen it came my time to go<br/>\nI thank you for the kindness<br/>\nAnd the times when you got tough<br/>\nAnd, papa, I don&#39;t think I<br/>\nSaid I love you near enough.<\/p>\n<p>The leader of the band is tired<br/>\nAnd his eyes are growing old<br/>\nBut his blood runs through my instrument<br/>\nAnd his song is in my soul<br/>\nMy life has been a poor attempt<br/>\nTo imitate the man<br/>\nI&#39;m just a living legacy<br/>\nTo the leader of the band<br/>\nI am the living legacy<br/>\nTo the leader of the band.<\/p>\n<\/font>\n<p><br/>\n<font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">獨生子，孤單而任性<br/>\n他父親是做傢俱的<br/>\n但他的雙手註定要做別的事<br/>\n沒有人看得出來<br/>\n他離開老家，走上一條孤單<br/>\n寂寞的路<br/>\n他送我一份禮物，我知道<br/>\n我永遠無法回報<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">話不多的音樂人<br/>\n拒絕了比較容易走的路<br/>\n他原本打算當個軍人<br/>\n但音樂情人可不願意等<br/>\n後來他贏得情人的愛，靠著紀律<br/>\n以及如雷、如絲的手<br/>\n他的手法如此輕柔，用以刻劃心靈深處的感動<br/>\n多年之後我才領悟<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">樂隊指揮累了<br/>\n不再耳聰目明<br/>\n但他的血液在我體內流動<br/>\n他的歌聲住在我心裡<br/>\n我這一生只是一場失敗的嘗試<br/>\n嘗試模仿他<br/>\n我不過是一個會呼吸的遺產<br/>\n列在樂隊指揮的名下<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">我的兄弟有著不同的人生<br/>\n因為他們聽到不同的召喚<br/>\n一個去芝加哥<br/>\n另一個去聖保羅<br/>\n而我來到柯羅拉多<br/>\n我可不是來渡假的<br/>\n這是我所選擇的生活方式<br/>\n現在我已完全融入<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">謝謝你，給我音樂<br/>\n以及你的故事，走出自己的路<br/>\n謝謝你，給我自由<br/>\n當我離去的時刻來臨<br/>\n謝謝你，因為你的慈祥<br/>\n也因為你的嚴厲<br/>\n爸比，我想我永遠也說不夠&hellip;<br/>\n我愛你<\/font><font size=\"3\"><\/font><\/p>", "comments": [{"name": "", "date": "2008-06-20 09:21:18", "url": "", "text": "看來...冬天已經過了.....", "reply": "", "reply_date": "", "hidden": false, "spam": false}]}, {"id": "12214091", "title": "Faithfully", "date": "2008-06-16 17:39:00", "cat": "3966258", "private": false, "html": "<p align=\"center\"><img loading=\"lazy\" alt=\"\" src=\"\" data-lost=\"35/1777051115.jpg\"/><\/p>\n<p><span style=\"FONT-FAMILY:Times New Roman;\"><font size=\"5\">Faithfully<\/font><br/>\n<br/>\n<font size=\"3\"><a href=\"http://tw.youtube.com/watch?v=OKorl7Ouht0\" target=\"_blank\">(performed by Journey)<br/>\n<\/a><\/font><\/span><font size=\"4\"><br/>\n<span style=\"FONT-FAMILY:Times New Roman;\">Highway run<br/>\nInto the midnight sun<br/>\nWheels go round and round<br/>\nYou&#39;re on my mind<br/>\nRestless hearts<br/>\nSleep alone tonight<br/>\nSendin all my love<br/>\nAlong the wire<\/span><\/font><\/p>\n<p><span style=\"FONT-FAMILY:Times New Roman;\"><font size=\"4\">They say that the road<br/>\nAin&#39;t no place to start a family<br/>\nRight down the line<br/>\nIt&#39;s been you and me<br/>\nAnd loving a music man<br/>\nAin&#39;t always what it&#39;s supposed to be<br/>\nOh girl you stand by me<br/>\nI&#39;m forever yours...faithfully<\/font><\/span><\/p>\n<p><span style=\"FONT-FAMILY:Times New Roman;\"><font size=\"4\">Circus life<br/>\nUnder the big top world<br/>\nWe all need the clowns<br/>\nTo make us smile <br/>\nThrough space and time<br/>\nAlways another show<br/>\nWondering where I am<br/>\nLost without you<\/font><\/span><\/p>\n<p><span style=\"FONT-FAMILY:Times New Roman;\"><font size=\"4\">And being apart ain&#39;t easy<br/>\nOn this love affair<br/>\nTwo strangers learn to fall in love again<br/>\nI get the joy<br/>\nOf rediscovering you<br/>\nOh girl, you stand by me<br/>\nI&#39;m forever yours...faithfully<br/>\nOh, oh, oh, oh<br/>\nFaithfully, I&#39;m still yours<br/>\nI&#39;m forever yours<br/>\nEver yours...faithfully<\/font><\/span><\/p>\n<p><br/>\n<font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">車子在高速公路上奔馳<br/>\n這條路通往北極<br/>\n車輪轉啊轉<br/>\n好似你在我的心裡轉啊轉<br/>\n停不下來的心<br/>\n今晚又得一個人睡<br/>\n只好把愛傳給你<br/>\n用電話線<\/font><\/p>\n<p><font size=\"4\" face=\"&#x006a19;&#x006977;&#x009ad4;\">他們說，一旦走上這條路<br/>\n就很難兼顧家庭<br/>\n像現在透過電話<br/>\n彼此連繫<br/>\n和一個玩音樂的人談戀愛<br/>\n從來就不是大家看好的選項<br/>\n女孩啊　你卻站在我身邊<br/>\n<span style=\"FONT-FAMILY:Times New Roman;\">I&#39;m forever yours...faithfully<\/s
