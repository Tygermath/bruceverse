      ${cc['0'] ? `<br><a href="#/cat/0">Uncategorized Articles(${cc['0']})</a>` : ''}</div>
    <div class="sidetitle">Monthly Archives</div>
    <div class="side"><a href="#/">All Articles</a><br>
      <select id="monthSel" aria-label="Monthly Archives"><option value="">- Monthly Archives -</option>
      ${Object.keys(mc).sort().reverse().map(m => `<option value="${m}">${MONTHS[+m.slice(5) - 1]} ${m.slice(0, 4)}(${mc[m]})</option>`).join('')}</select></div>
    <div class="sidetitle">Search This Blog</div>
    <div class="side"><input type="search" id="q" placeholder="標題、內文…"></div>
    <div class="sidetitle">Recent Comments</div>
    <div class="side">${recentCmts.map(c => `<a href="#/post/${c.post.id}">Re: ${esc(c.post.title)}</a> , by ${esc(c.name || '(匿名)')} (${MONTHS[+c.date.slice(5, 7) - 1].slice(0, 3)} ${+c.date.slice(8, 10)})`).join('<br>')}</div>
    <div class="sidetitle">Links</div>
    <div class="side">${D.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a>`).join('<br>')}</div>
    <div class="sidetitle">Visitors Counter</div>
    <div class="side">Total Visitors: ${esc(I.visitors)}</div>`;
  document.getElementById('monthSel').onchange = e => { if (e.target.value) location.hash = '#/month/' + e.target.value; };
  let timer;
  document.getElementById('q').oninput = e => {
    clearTimeout(timer);
    const v = e.target.value.trim();
    timer = setTimeout(() => { location.hash = v ? '#/search/' + encodeURIComponent(v) : '#/'; }, 300);
  };
}

// ---------- 網誌 ----------
function postedLine(p) {
  return `<div class="posted">${esc(I.id)} at 無名小站 at ${clock(p.date)} post | <a href="#/post/${p.id}">Reply(${p.comments.filter(c => !c.spam).length})</a>
    | <a href="#/cat/${p.cat}">${esc(catName(p.cat))}</a>${p.private ? '<span class="badge">原為非公開</span>' : ''}</div>`;
}

function navi(base, page, total) {
  if (total <= 1) return '';
  return '<div class="navi">' + Array.from({ length: total }, (_, i) => i + 1 === page ? `<span>${i + 1}</span>` : `<a href="${base}/p${i + 1}">${i + 1}</a>`).join('') + '</div>';
}

function listView(list, heading, base, page, q) {
  const total = Math.max(1, Math.ceil(list.length / PER));
  page = Math.min(Math.max(1, page), total);
  let lastDate = '', out = heading ? `<div class="heading">${heading}</div>` : '';
  out += list.slice((page - 1) * PER, page * PER).map(p => {
    const d = longDate(p.date), showDate = d !== lastDate; lastDate = d;
    let ex = p.plain;
    if (q) { const i = ex.toLowerCase().indexOf(q.toLowerCase()); if (i > 60) ex = '…' + ex.slice(i - 60); }
    return `${showDate ? `<div class="date">${d}</div>` : ''}
      <div class="blogbody"><h3 class="title"><a href="#/post/${p.id}">${esc(p.title)}</a></h3>
      <div class="articletext">${esc(ex.slice(0, 160))}${ex.length > 160 ? '……' : ''}<br><a class="more" href="#/post/${p.id}">(More......)</a></div>
      ${postedLine(p)}</div>`;
  }).join('') || '<p class="note">找不到符合的文章。</p>';
  main.innerHTML = out + navi(base, page, total);
}

function commentBlock(c, i) {
  return `<div class="cmt"><div class="floor">${i}樓${c.hidden ? '（悄悄話）' : ''}</div>
    <div>${c.text}</div>
    <div class="by">${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="nofollow noopener">${esc(c.name || '(匿名)')}</a>` : esc(c.name || '(匿名)')} at ${longDate(c.date)} ${clock(c.date)} comment</div>
    ${c.reply ? `<div class="owner">${c.reply}<div class="by">${esc(I.id)}${c.reply_date ? ` at ${longDate(c.reply_date)} ${clock(c.reply_date)}` : ''} comment</div></div>` : ''}</div>`;
}

function postView(p) {
  const i = posts.indexOf(p), newer = posts[i - 1], older = posts[i + 1];
  const good = p.comments.filter(c => !c.spam), spam = p.comments.filter(c => c.spam);
  main.innerHTML = `<div class="date">${longDate(p.date)}</div>
    <div class="blogbody"><h3 class="title">${esc(p.title)}</h3>
      <div class="articletext">${p.html}</div>
      ${postedLine(p)}
      ${p.comments.length ? `<div class="comments-head">Reply</div>${good.map((c, k) => commentBlock(c, k + 1)).join('')}
        ${spam.length ? `<button class="toggle" data-show="spamc">顯示 ${spam.length} 則廣告回應</button>
          <div id="spamc" hidden>${spam.map((c, k) => commentBlock(c, good.length + k + 1)).join('')}</div>` : ''}` : ''}
    </div>
    <div class="pager"><span>${older ? `<a href="#/post/${older.id}">« ${esc(older.title)}</a>` : ''}</span>
      <span style="text-align:right">${newer ? `<a href="#/post/${newer.id}">${esc(newer.title)} »</a>` : ''}</span></div>`;
  document.title = `${p.title} - ${I.name}`;
}

// ---------- 相簿 ----------
function albumList(catId) {
  const acats = Object.entries(D.albumCats).sort((a, b) => a[1].order - b[1].order);
  const cnt = {}; D.albums.forEach(a => cnt[a.cat] = (cnt[a.cat] || 0) + 1);
  const list = catId ? D.albums.filter(a => a.cat === catId) : D.albums;
  main.innerHTML = `<div class="heading">${esc(I.id)}'s AlbumList<small>${D.albums.length} Albums</small></div>
    <p class="note">相簿原有 ${D.albums.reduce((s, a) => s + a.count, 0)} 張照片，照片檔案在無名關站時沒有隨備份一起提供，目前只從網路典藏找回少數封面與照片。</p>
    <div class="cats"><a href="#/album" class="${catId ? '' : 'on'}">- All -</a>${acats.filter(([id]) => cnt[id]).map(([id, c]) =>
      `<a href="#/album/cat/${id}" class="${id === catId ? 'on' : ''}">${esc(c.name)} (${cnt[id]})</a>`).join('')}</div>
    <div class="albums">${list.map(a => `<a class="album" href="#/album/${a.id}">
      <div class="cover">${a.cover ? `<img src="${a.cover}" alt="" loading="lazy">` : '<span>▦</span>'}</div>
      <div class="name">${esc(a.name)}</div>
      <div class="meta">${a.count} pictures${a.locked ? ' · 🔒' : ''}${a.hidden ? ' · 隱藏' : ''}</div></a>`).join('')}</div>`;
}

function albumView(a) {
  const lockedMsg = a.locked && !I.full ? '這是密碼相簿，原站訪客需要密碼才能觀看，因此公開版不顯示內容。' : '';
  main.innerHTML = `<div class="heading">${esc(a.name)}<small>${a.count} pictures · 更新於 ${a.updated.slice(0, 10)}</small></div>
    <div class="blogbody">
      ${a.desc ? `<div class="articletext">${esc(a.desc)}</div>` : ''}
      <p>${lockedMsg || (a.photos.length ? `原有 ${a.count} 個檔案，從網路典藏找回 ${a.photos.length} 張照片。` : `原有 ${a.count} 個檔案，照片均已遺失。`)}</p>
      ${a.photos.length ? `<div class="photos">${a.photos.map(src => `<a href="${src}" target="_blank" style="background:#fff"><img src="${src}" loading="lazy" alt=""></a>`).join('')}</div>` : ''}
      ${a.media.length ? `<ul class="medialist">${a.media.map(m => `<li>${m.thumb ? `<img src="${m.thumb}" alt="">` : (m.type === 'mp3' ? '🎵' : '🎬')}
        <div>${esc(m.title)}${m.desc ? ` — ${esc(m.desc)}` : ''}${m.len ? ` <small>(${esc(m.len)})</small>` : ''}<br><small>檔案已隨無名小站關閉而遺失</small></div></li>`).join('')}</ul>` : ''}
    </div>
    <p class="navi"><a href="#/album">« 回相簿列表</a></p>`;
  document.title = `${a.name} - ${I.name}`;
}

// ---------- 留言板 ----------
function gbEntry(g) {
  return `<div class="blogbody gb ${g.kind}">
    <div class="row"><b>${esc(g.subject || '(無主題)')}</b></div>
    <div class="row">Name：${g.url ? `<a href="${esc(g.url)}" target="_blank" rel="nofollow noopener">${esc(g.name)}</a>` : esc(g.name)}　Time：${esc(g.date)}${g.kind === 'system' ? '　<span class="badge">站方通知</span>' : ''}</div>
    <div class="msg">${g.text}</div>
    ${g.reply ? `<div class="cmt"><div class="owner">${g.reply}<div class="by">${esc(I.id)} 回覆</div></div></div>` : ''}</div>`;
}

function guestbookView() {
  const real = D.guestbook.filter(g => g.kind !== 'spam'), spam = D.guestbook.filter(g => g.kind === 'spam');
  main.innerHTML = `<div class="heading">${esc(I.id)}'s Guestbook<small>${D.guestbook.length} Messages</small></div>
    <p class="note">共 ${D.guestbook.length} 則留言，其中 ${spam.length} 則是 2009 年後灌入的廣告，預設收起。</p>
    ${real.map(gbEntry).join('')}
    ${spam.length ? `<button class="toggle" data-show="spamg" style="color:#003366;border-color:#003366">顯示 ${spam.length} 則廣告留言</button>
      <div id="spamg" hidden style="margin-top:10px">${spam.map(gbEntry).join('')}</div>` : ''}`;
}

// ---------- 嘀咕 ----------
function diguView() {
  const groups = {};
  D.digu.forEach(d => (groups[d.section] = groups[d.section] || []).push(d));
  main.innerHTML = `<div class="heading">嘀咕 Digu<small>${D.digu.length} 則</small></div>
    <p class="note">嘀咕是無名小站的微網誌功能。備份裡只有好友的嘀咕（${[...new Set(D.digu.map(d => d.who))].join('、')}）。</p>
    ${Object.entries(groups).map(([sec, list]) => `<div class="date">${esc(sec)}</div>${list.map(d => `
      <div class="blogbody digu"><span class="who">${esc(d.who)}</span><span class="when">${esc(d.date)}</span>
      <div>${esc(d.text).replace(/\n/g, '<br>')}</div></div>`).join('')}`).join('')}`;
}

// ---------- 影音 ----------
function videoView() {
  const all = D.albums.flatMap(a => a.media.map(m => ({ ...m, album: a })));
  const vids = all.filter(m => m.type === 'flv'), mp3 = all.filter(m => m.type === 'mp3');
  const row = m => `<li>${m.thumb ? `<img src="${m.thumb}" alt="">` : (m.type === 'mp3' ? '🎵' : '🎬')}
    <div>${esc(m.title)}${m.desc ? ` — ${esc(m.desc)}` : ''}${m.len ? ` <small>(${esc(m.len)})</small>` : ''}<br>
    <small>相簿：<a href="#/album/${m.album.id}" style="color:#fff">${esc(m.album.name)}</a></small></div></li>`;
  main.innerHTML = `<div class="heading">影音<small>${vids.length} 部影片 · ${mp3.length} 首音樂</small></div>
    <p class="note">以下是備份清單中記錄的影音檔名稱。檔案本身存放在無名的伺服器上，已隨關站遺失。</p>
    <div class="blogbody"><b>影片</b><ul class="medialist">${vids.map(row).join('')}</ul></div>
    <div class="blogbody"><b>音樂</b><ul class="medialist">${mp3.map(row).join('')}</ul></div>`;
}

// ---------- 個人資料 ----------
function profileView() {
  main.innerHTML = `<div class="heading">Profile</div>
    <div class="blogbody">
      <img class="avatar" src="avatar.jpg" alt="" onerror="this.remove()" style="float:right;margin-left:12px">
      <p><b>Nickname：</b>${esc(I.nickname)}</p>
      <p><b>Introduction：</b><br>${esc(I.intro)}</p>
      <p><b>Topic：</b>${esc(I.topic)}</p>
      <p><b>My Friends：</b>${I.friends.map(esc).join('、')}</p>
      <p style="clear:both"><b>網誌：</b>${esc(I.name)} — ${esc(I.desc)}<br>共 ${posts.length} 篇文章、${D.albums.length} 本相簿</p>
    </div>`;
}

// ---------- 路由 ----------
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean).map(decodeURIComponent);
  let page = 1;
  if (parts.length && /^p\d+$/.test(parts[parts.length - 1])) page = +parts.pop().slice(1);
  const [kind, arg, arg2] = parts;
  document.title = I.name;
  let tab = 'blog';
  if (kind === 'post' && byId[arg]) postView(byId[arg]);
  else if (kind === 'cat') listView(posts.filter(p => p.cat === arg), `Category：${esc(catName(arg))}`, `#/cat/${arg}`, page);
  else if (kind === 'month') listView(posts.filter(p => p.month === arg), `${MONTHS[+arg.slice(5) - 1]} ${arg.slice(0, 4)}`, `#/month/${arg}`, page);
  else if (kind === 'search' && arg) {
    const q = arg.toLowerCase();
    const hits = posts.filter(p => p.title.toLowerCase().includes(q) || p.plain.toLowerCase().includes(q));
    listView(hits, `搜尋「${esc(arg)}」：${hits.length} 篇`, `#/search/${encodeURIComponent(arg)}`, page, arg);
  }
  else if (kind === 'album') {
    tab = 'album';
    if (arg === 'cat') albumList(arg2);
    else if (arg && albumById[arg]) albumView(albumById[arg]);
    else albumList();
  }
  else if (kind === 'guestbook') { tab = 'guestbook'; guestbookView(); }
  else if (kind === 'digu') { tab = 'digu'; diguView(); }
  else if (kind === 'video') { tab = 'video'; videoView(); }
  else if (kind === 'profile') { tab = 'profile'; profileView(); }
  else listView(posts, '', '#', page);
  document.querySelectorAll('#menu a').forEach(a => a.classList.toggle('on', a.dataset.k === tab));
  // 找不回來的圖片：顯示說明框
  main.querySelectorAll('img[data-lost]').forEach(img => {
    const s = document.createElement('span');
    s.className = 'lost';
    s.textContent = '（圖片已隨無名小站關閉而遺失）';
    img.replaceWith(s);
  });
  if (kind !== 'search') { const q = document.getElementById('q'); if (q) q.value = ''; }
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-show]');
  if (b) { document.getElementById(b.dataset.show).hidden = false; b.remove(); }
});
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName === 'IMG' && !img.dataset.lost && main.contains(img)) {
    img.dataset.lost = 1;
    const s = document.createElement('span'); s.className = 'lost'; s.textContent = '（圖片無法載入）';
    img.replaceWith(s);
  }
}, true);

sidebar();
window.addEventListener('hashchange', route);
route();
</script>
